<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 698" width="1200" height="698" role="img" aria-labelledby="t d"><title id="t">Gmail, mapped</title><desc id="d">The 19 Gmail permissions placed in 4 verbs (Search the mail, Draft, Send, Tidy) and four rows, from Cannot be repaired to Harmless. Reading and drafting sit in Harmless; a mail that leaves for a client cannot be called back.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#0E1215} .surface{fill:#151A1F} .ink{fill:#E8ECEF} .muted{fill:#A3ADB7} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#8FB0FF} .accentS{stroke:#8FB0FF} .accentSoft{fill:#17254A} .accentInk{fill:#CBD9FF} .accentInkS{stroke:#CBD9FF} .vault{fill:#1C2228} .human{fill:#3CC9BD} .humanS{stroke:#3CC9BD} .humanSoft{fill:#0D302D} .humanInk{fill:#8EE6DC} .agent{fill:#A990F0} .agentS{stroke:#A990F0} .agentSoft{fill:#26203D} .agentInk{fill:#D6CBFA} .ok{fill:#3DDC84} .okS{stroke:#3DDC84} .okSoft{fill:#0D3320} .okInk{fill:#7EEAAA} .ask{fill:#8FB0FF} .askS{stroke:#8FB0FF} .askSoft{fill:#17254A} .askInk{fill:#CBD9FF} .stop{fill:#FF6B6B} .stopS{stroke:#FF6B6B} .stopSoft{fill:#3F1215} .stopInk{fill:#FFA3A3} .r1{fill:#A1E3B7} .r1Soft{fill:#173221} .r1B{stroke:#2C5A3B} .r2{fill:#C8D2DD} .r2Soft{fill:#282C30} .r2B{stroke:#41474E} .r3{fill:#EAC3E5} .r3Soft{fill:#342633} .r3B{stroke:#5A4058} .r4{fill:#FFBCEE} .r4Soft{fill:#48203C} .r4B{stroke:#74365F} .inkS{stroke:#E8ECEF} .mutedS{stroke:#A3ADB7} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#0E1215} .onAccentS{stroke:#0E1215} svg{--s:#151A1F}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker><marker id="m-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ask"/></marker><marker id="m-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="stop"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok"/></marker><marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="agent"/></marker><marker id="m-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="human"/></marker></defs><rect x="0" y="0" width="1200" height="698" rx="24" class="bg line thin"/><g transform="translate(64 46) scale(1.3333)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/></g><text x="108" y="72" font-size="28" text-anchor="start" class="ink b" xml:space="preserve">Gmail, mapped</text><text x="64" y="102" font-size="16" text-anchor="start" class="muted" xml:space="preserve">19 permissions, 4 verbs, ordered by how hard each is to repair. Notion has 14, Google Calendar 10: same rows, their own verbs.</text><text x="240" y="160" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">Search the mail</text><text x="240" y="180" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">8 permissions</text><text x="560" y="160" font-size="17" text-anchor="start" class="ink b" xml:space="preserve">Draft</text><text x="560" y="180" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">4 permissions</text><text x="770" y="160" font-size="17" text-anchor="start" class="ink b" xml:space="preserve">Send</text><text x="770" y="180" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">4 permissions</text><text x="980" y="160" font-size="17" text-anchor="start" class="ink b" xml:space="preserve">Tidy</text><text x="980" y="180" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">3 permissions</text><rect x="56" y="198" width="1080" height="80" rx="12" class="r4Soft r4B thin"/><text x="72" y="226" font-size="14" text-anchor="start" class="r4 b" xml:space="preserve">Cannot be repaired</text><text x="72" y="248" font-size="11.5" text-anchor="start" class="muted mono" xml:space="preserve">irreversible</text><rect x="768" y="212" width="92" height="28" rx="14" class="surface line thin"/><text x="814" y="231" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">To clients</text><rect x="868" y="212" width="85" height="28" rx="14" class="surface line thin"/><text x="910" y="231" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">To anyone</text><rect x="56" y="286" width="1080" height="80" rx="12" class="r3Soft r3B thin"/><text x="72" y="314" font-size="14" text-anchor="start" class="r3 b" xml:space="preserve">Repairable,</text><text x="72" y="332" font-size="14" text-anchor="start" class="r3 b" xml:space="preserve">at a price</text><text x="72" y="354" font-size="11.5" text-anchor="start" class="muted mono" xml:space="preserve">costly to undo</text><rect x="768" y="300" width="113" height="28" rx="14" class="surface line thin"/><text x="824" y="319" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">To colleagues</text><rect x="56" y="374" width="1080" height="80" rx="12" class="r2Soft r2B thin"/><text x="72" y="402" font-size="14" text-anchor="start" class="r2 b" xml:space="preserve">Worth a look</text><text x="72" y="424" font-size="11.5" text-anchor="start" class="muted mono" xml:space="preserve">personal data · in bulk</text><rect x="238" y="388" width="134" height="28" rx="14" class="surface line thin"/><text x="305" y="407" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Sensitive labels</text><rect x="380" y="388" width="99" height="28" rx="14" class="surface line thin"/><text x="430" y="407" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Bulk search</text><rect x="978" y="388" width="113" height="28" rx="14" class="surface line thin"/><text x="1034" y="407" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Label in bulk</text><rect x="56" y="462" width="1080" height="168" rx="12" class="r1Soft r1B thin"/><text x="72" y="490" font-size="14" text-anchor="start" class="r1 b" xml:space="preserve">Harmless</text><rect x="238" y="476" width="141" height="28" rx="14" class="surface line thin"/><text x="308" y="495" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Mailbox structure</text><rect x="387" y="476" width="113" height="28" rx="14" class="surface line thin"/><text x="444" y="495" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Notifications</text><rect x="238" y="512" width="134" height="28" rx="14" class="surface line thin"/><text x="305" y="531" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Colleagues’ mail</text><rect x="380" y="512" width="113" height="28" rx="14" class="surface line thin"/><text x="436" y="531" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Clients’ mail</text><rect x="238" y="548" width="127" height="28" rx="14" class="surface line thin"/><text x="302" y="567" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Unknown senders</text><rect x="373" y="548" width="64" height="28" rx="14" class="surface line thin"/><text x="405" y="567" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Drafts</text><rect x="558" y="476" width="85" height="28" rx="14" class="surface line thin"/><text x="600" y="495" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Any draft</text><rect x="558" y="512" width="99" height="28" rx="14" class="surface line thin"/><text x="608" y="531" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">To yourself</text><rect x="558" y="548" width="113" height="28" rx="14" class="surface line thin"/><text x="614" y="567" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">To colleagues</text><rect x="558" y="584" width="92" height="28" rx="14" class="surface line thin"/><text x="604" y="603" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">To clients</text><rect x="768" y="476" width="99" height="28" rx="14" class="surface line thin"/><text x="818" y="495" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">To yourself</text><rect x="978" y="476" width="120" height="28" rx="14" class="surface line thin"/><text x="1038" y="495" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Label a thread</text><rect x="978" y="512" width="120" height="28" rx="14" class="surface line thin"/><text x="1038" y="531" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Create a label</text><line x1="546" y1="140" x2="546" y2="630" class="line thin dash"/><line x1="756" y1="140" x2="756" y2="630" class="line thin dash"/><line x1="966" y1="140" x2="966" y2="630" class="line thin dash"/><text x="64" y="664" font-size="14" text-anchor="start" class="muted" xml:space="preserve">Anything else: one catch-all permission for a write no entry describes. It is never on the map, and never granted without being named.</text></svg>
