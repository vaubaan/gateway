<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">You tick verbs, Vaubaan writes the lines</title><desc id="d">Ticking Search and Send at Trusting on a Gmail account writes 12 explicit lines: reading runs freely, and every mail that leaves for someone else asks first. Limits are the base budgets times three. Draft and Tidy stay out.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#FBFBF9} .surface{fill:#FFFFFF} .ink{fill:#1B2128} .muted{fill:#56606B} .line{stroke:#DDE1E6} .lineF{fill:#DDE1E6} .accent{fill:#2F55C7} .accentS{stroke:#2F55C7} .accentSoft{fill:#E8EDFB} .accentInk{fill:#1F3F9E} .accentInkS{stroke:#1F3F9E} .vault{fill:#F1F2F4} .human{fill:#0B7F77} .humanS{stroke:#0B7F77} .humanSoft{fill:#D8F3F0} .humanInk{fill:#0B5F59} .agent{fill:#7A5FD0} .agentS{stroke:#7A5FD0} .agentSoft{fill:#EFEAFB} .agentInk{fill:#4E3A99} .ok{fill:#13995A} .okS{stroke:#13995A} .okSoft{fill:#DCF7E7} .okInk{fill:#0B6B3C} .ask{fill:#2F55C7} .askS{stroke:#2F55C7} .askSoft{fill:#E8EDFB} .askInk{fill:#1F3F9E} .stop{fill:#C81E2A} .stopS{stroke:#C81E2A} .stopSoft{fill:#FDE4E4} .stopInk{fill:#A3121E} .r1{fill:#005F2E} .r1Soft{fill:#DFF8E6} .r1B{stroke:#A6E3BB} .r2{fill:#434E5A} .r2Soft{fill:#EDF1F5} .r2B{stroke:#CFD7E0} .r3{fill:#663B63} .r3Soft{fill:#FAEBF8} .r3B{stroke:#E6C3E2} .r4{fill:#70155A} .r4Soft{fill:#FFDCF8} .r4B{stroke:#F1A6DD} .inkS{stroke:#1B2128} .mutedS{stroke:#56606B} .term{fill:#15191D} .termInk{fill:#E6EAEE} .termMuted{fill:#97A1AC} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#FFFFFF} .onAccentS{stroke:#FFFFFF} svg{--s:#FFFFFF}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker><marker id="m-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ask"/></marker><marker id="m-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="stop"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok"/></marker><marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="agent"/></marker><marker id="m-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="human"/></marker></defs><rect x="0" y="0" width="1200" height="560" rx="24" class="bg line thin"/><text x="64" y="72" font-size="28" text-anchor="start" class="ink b" xml:space="preserve">You tick verbs. Vaubaan writes the lines.</text><text x="64" y="102" font-size="16" text-anchor="start" class="muted" xml:space="preserve">The trust level of a verb sets each gate from the row, and multiplies the limits ×1, ×3 or ×10.</text><rect x="56" y="150" width="300" height="288" rx="16" class="surface line thin"/><rect x="56" y="150" width="300" height="40" rx="16" class="vault"/><rect x="56" y="174" width="300" height="16" class="vault"/><line x1="56" y1="190" x2="356" y2="190" class="line thin"/><rect x="56" y="150" width="300" height="288" rx="16" class="nofill line thin"/><text x="74" y="176" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">      Gmail · you@studio.fr</text><g transform="translate(72 159) scale(0.9167)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/></g><rect x="78" y="215" width="20" height="20" rx="5" class="accent"/><path d="M83 225 l4 4 l7 -8" fill="none" class="onAccentS" stroke-width="2.4"/><text x="110" y="230" font-size="16" text-anchor="start" class="ink b" xml:space="preserve">Search the mail</text><rect x="244" y="210" width="92" height="28" rx="14.0" class="accentSoft"/><text x="290.0" y="228.5" font-size="12.5" text-anchor="middle" class="accentInk sb" xml:space="preserve">Trusting</text><rect x="78" y="267" width="20" height="20" rx="5" class="surface line mid"/><text x="110" y="282" font-size="16" text-anchor="start" class="muted sb" xml:space="preserve">Draft</text><rect x="78" y="319" width="20" height="20" rx="5" class="accent"/><path d="M83 329 l4 4 l7 -8" fill="none" class="onAccentS" stroke-width="2.4"/><text x="110" y="334" font-size="16" text-anchor="start" class="ink b" xml:space="preserve">Send</text><rect x="244" y="314" width="92" height="28" rx="14.0" class="accentSoft"/><text x="290.0" y="332.5" font-size="12.5" text-anchor="middle" class="accentInk sb" xml:space="preserve">Trusting</text><rect x="78" y="371" width="20" height="20" rx="5" class="surface line mid"/><text x="110" y="386" font-size="16" text-anchor="start" class="muted sb" xml:space="preserve">Tidy</text><text x="78" y="420" font-size="13" text-anchor="start" class="muted" xml:space="preserve">2 ticks, 1 choice</text><rect x="636" y="156" width="84" height="300" rx="12" class="accentSoft"/><text x="594.0" y="178" font-size="12.5" text-anchor="middle" class="muted sb" xml:space="preserve">Careful</text><text x="678.0" y="178" font-size="12.5" text-anchor="middle" class="accentInk b" xml:space="preserve">Trusting</text><text x="762.0" y="178" font-size="12.5" text-anchor="middle" class="muted sb" xml:space="preserve">Autonomous</text><rect x="384" y="205" width="146" height="26" rx="13" class="r4Soft r4B thin"/><text x="394" y="223" font-size="12.5" text-anchor="start" class="r4 b" xml:space="preserve">Cannot be repaired</text><circle cx="594.0" cy="218" r="10" class="stop"/><path d="M590.0 214 l8 8 M598.0 214 l-8 8" fill="none" stroke-width="2.4" stroke="#FFFFFF"/><rect x="671.0" y="211" width="14" height="14" rx="2" class="ask" transform="rotate(45 678.0 218)"/><rect x="755.0" y="211" width="14" height="14" rx="2" class="ask" transform="rotate(45 762.0 218)"/><rect x="384" y="255" width="174" height="26" rx="13" class="r3Soft r3B thin"/><text x="394" y="273" font-size="12.5" text-anchor="start" class="r3 b" xml:space="preserve">Repairable, at a price</text><rect x="587.0" y="261" width="14" height="14" rx="2" class="ask" transform="rotate(45 594.0 268)"/><rect x="671.0" y="261" width="14" height="14" rx="2" class="ask" transform="rotate(45 678.0 268)"/><circle cx="762.0" cy="268" r="10" class="ok"/><path d="M757.0 268 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><rect x="384" y="305" width="104" height="26" rx="13" class="r2Soft r2B thin"/><text x="394" y="323" font-size="12.5" text-anchor="start" class="r2 b" xml:space="preserve">Worth a look</text><rect x="587.0" y="311" width="14" height="14" rx="2" class="ask" transform="rotate(45 594.0 318)"/><circle cx="678.0" cy="318" r="10" class="ok"/><path d="M673.0 318 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><circle cx="762.0" cy="318" r="10" class="ok"/><path d="M757.0 318 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><rect x="384" y="355" width="76" height="26" rx="13" class="r1Soft r1B thin"/><text x="394" y="373" font-size="12.5" text-anchor="start" class="r1 b" xml:space="preserve">Harmless</text><circle cx="594.0" cy="368" r="10" class="ok"/><path d="M589.0 368 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><circle cx="678.0" cy="368" r="10" class="ok"/><path d="M673.0 368 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><circle cx="762.0" cy="368" r="10" class="ok"/><path d="M757.0 368 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><text x="392" y="423" font-size="13" text-anchor="start" class="ink sb" xml:space="preserve">Limits</text><text x="594.0" y="423" font-size="14" text-anchor="middle" class="muted b" xml:space="preserve">×1</text><text x="678.0" y="423" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve">×3</text><text x="762.0" y="423" font-size="14" text-anchor="middle" class="muted b" xml:space="preserve">×10</text><circle cx="420" cy="495" r="10" class="ok"/><path d="M415 495 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><text x="438" y="500" font-size="13" text-anchor="start" class="muted" xml:space="preserve">runs freely</text><rect x="533" y="488" width="14" height="14" rx="2" class="ask" transform="rotate(45 540 495)"/><text x="556" y="500" font-size="13" text-anchor="start" class="muted" xml:space="preserve">asks you first</text><circle cx="680" cy="495" r="10" class="stop"/><path d="M676 491 l8 8 M684 491 l-8 8" fill="none" stroke-width="2.4" stroke="#FFFFFF"/><text x="698" y="500" font-size="13" text-anchor="start" class="muted" xml:space="preserve">left out</text><rect x="850" y="130" width="310" height="374" rx="16" class="surface line thin"/><rect x="850" y="130" width="310" height="40" rx="16" class="accentSoft"/><rect x="850" y="154" width="310" height="16" class="accentSoft"/><line x1="850" y1="170" x2="1160" y2="170" class="line thin"/><rect x="850" y="130" width="310" height="374" rx="16" class="nofill line thin"/><text x="868" y="156" font-size="15" text-anchor="start" class="accentInk b" xml:space="preserve">The mission holds 12 lines</text><text x="868" y="196" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Mailbox structure</text><g transform="translate(1032 192) scale(0.7) translate(-1032 -192)"><circle cx="1032" cy="192" r="10" class="ok"/><path d="M1027 192 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/></g><text x="1142" y="196" font-size="12" text-anchor="end" class="muted" xml:space="preserve">6 000 a day</text><text x="868" y="222" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Notifications</text><g transform="translate(1032 218) scale(0.7) translate(-1032 -218)"><circle cx="1032" cy="218" r="10" class="ok"/><path d="M1027 218 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/></g><text x="1142" y="222" font-size="12" text-anchor="end" class="muted" xml:space="preserve">3 000 a day</text><text x="868" y="248" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Colleagues’ mail</text><g transform="translate(1032 244) scale(0.7) translate(-1032 -244)"><circle cx="1032" cy="244" r="10" class="ok"/><path d="M1027 244 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/></g><text x="1142" y="248" font-size="12" text-anchor="end" class="muted" xml:space="preserve">1 500 a day</text><text x="868" y="274" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Clients’ mail</text><g transform="translate(1032 270) scale(0.7) translate(-1032 -270)"><circle cx="1032" cy="270" r="10" class="ok"/><path d="M1027 270 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/></g><text x="1142" y="274" font-size="12" text-anchor="end" class="muted" xml:space="preserve">1 500 a day</text><text x="868" y="300" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Unknown senders</text><g transform="translate(1032 296) scale(0.7) translate(-1032 -296)"><circle cx="1032" cy="296" r="10" class="ok"/><path d="M1027 296 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/></g><text x="1142" y="300" font-size="12" text-anchor="end" class="muted" xml:space="preserve">600 a day</text><text x="868" y="326" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Drafts</text><g transform="translate(1032 322) scale(0.7) translate(-1032 -322)"><circle cx="1032" cy="322" r="10" class="ok"/><path d="M1027 322 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/></g><text x="1142" y="326" font-size="12" text-anchor="end" class="muted" xml:space="preserve">600 a day</text><text x="868" y="352" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Sensitive labels</text><g transform="translate(1032 348) scale(0.7) translate(-1032 -348)"><circle cx="1032" cy="348" r="10" class="ok"/><path d="M1027 348 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/></g><text x="1142" y="352" font-size="12" text-anchor="end" class="muted" xml:space="preserve">150 a day</text><text x="868" y="378" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Bulk search</text><g transform="translate(1032 374) scale(0.7) translate(-1032 -374)"><circle cx="1032" cy="374" r="10" class="ok"/><path d="M1027 374 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/></g><text x="1142" y="378" font-size="12" text-anchor="end" class="muted" xml:space="preserve">60 a day</text><text x="868" y="404" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Send to yourself</text><g transform="translate(1032 400) scale(0.7) translate(-1032 -400)"><circle cx="1032" cy="400" r="10" class="ok"/><path d="M1027 400 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/></g><text x="1142" y="404" font-size="12" text-anchor="end" class="muted" xml:space="preserve">150 a day</text><text x="868" y="430" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Send to colleagues</text><g transform="translate(1032 426) scale(0.7) translate(-1032 -426)"><rect x="1025" y="419" width="14" height="14" rx="2" class="ask" transform="rotate(45 1032 426)"/></g><text x="1142" y="430" font-size="12" text-anchor="end" class="muted" xml:space="preserve">60 a day</text><text x="868" y="456" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Send to clients</text><g transform="translate(1032 452) scale(0.7) translate(-1032 -452)"><rect x="1025" y="445" width="14" height="14" rx="2" class="ask" transform="rotate(45 1032 452)"/></g><text x="1142" y="456" font-size="12" text-anchor="end" class="muted" xml:space="preserve">60 a day</text><text x="868" y="482" font-size="13" text-anchor="start" class="ink" xml:space="preserve">Send to anyone</text><g transform="translate(1032 478) scale(0.7) translate(-1032 -478)"><rect x="1025" y="471" width="14" height="14" rx="2" class="ask" transform="rotate(45 1032 478)"/></g><text x="1142" y="482" font-size="12" text-anchor="end" class="muted" xml:space="preserve">30 a day</text><path d="M358 300 C 384 300, 386 300, 404 300" class="nofill accentS mid" marker-end="url(#m-accent)"/><path d="M812 300 C 840 300, 840 300, 844 300" class="nofill accentS mid" marker-end="url(#m-accent)"/><text x="1005" y="530" font-size="13" text-anchor="middle" class="muted" xml:space="preserve">every line editable, one by one</text></svg>
