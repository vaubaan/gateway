<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">How a call goes through Vaubaan</title><desc id="d">The assistant calls a tool with its mission key. The Gmail plugin names the permission the call needs (sending to a client), Vaubaan checks it against the mission and its limits, then sends with an access the assistant never sees, asks you first, or refuses with what to do. Every call is recorded.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#FBFBF9} .surface{fill:#FFFFFF} .ink{fill:#1B2128} .muted{fill:#56606B} .line{stroke:#DDE1E6} .lineF{fill:#DDE1E6} .accent{fill:#2F55C7} .accentS{stroke:#2F55C7} .accentSoft{fill:#E8EDFB} .accentInk{fill:#1F3F9E} .accentInkS{stroke:#1F3F9E} .vault{fill:#F1F2F4} .human{fill:#0B7F77} .humanS{stroke:#0B7F77} .humanSoft{fill:#D8F3F0} .humanInk{fill:#0B5F59} .agent{fill:#7A5FD0} .agentS{stroke:#7A5FD0} .agentSoft{fill:#EFEAFB} .agentInk{fill:#4E3A99} .ok{fill:#13995A} .okS{stroke:#13995A} .okSoft{fill:#DCF7E7} .okInk{fill:#0B6B3C} .ask{fill:#2F55C7} .askS{stroke:#2F55C7} .askSoft{fill:#E8EDFB} .askInk{fill:#1F3F9E} .stop{fill:#C81E2A} .stopS{stroke:#C81E2A} .stopSoft{fill:#FDE4E4} .stopInk{fill:#A3121E} .r1{fill:#005F2E} .r1Soft{fill:#DFF8E6} .r1B{stroke:#A6E3BB} .r2{fill:#434E5A} .r2Soft{fill:#EDF1F5} .r2B{stroke:#CFD7E0} .r3{fill:#663B63} .r3Soft{fill:#FAEBF8} .r3B{stroke:#E6C3E2} .r4{fill:#70155A} .r4Soft{fill:#FFDCF8} .r4B{stroke:#F1A6DD} .inkS{stroke:#1B2128} .mutedS{stroke:#56606B} .term{fill:#15191D} .termInk{fill:#E6EAEE} .termMuted{fill:#97A1AC} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#FFFFFF} .onAccentS{stroke:#FFFFFF} svg{--s:#FFFFFF}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker><marker id="m-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ask"/></marker><marker id="m-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="stop"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok"/></marker><marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="agent"/></marker><marker id="m-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="human"/></marker></defs><rect x="0" y="0" width="1200" height="560" rx="24" class="bg line thin"/><text x="64" y="72" font-size="28" text-anchor="start" class="ink b" xml:space="preserve">How a call goes through</text><text x="64" y="102" font-size="16" text-anchor="start" class="muted" xml:space="preserve">The same path for every mail, page and event.</text><circle cx="108" cy="268" r="28" class="agent"/><rect x="94.0" y="257.4" width="28.0" height="19.6" rx="5.0" class="surface"/><circle cx="102.4" cy="267.2" r="2.5" class="agent"/><circle cx="113.6" cy="267.2" r="2.5" class="agent"/><line x1="108" y1="257.4" x2="108" y2="250.6" class="nofill thick" stroke="#7A5FD0"/><text x="108" y="318" font-size="15" text-anchor="middle" class="ink b" xml:space="preserve">your agent</text><text x="108" y="338" font-size="13" text-anchor="middle" class="muted" xml:space="preserve">holds a mission key</text><path d="M140 268 L 262 268" class="nofill agentS mid" marker-end="url(#m-agent)"/><rect x="158" y="243" width="85" height="22" rx="6" class="bg"/><text x="200" y="258" font-size="13" text-anchor="middle" class="agentInk sb" xml:space="preserve">send recap</text><rect x="268" y="140" width="680" height="332" rx="22" class="surface line thin"/><text x="292" y="172" font-size="16" text-anchor="start" class="ink b" xml:space="preserve">Vaubaan</text><text x="380" y="172" font-size="14" text-anchor="start" class="muted" xml:space="preserve">where you run it</text><rect x="292" y="196" width="196" height="124" rx="14" class="vault"/><circle cx="314" cy="222" r="12" class="accent"/><text x="314" y="227" font-size="13" text-anchor="middle" class="onAccent b" xml:space="preserve">1</text><text x="334" y="227" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Plugin names it</text><text x="308" y="266" font-size="12.5" text-anchor="start" class="ink mono" xml:space="preserve">gmail.</text><text x="308" y="284" font-size="12.5" text-anchor="start" class="ink mono" xml:space="preserve">send-to-zone-allowlist</text><path d="M490 258.0 L 508 258.0" class="nofill accentS thin" marker-end="url(#m-accent)"/><rect x="510" y="196" width="196" height="124" rx="14" class="vault"/><circle cx="532" cy="222" r="12" class="accent"/><text x="532" y="227" font-size="13" text-anchor="middle" class="onAccent b" xml:space="preserve">2</text><text x="552" y="227" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Mission allows it?</text><text x="526" y="270" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">listed · 1 of 60 today</text><path d="M708 258.0 L 726 258.0" class="nofill accentS thin" marker-end="url(#m-accent)"/><rect x="728" y="196" width="196" height="124" rx="14" class="accentSoft"/><circle cx="750" cy="222" r="12" class="accent"/><text x="750" y="227" font-size="13" text-anchor="middle" class="onAccent b" xml:space="preserve">3</text><text x="770" y="227" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Decision</text><circle cx="752" cy="251" r="10" class="ok"/><path d="M747 251 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><text x="770" y="256" font-size="13" text-anchor="start" class="ink" xml:space="preserve">runs</text><rect x="745" y="268" width="14" height="14" rx="2" class="ask" transform="rotate(45 752 275)"/><text x="770" y="280" font-size="13" text-anchor="start" class="ink" xml:space="preserve">asks you first</text><circle cx="752" cy="299" r="10" class="stop"/><path d="M748 295 l8 8 M756 295 l-8 8" fill="none" stroke-width="2.4" stroke="#FFFFFF"/><text x="770" y="304" font-size="13" text-anchor="start" class="ink" xml:space="preserve">refused, says why</text><rect x="292" y="350" width="290" height="92" rx="14" class="vault"/><g transform="translate(320 384)"><rect x="-8" y="-2" width="16" height="12" rx="3" class="ink"/><path d="M-5 -2 V-6 a5 5 0 0 1 10 0 V-2" class="nofill mid inkS"/></g><text x="340" y="390" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Credentials, encrypted</text><text x="312" y="418" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">opened for this one call, never handed out</text><rect x="604" y="350" width="322" height="92" rx="14" class="surface line thin"/><text x="624" y="384" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Activity</text><text x="624" y="408" font-size="12.5" text-anchor="start" class="ink mono" xml:space="preserve">10:41  recap to Jane  approved, sent</text><text x="624" y="428" font-size="12.5" text-anchor="start" class="muted mono" xml:space="preserve">10:36  label Finance  refused</text><path d="M826.0 320 C 826.0 344, 764 330, 764 350" class="nofill mutedS thin" marker-end="url(#m-muted)"/><path d="M948 268 L 1004 268" class="nofill accentS thick" marker-end="url(#m-accent)"/><rect x="945" y="241" width="63" height="22" rx="6" class="bg"/><text x="976" y="256" font-size="13" text-anchor="middle" class="accentInk sb" xml:space="preserve">runs it</text><rect x="1010" y="222" width="150" height="92" rx="16" class="surface line thin"/><g transform="translate(1044 244) scale(1.0000)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/></g><text x="1076" y="262" font-size="17" text-anchor="start" class="ink b" xml:space="preserve">Gmail</text><text x="1085" y="290" font-size="13" text-anchor="middle" class="muted" xml:space="preserve">Notion, Calendar…</text><circle cx="1085" cy="430" r="26" class="human"/><circle cx="1085" cy="423.0" r="8.3" class="surface"/><path d="M1070.7 446.6 a14.3 11.7 0 0 1 28.6 0z" class="surface"/><text x="1085" y="480" font-size="14" text-anchor="middle" class="ink b" xml:space="preserve">you</text><text x="1085" y="500" font-size="13" text-anchor="middle" class="muted" xml:space="preserve">Waiting for you</text><path d="M948 330 C 1000 330, 1010 420, 1052 428" class="nofill askS mid dash" marker-end="url(#m-ask)"/><rect x="962" y="345" width="85" height="22" rx="6" class="bg"/><text x="1004" y="360" font-size="13" text-anchor="middle" class="askInk sb" xml:space="preserve">asks first</text><path d="M268 196 C 170 196, 108 196, 108 234" class="nofill stopS mid dash" marker-end="url(#m-stop)"/><rect x="117" y="171" width="158" height="22" rx="6" class="bg"/><text x="196" y="186" font-size="13" text-anchor="middle" class="stopInk sb" xml:space="preserve">refusal + what to do</text></svg>
