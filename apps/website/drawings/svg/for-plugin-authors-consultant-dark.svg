<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d"><title id="t">For plugin authors: five questions per permission</title><desc id="d">A plugin author answers five plain questions for each permission in the risk catalog. Sending to a pre-approved client can never be undone, so it lands on Cannot be repaired; the kit checks it and a reviewer reads it in the catalog pull request.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#0E1215} .surface{fill:#151A1F} .ink{fill:#E8ECEF} .muted{fill:#A3ADB7} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#8FB0FF} .accentS{stroke:#8FB0FF} .accentSoft{fill:#17254A} .accentInk{fill:#CBD9FF} .accentInkS{stroke:#CBD9FF} .vault{fill:#1C2228} .human{fill:#3CC9BD} .humanS{stroke:#3CC9BD} .humanSoft{fill:#0D302D} .humanInk{fill:#8EE6DC} .agent{fill:#A990F0} .agentS{stroke:#A990F0} .agentSoft{fill:#26203D} .agentInk{fill:#D6CBFA} .ok{fill:#3DDC84} .okS{stroke:#3DDC84} .okSoft{fill:#0D3320} .okInk{fill:#7EEAAA} .ask{fill:#8FB0FF} .askS{stroke:#8FB0FF} .askSoft{fill:#17254A} .askInk{fill:#CBD9FF} .stop{fill:#FF6B6B} .stopS{stroke:#FF6B6B} .stopSoft{fill:#3F1215} .stopInk{fill:#FFA3A3} .r1{fill:#A1E3B7} .r1Soft{fill:#173221} .r1B{stroke:#2C5A3B} .r2{fill:#C8D2DD} .r2Soft{fill:#282C30} .r2B{stroke:#41474E} .r3{fill:#EAC3E5} .r3Soft{fill:#342633} .r3B{stroke:#5A4058} .r4{fill:#FFBCEE} .r4Soft{fill:#48203C} .r4B{stroke:#74365F} .inkS{stroke:#E8ECEF} .mutedS{stroke:#A3ADB7} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#0E1215} .onAccentS{stroke:#0E1215} svg{--s:#151A1F}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker><marker id="m-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ask"/></marker><marker id="m-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="stop"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok"/></marker><marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="agent"/></marker><marker id="m-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="human"/></marker></defs><rect x="0" y="0" width="1200" height="580" rx="24" class="bg line thin"/><text x="64" y="72" font-size="28" text-anchor="start" class="ink b" xml:space="preserve">For plugin authors: five questions per permission</text><text x="64" y="102" font-size="16" text-anchor="start" class="muted" xml:space="preserve">You know the service. Answer in plain facts, and Vaubaan places the permission, the same way for every service.</text><rect x="56" y="140" width="340" height="360" rx="16" class="term"/><text x="76" y="170" font-size="13" text-anchor="start" class="termMuted mono" xml:space="preserve">risk-catalog.yaml</text><text x="76" y="210" font-size="14" text-anchor="start" class="termMuted mono" xml:space="preserve">- id: </text><text x="152" y="210" font-size="14" text-anchor="start" class="termInk mono b" xml:space="preserve">gmail.send-to-zone-allowlist</text><text x="76" y="244" font-size="14" text-anchor="start" class="termMuted mono" xml:space="preserve">  label: </text><text x="152" y="244" font-size="14" text-anchor="start" class="termInk mono b" xml:space="preserve">Send to known contacts</text><text x="76" y="278" font-size="14" text-anchor="start" class="termMuted mono" xml:space="preserve">  vector:</text><text x="76" y="312" font-size="14" text-anchor="start" class="termMuted mono" xml:space="preserve">    reversibility: </text><text x="246" y="312" font-size="14" text-anchor="start" class="termInk mono b" xml:space="preserve">irreversible</text><text x="76" y="346" font-size="14" text-anchor="start" class="termMuted mono" xml:space="preserve">    blast: </text><text x="246" y="346" font-size="14" text-anchor="start" class="termInk mono b" xml:space="preserve">env</text><text x="76" y="380" font-size="14" text-anchor="start" class="termMuted mono" xml:space="preserve">    data: </text><text x="246" y="380" font-size="14" text-anchor="start" class="termInk mono b" xml:space="preserve">data</text><text x="76" y="414" font-size="14" text-anchor="start" class="termMuted mono" xml:space="preserve">    cost: </text><text x="246" y="414" font-size="14" text-anchor="start" class="termInk mono b" xml:space="preserve">free</text><text x="76" y="448" font-size="14" text-anchor="start" class="termMuted mono" xml:space="preserve">    visibility: </text><text x="246" y="448" font-size="14" text-anchor="start" class="termInk mono b" xml:space="preserve">team</text><text x="452" y="168" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">Can it be undone?</text><rect x="452" y="180" width="44" height="28" rx="14" class="surface line thin"/><text x="474" y="199" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">yes</text><rect x="502" y="180" width="95" height="28" rx="14" class="surface line thin"/><text x="549" y="199" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">at a price</text><rect x="603" y="180" width="58" height="28" rx="14" class="accent"/><text x="632" y="199" font-size="12.5" text-anchor="middle" class="onAccent b" xml:space="preserve">never</text><path d="M400 307 C 426 307, 418 194, 444 194" class="nofill accentS thin"/><circle cx="444" cy="194" r="3" class="accent"/><text x="452" y="240" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">How far does it reach?</text><rect x="452" y="252" width="88" height="28" rx="14" class="surface line thin"/><text x="496" y="271" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">one thing</text><rect x="546" y="252" width="132" height="28" rx="14" class="accent"/><text x="611" y="271" font-size="12.5" text-anchor="middle" class="onAccent b" xml:space="preserve">one environment</text><rect x="683" y="252" width="102" height="28" rx="14" class="surface line thin"/><text x="734" y="271" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">the account</text><rect x="792" y="252" width="73" height="28" rx="14" class="surface line thin"/><text x="828" y="271" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">in bulk</text><path d="M400 341 C 426 341, 418 266, 444 266" class="nofill accentS thin"/><circle cx="444" cy="266" r="3" class="accent"/><text x="452" y="312" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">What data does it touch?</text><rect x="452" y="324" width="58" height="28" rx="14" class="surface line thin"/><text x="481" y="343" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">names</text><rect x="516" y="324" width="73" height="28" rx="14" class="accent"/><text x="553" y="343" font-size="12.5" text-anchor="middle" class="onAccent b" xml:space="preserve">content</text><rect x="596" y="324" width="73" height="28" rx="14" class="surface line thin"/><text x="632" y="343" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">secrets</text><rect x="675" y="324" width="80" height="28" rx="14" class="surface line thin"/><text x="715" y="343" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">personal</text><path d="M400 375 C 426 375, 418 338, 444 338" class="nofill accentS thin"/><circle cx="444" cy="338" r="3" class="accent"/><text x="452" y="384" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">What can it cost?</text><rect x="452" y="396" width="73" height="28" rx="14" class="accent"/><text x="489" y="415" font-size="12.5" text-anchor="middle" class="onAccent b" xml:space="preserve">nothing</text><rect x="531" y="396" width="95" height="28" rx="14" class="surface line thin"/><text x="579" y="415" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">some money</text><rect x="632" y="396" width="95" height="28" rx="14" class="surface line thin"/><text x="680" y="415" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">no ceiling</text><path d="M400 409 C 426 409, 418 410, 444 410" class="nofill accentS thin"/><circle cx="444" cy="410" r="3" class="accent"/><text x="452" y="456" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">Who sees it?</text><rect x="452" y="468" width="44" height="28" rx="14" class="surface line thin"/><text x="474" y="487" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">you</text><rect x="502" y="468" width="88" height="28" rx="14" class="accent"/><text x="546" y="487" font-size="12.5" text-anchor="middle" class="onAccent b" xml:space="preserve">your team</text><rect x="596" y="468" width="80" height="28" rx="14" class="surface line thin"/><text x="636" y="487" font-size="12.5" text-anchor="middle" class="muted" xml:space="preserve">everyone</text><path d="M400 443 C 426 443, 418 482, 444 482" class="nofill accentS thin"/><circle cx="444" cy="482" r="3" class="accent"/><text x="884" y="170" font-size="14" text-anchor="start" class="muted" xml:space="preserve">It lands on</text><rect x="884" y="184" width="270" height="44" rx="22" class="r4Soft r4B thin"/><text x="1019.0" y="212" font-size="15" text-anchor="middle" class="r4 b" xml:space="preserve">Cannot be repaired</text><text x="884" y="254" font-size="14" text-anchor="start" class="ink" xml:space="preserve">because it can never be undone</text><text x="884" y="276" font-size="13" text-anchor="start" class="muted" xml:space="preserve">the first answer that matters, read</text><text x="884" y="294" font-size="13" text-anchor="start" class="muted" xml:space="preserve">in a fixed order. No score to tune.</text><path d="M852 300 C 872 300, 854 206, 878 206" class="nofill accentS mid" marker-end="url(#m-accent)"/><line x1="884" y1="326" x2="1154" y2="326" class="line thin"/><text x="884" y="356" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Then</text><circle cx="893" cy="381" r="9" class="accentSoft"/><text x="893" y="385" font-size="11" text-anchor="middle" class="accentInk b" xml:space="preserve">1</text><text x="910" y="386" font-size="13.5" text-anchor="start" class="ink" xml:space="preserve">the kit checks every tool against it</text><circle cx="893" cy="407" r="9" class="accentSoft"/><text x="893" y="411" font-size="11" text-anchor="middle" class="accentInk b" xml:space="preserve">2</text><text x="910" y="412" font-size="13.5" text-anchor="start" class="ink" xml:space="preserve">a reviewer reads the five answers</text><text x="910" y="438" font-size="13.5" text-anchor="start" class="ink" xml:space="preserve">in the catalog pull request</text><circle cx="893" cy="459" r="9" class="accentSoft"/><text x="893" y="463" font-size="11" text-anchor="middle" class="accentInk b" xml:space="preserve">3</text><text x="910" y="464" font-size="13.5" text-anchor="start" class="ink" xml:space="preserve">the catalog builds and signs it</text><text x="64" y="548" font-size="13" text-anchor="start" class="muted" xml:space="preserve">The five questions are the whole method: the same for Gmail, Stripe or your own internal service.</text></svg>
