lass="surface line thin"/><text x="648" y="82" font-size="19" text-anchor="start" class="ink b" xml:space="preserve">With Vaubaan: a mission</text><circle cx="690" cy="196" r="30" class="agent"/><rect x="675.0" y="184.6" width="30.0" height="21.0" rx="5.4" class="surface"/><circle cx="684.0" cy="195.1" r="2.7" class="agent"/><circle cx="696.0" cy="195.1" r="2.7" class="agent"/><line x1="690" y1="184.6" x2="690" y2="177.4" class="nofill thick" stroke="#7A5FD0"/><rect x="730" y="172" width="64" height="48" rx="12" class="accentSoft"/><g transform="translate(746 196) scale(0.85)"><circle cx="0" cy="0" r="7" class="nofill thick accentS"/><path d="M7 0 H22 M17 0 V5 M21 0 V4" class="nofill thick accentS" stroke-linecap="round"/></g><path d="M798 196 L 850 196" class="nofill accentS mid" marker-end="url(#m-accent)"/><rect x="856" y="150" width="156" height="92" rx="16" class="accentSoft"/><text x="934" y="182" font-size="15" text-anchor="middle" class="accentInk b" xml:space="preserve">Vaubaan</text><g transform="translate(904 214)"><rect x="-8" y="-2" width="16" height="12" rx="3" class="accentInk"/><path d="M-5 -2 V-6 a5 5 0 0 1 10 0 V-2" class="nofill mid accentInkS"/></g><text x="920" y="219" font-size="12.5" text-anchor="start" class="accentInk" xml:space="preserve">password here</text><path d="M1012 196 L 1052 196" class="nofill accentS mid" marker-end="url(#m-accent)"/><rect x="1058" y="156" width="80" height="80" rx="16" class="vault"/><g transform="translate(1084 166) scale(1.1667)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/></g><text x="1098" y="222" font-size="13" text-anchor="middle" class="ink b" xml:space="preserve">Gmail</text><circle cx="660" cy="287" r="10" class="ok"/><path d="M655 287 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><text x="680" y="292" font-size="15" text-anchor="start" class="ink" xml:space="preserve">named permissions, on named mail and pages</text><circle cx="660" cy="321" r="10" class="ok"/><path d="M655 321 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><text x="680" y="326" font-size="15" text-anchor="start" class="ink" xml:space="preserve">a limit per permission, per day</text><circle cx="660" cy="355" r="10" class="ok"/><path d="M655 355 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><text x="680" y="360" font-size="15" text-anchor="start" class="ink" xml:space="preserve">mail to clients waits for your yes</text><circle cx="660" cy="389" r="10" class="ok"/><path d="M655 389 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#FFFFFF"/><text x="680" y="394" font-size="15" text-anchor="start" class="ink" xml:space="preserve">its key opens this mission only</text></svg>
