<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d"><title id="t">Modelled, then folded into verbs</title><desc id="d">Supabase, modelled: one project carries the environment (preview, staging, prod) over 4 planes (db, storage, auth, functions) and their entities. A migration becomes one permission per environment; bulk row writes have no production form. The 27 permissions fold into 5 verbs a person ticks.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#FBFBF9} .surface{fill:#FFFFFF} .ink{fill:#1B2128} .muted{fill:#56606B} .line{stroke:#DDE1E6} .lineF{fill:#DDE1E6} .accent{fill:#2F55C7} .accentS{stroke:#2F55C7} .accentSoft{fill:#E8EDFB} .accentInk{fill:#1F3F9E} .accentInkS{stroke:#1F3F9E} .vault{fill:#F1F2F4} .human{fill:#0B7F77} .humanS{stroke:#0B7F77} .humanSoft{fill:#D8F3F0} .humanInk{fill:#0B5F59} .agent{fill:#7A5FD0} .agentS{stroke:#7A5FD0} .agentSoft{fill:#EFEAFB} .agentInk{fill:#4E3A99} .ok{fill:#13995A} .okS{stroke:#13995A} .okSoft{fill:#DCF7E7} .okInk{fill:#0B6B3C} .ask{fill:#2F55C7} .askS{stroke:#2F55C7} .askSoft{fill:#E8EDFB} .askInk{fill:#1F3F9E} .stop{fill:#C81E2A} .stopS{stroke:#C81E2A} .stopSoft{fill:#FDE4E4} .stopInk{fill:#A3121E} .r1{fill:#005F2E} .r1Soft{fill:#DFF8E6} .r1B{stroke:#A6E3BB} .r2{fill:#434E5A} .r2Soft{fill:#EDF1F5} .r2B{stroke:#CFD7E0} .r3{fill:#663B63} .r3Soft{fill:#FAEBF8} .r3B{stroke:#E6C3E2} .r4{fill:#70155A} .r4Soft{fill:#FFDCF8} .r4B{stroke:#F1A6DD} .inkS{stroke:#1B2128} .mutedS{stroke:#56606B} .term{fill:#15191D} .termInk{fill:#E6EAEE} .termMuted{fill:#97A1AC} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAcce