<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 786" width="1200" height="786" role="img" aria-labelledby="t d"><title id="t">GitHub, mapped</title><desc id="d">The 18 GitHub permissions placed in 5 verbs (Read, Search everywhere, Propose, Ship, Administer) and four rows, from Cannot be repaired to Harmless. Most of the agent’s work sits in Harmless; what is costly to undo gathers in Ship and Administer.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#FBFBF9} .surface{fill:#FFFFFF} .ink{fill:#1B2128} .muted{fill:#56606B} .line{stroke:#DDE1E6} .lineF{fill:#DDE1E6} .accent{fill:#2F55C7} .accentS{stroke:#2F55C7} .accentSoft{fill:#E8EDFB} .accentInk{fill:#1F3F9E} .accentInkS{stroke:#1F3F9E} .vault{fill:#F1F2F4} .human{fill:#0B7F77} .humanS{stroke:#0B7F77} .humanSoft{fill:#D8F3F0} .humanInk{fill:#0B5F59} .agent{fill:#7A5FD0} .agentS{stroke:#7A5FD0} .agentSoft{fill:#EFEAFB} .agentInk{fill:#4E3A99} .ok{fill:#13995A} .okS{stroke:#13995A} .okSoft{fill:#DCF7E7} .okInk{fill:#0B6B3C} .ask{fill:#2F55C7} .askS{stroke:#2F55C7} .askSoft{fill:#E8EDFB} .askInk{fill:#1F3F9E} .stop{fill:#C81E2A} .stopS{stroke:#C81E2A} .stopSoft{fill:#FDE4E4} .stopInk{fill:#A3121E} .r1{fill:#005F2E} .r1Soft{fill:#DFF8E6} .r1B{stroke:#A6E3BB} .r2{fill:#434E5A} .r2Soft{fill:#EDF1F5} .r2B{stroke:#CFD7E0} .r3{fill:#663B63} .r3Soft{fill:#FAEBF8} .r3B{stroke:#E6C3E2} .r4{fill:#70155A} .r4Soft{fill:#FFDCF8} .r4B{stroke:#F1A6DD} .inkS{stroke:#1B2128} .mutedS{stroke:#56606B} .term{fill:#15191D} .termInk{fill:#E6EAEE} .termMuted{fill:#97A1AC} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#FFFFFF} .onAccentS{stroke:#FFFFFF} svg{--s:#FFFFFF}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker><marker id="m-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ask"/></marker><marker id="m-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="stop"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok"/></marker><marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="agent"/></marker><marker id="m-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="human"/></marker></defs><rect x="0" y="0" width="1200" height="786" rx="24" class="bg line thin"/><g transform="translate(64 46) scale(1.3333)"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" class="ink"/></g><text x="108" y="72" font-size="28" text-anchor="start" class="ink b" xml:space="preserve">GitHub, mapped</text><text x="64" y="102" font-size="16" text-anchor="start" class="muted" xml:space="preserve">18 permissions, 5 verbs, ordered by how hard each is to repair. The same for every service: 23 services, 289 permissions.</text><text x="240" y="160" font-size="17" text-anchor="start" class="ink b" xml:space="preserve">Read</text><text x="240" y="180" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">2 permissions</text><text x="380" y="160" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">Search everywhere</text><text x="380" y="180" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">1 permission</text><text x="560" y="160" font-size="17" text-anchor="start" class="ink b" xml:space="preserve">Propose</text><text x="560" y="180" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">9 permissions</text><text x="800" y="160" font-size="17" text-anchor="start" class="ink b" xml:space="preserve">Ship</text><text x="800" y="180" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">4 permissions</text><text x="980" y="160" font-size="17" text-anchor="start" class="ink b" xml:space="preserve">Administer</text><text x="980" y="180" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">2 permissions</text><rect x="56" y="198" width="1080" height="80" rx="12" class="r4Soft r4B thin"/><text x="72" y="226" font-size="14" text-anchor="start" class="r4 b" xml:space="preserve">Cannot be repaired</text><text x="72" y="248" font-size="11.5" text-anchor="start" class="muted mono" xml:space="preserve">irreversible</text><rect x="798" y="212" width="134" height="28" rx="14" class="surface line thin"/><text x="865" y="231" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Delete a release</text><rect x="56" y="286" width="1080" height="132" rx="12" class="r3Soft r3B thin"/><text x="72" y="314" font-size="14" text-anchor="start" class="r3 b" xml:space="preserve">Repairable,</text><text x="72" y="332" font-size="14" text-anchor="start" class="r3 b" xml:space="preserve">at a price</text><text x="72" y="354" font-size="11.5" text-anchor="start" class="muted mono" xml:space="preserve">costly to undo</text><rect x="558" y="300" width="92" height="28" rx="14" class="surface line thin"/><text x="604" y="319" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Force-push</text><rect x="558" y="336" width="127" height="28" rx="14" class="surface line thin"/><text x="622" y="355" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Delete a branch</text><rect x="798" y="300" width="127" height="28" rx="14" class="surface line thin"/><text x="862" y="319" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Merge into main</text><rect x="798" y="336" width="134" height="28" rx="14" class="surface line thin"/><text x="865" y="355" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Create a release</text><rect x="798" y="372" width="92" height="28" rx="14" class="surface line thin"/><text x="844" y="391" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Push a tag</text><rect x="978" y="300" width="120" height="28" rx="14" class="surface line thin"/><text x="1038" y="319" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Workflow files</text><rect x="978" y="336" width="141" height="28" rx="14" class="surface line thin"/><text x="1048" y="355" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Branch protection</text><rect x="56" y="426" width="1080" height="80" rx="12" class="r2Soft r2B thin"/><text x="72" y="454" font-size="14" text-anchor="start" class="r2 b" xml:space="preserve">Worth a look</text><text x="72" y="476" font-size="11.5" text-anchor="start" class="muted mono" xml:space="preserve">whole account</text><rect x="378" y="440" width="162" height="28" rx="14" class="surface line thin"/><text x="459" y="459" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Search all of GitHub</text><rect x="56" y="514" width="1080" height="204" rx="12" class="r1Soft r1B thin"/><text x="72" y="542" font-size="14" text-anchor="start" class="r1 b" xml:space="preserve">Harmless</text><rect x="238" y="528" width="85" height="28" rx="14" class="surface line thin"/><text x="280" y="547" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Read code</text><rect x="238" y="564" width="155" height="28" rx="14" class="surface line thin"/><text x="316" y="583" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Read PRs and issues</text><rect x="558" y="528" width="134" height="28" rx="14" class="surface line thin"/><text x="625" y="547" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Feature branches</text><rect x="558" y="564" width="127" height="28" rx="14" class="surface line thin"/><text x="622" y="583" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Push many files</text><rect x="558" y="600" width="85" height="28" rx="14" class="surface line thin"/><text x="600" y="619" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Open a PR</text><rect x="651" y="600" width="71" height="28" rx="14" class="surface line thin"/><text x="686" y="619" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Comment</text><rect x="558" y="636" width="57" height="28" rx="14" class="surface line thin"/><text x="586" y="655" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Label</text><rect x="623" y="636" width="113" height="28" rx="14" class="surface line thin"/><text x="680" y="655" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">Edit an issue</text><rect x="558" y="672" width="78" height="28" rx="14" class="surface line thin"/><text x="597" y="691" font-size="12.5" text-anchor="middle" class="ink sb" xml:space="preserve">git push</text><line x1="366" y1="140" x2="366" y2="718" class="line thin dash"/><line x1="546" y1="140" x2="546" y2="718" class="line thin dash"/><line x1="786" y1="140" x2="786" y2="718" class="line thin dash"/><line x1="966" y1="140" x2="966" y2="718" class="line thin dash"/><text x="64" y="752" font-size="14" text-anchor="start" class="muted" xml:space="preserve">Anything else: one catch-all permission for a write no entry describes. It is never on the map, and never granted without being named.</text></svg>
