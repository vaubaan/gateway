<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d"><title id="t">Vaubaan: let your agent work alone</title><desc id="d">Your coding agent holds a mission key. Vaubaan holds the credentials, runs what the mission allows, refuses the rest, and asks you before what is hard to undo.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#0E1215} .surface{fill:#151A1F} .ink{fill:#E8ECEF} .muted{fill:#A3ADB7} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#8FB0FF} .accentS{stroke:#8FB0FF} .accentSoft{fill:#17254A} .accentInk{fill:#CBD9FF} .accentInkS{stroke:#CBD9FF} .vault{fill:#1C2228} .human{fill:#3CC9BD} .humanS{stroke:#3CC9BD} .humanSoft{fill:#0D302D} .humanInk{fill:#8EE6DC} .agent{fill:#A990F0} .agentS{stroke:#A990F0} .agentSoft{fill:#26203D} .agentInk{fill:#D6CBFA} .ok{fill:#3DDC84} .okS{stroke:#3DDC84} .okSoft{fill:#0D3320} .okInk{fill:#7EEAAA} .ask{fill:#8FB0FF} .askS{stroke:#8FB0FF} .askSoft{fill:#17254A} .askInk{fill:#CBD9FF} .stop{fill:#FF6B6B} .stopS{stroke:#FF6B6B} .stopSoft{fill:#3F1215} .stopInk{fill:#FFA3A3} .r1{fill:#A1E3B7} .r1Soft{fill:#173221} .r1B{stroke:#2C5A3B} .r2{fill:#C8D2DD} .r2Soft{fill:#282C30} .r2B{stroke:#41474E} .r3{fill:#EAC3E5} .r3Soft{fill:#342633} .r3B{stroke:#5A4058} .r4{fill:#FFBCEE} .r4Soft{fill:#48203C} .r4B{stroke:#74365F} .inkS{stroke:#E8ECEF} .mutedS{stroke:#A3ADB7} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#0E1215} .onAccentS{stroke:#0E1215} svg{--s:#151A1F}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="