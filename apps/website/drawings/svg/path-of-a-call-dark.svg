<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">How a call goes through Vaubaan</title><desc id="d">The agent calls a tool with its mission key. The plugin names the permission the call needs, Vaubaan checks it against the mission and its limits, then runs it with a credential the agent never sees, asks the mission creator first, or refuses with what to do. Every call is recorded.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#0E1215} .surface{fill:#151A1F} .ink{fill:#E8ECEF} .muted{fill:#A3ADB7} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#8FB0FF} .accentS{stroke:#8FB0FF} .accentSoft{fill:#17254A} .accentInk{fill:#CBD9FF} .accentInkS{stroke:#CBD9FF} .vault{fill:#1C2228} .human{fill:#3CC9BD} .humanS{stroke:#3CC9BD} .humanSoft{fill:#0D302D} .humanInk{fill:#8EE6DC} .agent{fill:#A990F0} .agentS{stroke:#A990F0} .agentSoft{fill:#26203D} .agentInk{fill:#D6CBFA} .ok{fill:#3DDC84} .okS{stroke:#3DDC84} .okSoft{fill:#0D3320} .okInk{fill:#7EEAAA} .ask{fill:#8FB0FF} .askS{stroke:#8FB0FF} .askSoft{fill:#17254A} .askInk{fill:#CBD9FF} .stop{fill:#FF6B6B} .stopS{stroke:#FF6B6B} .stopSoft{fill:#3F1215} .stopInk{fill:#FFA3A3} .r1{fill:#A1E3B7} .r1Soft{fill:#173221} .r1B{stroke:#2C5A3B} .r2{fill:#C8D2DD} .r2Soft{fill:#282C30} .r2B{stroke:#41474E} .r3{fill:#EAC3E5} .r3Soft{fill:#342633} .r3B{stroke:#5A4058} .r4{fill:#FFBCEE} .r4Soft{fill:#48203C} .r4B{stroke:#74365F} .inkS{stroke:#E8ECEF} .mutedS{stroke:#A3ADB7} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#0E1215} .onAccentS{stroke:#0E1215} svg{--s:#151A1F}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker><marker id="m-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ask"/></marker><marker id="m-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="stop"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok"/></marker><marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="agent"/></marker><marker id="m-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="human"/></marker></defs><rect x="0" y="0" width="1200" height="560" rx="24" class="bg line thin"/><text x="64" y="72" font-size="28" text-anchor="start" class="ink b" xml:space="preserve">How a call goes through</text><text x="64" y="102" font-size="16" text-anchor="start" class="muted" xml:space="preserve">The same path for every tool and every git push.</text><circle cx="108" cy="268" r="28" class="agent"/><rect x="94.0" y="257.4" width="28.0" height="19.6" rx="5.0" class="surface"/><circle cx="102.4" cy="267.2" r="2.5" class="agent"/><circle cx="113.6" cy="267.2" r="2.5" class="agent"/><line x1="108" y1="257.4" x2="108" y2="250.6" class="nofill thick" stroke="#A990F0"/><text x="108" y="318" font-size="15" text-anchor="middle" class="ink b" xml:space="preserve">your agent</text><text x="108" y="338" font-size="13" text-anchor="middle" class="muted" xml:space="preserve">holds a mission key</text><path d="M140 268 L 262 268" class="nofill agentS mid" marker-end="url(#m-agent)"/><rect x="158" y="243" width="85" height="22" rx="6" class="bg"/><text x="200" y="258" font-size="13" text-anchor="middle" class="agentInk sb" xml:space="preserve">merge #142</text><rect x="268" y="140" width="680" height="332" rx="22" class="surface line thin"/><text x="292" y="172" font-size="16" text-anchor="start" class="ink b" xml:space="preserve">Vaubaan</text><text x="380" y="172" font-size="14" text-anchor="start" class="muted" xml:space="preserve">where you run it</text><rect x="292" y="196" width="196" height="124" rx="14" class="vault"/><circle cx="314" cy="222" r="12" class="accent"/><text x="314" y="227" font-size="13" text-anchor="middle" class="onAccent b" xml:space="preserve">1</text><text x="334" y="227" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Plugin names it</text><text x="308" y="266" font-size="12.5" text-anchor="start" class="ink mono" xml:space="preserve">github.merge-protected</text><path d="M490 258.0 L 508 258.0" class="nofill accentS thin" marker-end="url(#m-accent)"/><rect x="510" y="196" width="196" height="124" rx="14" class="vault"/><circle cx="532" cy="222" r="12" class="accent"/><text x="532" y="227" font-size="13" text-anchor="middle" class="onAccent b" xml:space="preserve">2</text><text x="552" y="227" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Mission allows it?</text><text x="526" y="270" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">listed · 1 of 3 today</text><path d="M708 258.0 L 726 258.0" class="nofill accentS thin" marker-end="url(#m-accent)"/><rect x="728" y="196" width="196" height="124" rx="14" class="accentSoft"/><circle cx="750" cy="222" r="12" class="accent"/><text x="750" y="227" font-size="13" text-anchor="middle" class="onAccent b" xml:space="preserve">3</text><text x="770" y="227" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Decision</text><circle cx="752" cy="251" r="10" class="ok"/><path d="M747 251 l3.5 3.5 l6.5 -7" fill="none" class="surface" stroke-width="2.4" stroke="#151A1F"/><text x="770" y="256" font-size="13" text-anchor="start" class="ink" xml:space="preserve">runs</text><rect x="745" y="268" width="14" height="14" rx="2" class="ask" transform="rotate(45 752 275)"/><text x="770" y="280" font-size="13" text-anchor="start" class="ink" xml:space="preserve">asks you first</text><circle cx="752" cy="299" r="10" class="stop"/><path d="M748 295 l8 8 M756 295 l-8 8" fill="none" stroke-width="2.4" stroke="#151A1F"/><text x="770" y="304" font-size="13" text-anchor="start" class="ink" xml:space="preserve">refused, says why</text><rect x="292" y="350" width="290" height="92" rx="14" class="vault"/><g transform="translate(320 384)"><rect x="-8" y="-2" width="16" height="12" rx="3" class="ink"/><path d="M-5 -2 V-6 a5 5 0 0 1 10 0 V-2" class="nofill mid inkS"/></g><text x="340" y="390" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Credentials, encrypted</text><text x="312" y="418" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">opened for this one call, never handed out</text><rect x="604" y="350" width="322" height="92" rx="14" class="surface line thin"/><text x="624" y="384" font-size="14" text-anchor="start" class="ink b" xml:space="preserve">Activity</text><text x="624" y="408" font-size="12.5" text-anchor="start" class="ink mono" xml:space="preserve">10:41  merge #142  approved, ran</text><text x="624" y="428" font-size="12.5" text-anchor="start" class="muted mono" xml:space="preserve">10:36  migration prod  refused</text><path d="M826.0 320 C 826.0 344, 764 330, 764 350" class="nofill mutedS thin" marker-end="url(#m-muted)"/><path d="M948 268 L 1004 268" class="nofill accentS thick" marker-end="url(#m-accent)"/><rect x="945" y="241" width="63" height="22" rx="6" class="bg"/><text x="976" y="256" font-size="13" text-anchor="middle" class="accentInk sb" xml:space="preserve">runs it</text><rect x="1010" y="222" width="150" height="92" rx="16" class="surface line thin"/><g transform="translate(1038 244) scale(1.0000)"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" class="ink"/></g><text x="1070" y="262" font-size="17" text-anchor="start" class="ink b" xml:space="preserve">GitHub</text><text x="1085" y="290" font-size="13" text-anchor="middle" class="muted" xml:space="preserve">Supabase, Vercel…</text><circle cx="1085" cy="430" r="26" class="human"/><circle cx="1085" cy="423.0" r="8.3" class="surface"/><path d="M1070.7 446.6 a14.3 11.7 0 0 1 28.6 0z" class="surface"/><text x="1085" y="480" font-size="14" text-anchor="middle" class="ink b" xml:space="preserve">you</text><text x="1085" y="500" font-size="13" text-anchor="middle" class="muted" xml:space="preserve">Waiting for you</text><path d="M948 330 C 1000 330, 1010 420, 1052 428" class="nofill askS mid dash" marker-end="url(#m-ask)"/><rect x="962" y="345" width="85" height="22" rx="6" class="bg"/><text x="1004" y="360" font-size="13" text-anchor="middle" class="askInk sb" xml:space="preserve">asks first</text><path d="M268 196 C 170 196, 108 196, 108 234" class="nofill stopS mid dash" marker-end="url(#m-stop)"/><rect x="117" y="171" width="158" height="22" rx="6" class="bg"/><text x="196" y="186" font-size="13" text-anchor="middle" class="stopInk sb" xml:space="preserve">refusal + what to do</text></svg>
