<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">One question for every permission</title><desc id="d">Every permission of every service answers one question: if your agent gets it wrong, how hard is it to repair? Four steps, from Harmless (read code) to Cannot be repaired (delete a release).</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#FBFBF9} .surface{fill:#FFFFFF} .ink{fill:#1B2128} .muted{fill:#56606B} .line{stroke:#DDE1E6} .lineF{fill:#DDE1E6} .accent{fill:#2F55C7} .accentS{stroke:#2F55C7} .accentSoft{fill:#E8EDFB} .accentInk{fill:#1F3F9E} .accentInkS{stroke:#1F3F9E} .vault{fill:#F1F2F4} .human{fill:#0B7F77} .humanS{stroke:#0B7F77} .humanSoft{fill:#D8F3F0} .humanInk{fill:#0B5F59} .agent{fill:#7A5FD0} .agentS{stroke:#7A5FD0} .agentSoft{fill:#EFEAFB} .agentInk{fill:#4E3A99} .ok{fill:#13995A} .okS{stroke:#13995A} .okSoft{fill:#DCF7E7} .okInk{fill:#0B6B3C} .ask{fill:#2F55C7} .askS{stroke:#2F55C7} .askSoft{fill:#E8EDFB} .askInk{fill:#1F3F9E} .stop{fill:#C81E2A} .stopS{stroke:#C81E2A} .stopSoft{fill:#FDE4E4} .stopInk{fill:#A3121E} .r1{fill:#005F2E} .r1Soft{fill:#DFF8E6} .r1B{stroke:#A6E3BB} .r2{fill:#434E5A} .r2Soft{fill:#EDF1F5} .r2B{stroke:#CFD7E0} .r3{fill:#663B63} .r3Soft{fill:#FAEBF8} .r3B{stroke:#E6C3E2} .r4{fill:#70155A} .r4Soft{fill:#FFDCF8} .r4B{stroke:#F1A6DD} .inkS{stroke:#1B2128} .mutedS{stroke:#56606B} .term{fill:#15191D} .termInk{fill:#E6EAEE} .termMuted{fill:#97A1AC} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#FFFFFF} .onAccentS{stroke:#FFFFFF} svg{--s:#FFFFFF}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker><marker id="m-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ask"/></marker><marker id="m-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="stop"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok"/></marker><marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="agent"/></marker><marker id="m-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="human"/></marker></defs><rect x="0" y="0" width="1200" height="560" rx="24" class="bg line thin"/><text x="64" y="72" font-size="28" text-anchor="start" class="ink b" xml:space="preserve">One question for every permission</text><text x="64" y="104" font-size="19" text-anchor="start" class="accent sb" xml:space="preserve">If your agent gets it wrong, how hard is it to repair?</text><rect x="64" y="292" width="256" height="176" rx="16" class="r1Soft r1B thin"/><text x="84" y="326" font-size="17" text-anchor="start" class="r1 b" xml:space="preserve">Harmless</text><rect x="84" y="342" width="92" height="30" rx="15" class="surface line thin"/><text x="130" y="362" font-size="13" text-anchor="middle" class="ink sb" xml:space="preserve">Read code</text><text x="84" y="404" font-size="15" text-anchor="start" class="ink" xml:space="preserve">Nothing changes.</text><text x="84" y="425" font-size="15" text-anchor="start" class="ink" xml:space="preserve">Let it run all day.</text><rect x="334" y="242" width="256" height="226" rx="16" class="r2Soft r2B thin"/><text x="354" y="276" font-size="17" text-anchor="start" class="r2 b" xml:space="preserve">Worth a look</text><rect x="354" y="292" width="172" height="30" rx="15" class="surface line thin"/><text x="440" y="312" font-size="13" text-anchor="middle" class="ink sb" xml:space="preserve">Search all of GitHub</text><text x="354" y="354" font-size="15" text-anchor="start" class="ink" xml:space="preserve">Reaches beyond the</text><text x="354" y="375" font-size="15" text-anchor="start" class="ink" xml:space="preserve">repositories of</text><text x="354" y="396" font-size="15" text-anchor="start" class="ink" xml:space="preserve">the mission.</text><rect x="604" y="192" width="256" height="276" rx="16" class="r3Soft r3B thin"/><text x="624" y="226" font-size="17" text-anchor="start" class="r3 b" xml:space="preserve">Repairable, at a price</text><rect x="624" y="242" width="136" height="30" rx="15" class="surface line thin"/><text x="692" y="262" font-size="13" text-anchor="middle" class="ink sb" xml:space="preserve">Merge into main</text><text x="624" y="304" font-size="15" text-anchor="start" class="ink" xml:space="preserve">CI runs, people are</text><text x="624" y="325" font-size="15" text-anchor="start" class="ink" xml:space="preserve">notified. Undoing it</text><text x="624" y="346" font-size="15" text-anchor="start" class="ink" xml:space="preserve">takes work.</text><rect x="874" y="142" width="256" height="326" rx="16" class="r4Soft r4B thin"/><text x="894" y="176" font-size="17" text-anchor="start" class="r4 b" xml:space="preserve">Cannot be repaired</text><rect x="894" y="192" width="143" height="30" rx="15" class="surface line thin"/><text x="965" y="212" font-size="13" text-anchor="middle" class="ink sb" xml:space="preserve">Delete a release</text><text x="894" y="254" font-size="15" text-anchor="start" class="ink" xml:space="preserve">Its files are gone</text><text x="894" y="275" font-size="15" text-anchor="start" class="ink" xml:space="preserve">for everyone who</text><text x="894" y="296" font-size="15" text-anchor="start" class="ink" xml:space="preserve">linked to them.</text><path d="M64 496 L 1128 496" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="1128" y="520" font-size="13" text-anchor="end" class="muted" xml:space="preserve">harder to repair</text><text x="64" y="540" font-size="13" text-anchor="start" class="muted" xml:space="preserve">Plugin authors answer it for each permission, and reviewers check the answer like code.</text></svg>
