="2.4" stroke="#FFFFFF"/><text x="100" y="360" font-size="15" text-anchor="start" class="ink" xml:space="preserve">nobody asked before a merge</text><circle cx="80" cy="389" r="10" class="stop"/><path d="M76 385 l8 8 M84 385 l-8 8" fill="none" stroke-width="2.4" stroke="#FFFFFF"/><text x="100" y="394" font-size="15" text-anchor="start" class="ink" xml:space="preserve">it can print it, copy it, leak it</text><rect x="620" y="40" width="540" height="400" rx="22" class="surface line thin"/><text x="648" y="82" font-size="19" text-anchor="start" class="ink b" xml:space="preserve">With Vaubaan: a mission</text><circle cx="690" cy="196" r="30" class="agent"/><rect x="675.0" y="184.6" width="30.0" height="21.0" rx="5.4" class="surface"/><circle cx="684.0" cy="195.1" r="2.7" class="agent"/><circle cx="696.0" cy="195.1" r="2.7" class="agent"/><line x1="690" y1="184.6" x2="690" y2="177.4" class="nofill thick" stroke="#7A5FD0"/><rect x="730" y="172" width="64" height="48" rx="12" class="accentSoft"/><g transform="translate(746 196) scale(0.85)"><circle cx="0" cy="0" r="7" class="nofill thick accentS"/><path d="M7 0 H22 M17 0 V5 M21 0 V4" class="nofill thick accentS" stroke-linecap="round"/></g><path d="M798 196 L 850 196" class="nofill accentS mid" marker-end="url(#m-accent)"/><rect x="856" y="150" width="156" height="92" rx="16" class="accentSoft"/><text x="934" y="182" font-size="15" text-anchor="middle" class="accentInk b" xml:space="preserve">Vaubaan</text><g transform="translate(904 214)"><rect x="-8" y="-2" width="16" height="12" rx="3" class="accentInk"/><path d="M-5 -2 V-6 a5 5 0 0 1 10 0 V-2" class="nofill mid accentInkS"/></g><text x="920" y="219" font-size="12.5" text-anchor="start" class="accentInk" xml:space="preserve">token here</text><path d="M1012 196 L 1052 196" class="nofill accentS mid" marker-end="url(#m-accent)"/><rect x="1058" y="156" width="80" height="80" rx="16" class="vault"/><g transform="translate(1084 166) scale(1.1667)"><path d="M12 .297c-6.63 0-1