<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">One question for every permission</title><desc id="d">Every permission of every service answers one question: if your assistant gets it wrong, how hard is it to repair? Four steps, from Harmless (draft a reply) to Cannot be repaired (send to a client).</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#0E1215} .surface{fill:#151A1F} .ink{fill:#E8ECEF} .muted{fill:#A3ADB7} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#8FB0FF} .accentS{stroke:#8FB0FF} .accentSoft{fill:#17254A} .accentInk{fill:#CBD9FF} .accentInkS{stroke:#CBD9FF} .vault{fill:#1C2228} .human{fill:#3CC9BD} .humanS{stroke:#3CC9BD} .humanSoft{fill:#0D302D} .humanInk{fill:#8EE6DC} .agent{fill:#A990F0} .agentS{stroke:#A990F0} .agentSoft{fill:#26203D} .agentInk{fill:#D6CBFA} .ok{fill:#3DDC84} .okS{stroke:#3DDC84} .okSoft{fill:#0D3320} .okInk{fill:#7EEAAA} .ask{fill:#8FB0FF} .askS{stroke:#8FB0FF} .askSoft{fill:#17254A} .askInk{fill:#CBD9FF} .stop{fill:#FF6B6B} .stopS{stroke:#FF6B6B} .stopSoft{fill:#3F1215} .stopInk{fill:#FFA3A3} .r1{fill:#A1E3B7} .r1Soft{fill:#173221} .r1B{stroke:#2C5A3B} .r2{fill:#C8D2DD} .r2Soft{fill:#282C30} .r2B{stroke:#41474E} .r3{fill:#EAC3E5} .r3Soft{fill:#342633} .r3B{stroke:#5A4058} .r4{fill:#FFBCEE} .r4Soft{fill:#48203C} .r4B{stroke:#74365F} .inkS{stroke:#E8ECEF} .mutedS{stroke:#A3ADB7} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#0E1215} .onAccentS{stroke:#0E1215} svg{--s:#151A1F}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker><marker id="m-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ask"/></marker><marker id="m-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="stop"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok"/></marker><marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="agent"/></marker><marker id="m-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="human"/></marker></defs><rect x="0" y="0" width="1200" height="560" rx="24" class="bg line thin"/><text x="64" y="72" font-size="28" text-anchor="start" class="ink b" xml:space="preserve">One question for every permission</text><text x="64" y="104" font-size="19" text-anchor="start" class="accent sb" xml:space="preserve">If your agent gets it wrong, how hard is it to repair?</text><rect x="64" y="292" width="256" height="176" rx="16" class="r1Soft r1B thin"/><text x="84" y="326" font-size="17" text-anchor="start" class="r1 b" xml:space="preserve">Harmless</text><rect x="84" y="342" width="121" height="30" rx="15" class="surface line thin"/><text x="144" y="362" font-size="13" text-anchor="middle" class="ink sb" xml:space="preserve">Draft a reply</text><text x="84" y="404" font-size="15" text-anchor="start" class="ink" xml:space="preserve">Nothing leaves.</text><text x="84" y="425" font-size="15" text-anchor="start" class="ink" xml:space="preserve">You read it first.</text><rect x="334" y="242" width="256" height="226" rx="16" class="r2Soft r2B thin"/><text x="354" y="276" font-size="17" text-anchor="start" class="r2 b" xml:space="preserve">Worth a look</text><rect x="354" y="292" width="136" height="30" rx="15" class="surface line thin"/><text x="422" y="312" font-size="13" text-anchor="middle" class="ink sb" xml:space="preserve">Read the agenda</text><text x="354" y="354" font-size="15" text-anchor="start" class="ink" xml:space="preserve">Who you meet, when</text><text x="354" y="375" font-size="15" text-anchor="start" class="ink" xml:space="preserve">and where: personal</text><text x="354" y="396" font-size="15" text-anchor="start" class="ink" xml:space="preserve">data.</text><rect x="604" y="192" width="256" height="276" rx="16" class="r3Soft r3B thin"/><text x="624" y="226" font-size="17" text-anchor="start" class="r3 b" xml:space="preserve">Repairable, at a price</text><rect x="624" y="242" width="128" height="30" rx="15" class="surface line thin"/><text x="688" y="262" font-size="13" text-anchor="middle" class="ink sb" xml:space="preserve">Move a meeting</text><text x="624" y="304" font-size="15" text-anchor="start" class="ink" xml:space="preserve">Guests see it move.</text><text x="624" y="325" font-size="15" text-anchor="start" class="ink" xml:space="preserve">Moving it back takes</text><text x="624" y="346" font-size="15" text-anchor="start" class="ink" xml:space="preserve">an apology.</text><rect x="874" y="142" width="256" height="326" rx="16" class="r4Soft r4B thin"/><text x="894" y="176" font-size="17" text-anchor="start" class="r4 b" xml:space="preserve">Cannot be repaired</text><rect x="894" y="192" width="143" height="30" rx="15" class="surface line thin"/><text x="965" y="212" font-size="13" text-anchor="middle" class="ink sb" xml:space="preserve">Send to a client</text><text x="894" y="254" font-size="15" text-anchor="start" class="ink" xml:space="preserve">A sent mail cannot</text><text x="894" y="275" font-size="15" text-anchor="start" class="ink" xml:space="preserve">be called back.</text><path d="M64 496 L 1128 496" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="1128" y="520" font-size="13" text-anchor="end" class="muted" xml:space="preserve">harder to repair</text><text x="64" y="540" font-size="13" text-anchor="start" class="muted" xml:space="preserve">Plugin authors answer it for each permission, and reviewers check the answer like code.</text></svg>
