<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">Ask me first</title><desc id="d">The assistant sends the recap to a client; Vaubaan refuses with approval-required and the page of the request; you see it waiting for you, read the exact mail and approve; when you tell the assistant, it replays the same call and the mail leaves.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#0E1215} .surface{fill:#151A1F} .ink{fill:#E8ECEF} .muted{fill:#A3ADB7} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#8FB0FF} .accentS{stroke:#8FB0FF} .accentSoft{fill:#17254A} .accentInk{fill:#CBD9FF} .accentInkS{stroke:#CBD9FF} .vault{fill:#1C2228} .human{fill:#3CC9BD} .humanS{stroke:#3CC9BD} .humanSoft{fill:#0D302D} .humanInk{fill:#8EE6DC} .agent{fill:#A990F0} .agentS{stroke:#A990F0} .agentSoft{fill:#26203D} .agentInk{fill:#D6CBFA} .ok{fill:#3DDC84} .okS{stroke:#3DDC84} .okSoft{fill:#0D3320} .okInk{fill:#7EEAAA} .ask{fill:#8FB0FF} .askS{stroke:#8FB0FF} .askSoft{fill:#17254A} .askInk{fill:#CBD9FF} .stop{fill:#FF6B6B} .stopS{stroke:#FF6B6B} .stopSoft{fill:#3F1215} .stopInk{fill:#FFA3A3} .r1{fill:#A1E3B7} .r1Soft{fill:#173221} .r1B{stroke:#2C5A3B} .r2{fill:#C8D2DD} .r2Soft{fill:#282C30} .r2B{stroke:#41474E} .r3{fill:#EAC3E5} .r3Soft{fill:#342633} .r3B{stroke:#5A4058} .r4{fill:#FFBCEE} .r4Soft{fill:#48203C} .r4B{stroke:#74365F} .inkS{stroke:#E8ECEF} .mutedS{stroke:#A3ADB7} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#0E1215} .onAccentS{stroke:#0E1215} svg{--s:#151A1F}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker><marker id="m-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ask"/></marker><marker id="m-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="stop"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok"/></marker><marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="agent"/></marker><marker id="m-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="human"/></marker></defs><rect x="0" y="0" width="1200" height="470" rx="24" class="bg line thin"/><text x="64" y="72" font-size="28" text-anchor="start" class="ink b" xml:space="preserve">Ask me first</text><text x="64" y="102" font-size="16" text-anchor="start" class="muted" xml:space="preserve">Nothing waits inside Vaubaan. The yes is given on a page, by you only.</text><circle cx="240" cy="150" r="22" class="agent"/><rect x="229.0" y="141.6" width="22.0" height="15.4" rx="4.0" class="surface"/><circle cx="235.6" cy="149.3" r="2.0" class="agent"/><circle cx="244.4" cy="149.3" r="2.0" class="agent"/><line x1="240" y1="141.6" x2="240" y2="136.4" class="nofill thick" stroke="#A990F0"/><text x="274" y="156" font-size="16" text-anchor="start" class="ink b" xml:space="preserve">Your agent</text><line x1="240" y1="180" x2="240" y2="440" class="line mid dash"/><rect x="578" y="128" width="44" height="44" rx="12" class="accent"/><text x="600" y="156" font-size="18" text-anchor="middle" class="onAccent b" xml:space="preserve">V</text><text x="634" y="156" font-size="16" text-anchor="start" class="ink b" xml:space="preserve">Vaubaan</text><line x1="600" y1="180" x2="600" y2="440" class="line mid dash"/><circle cx="960" cy="150" r="22" class="human"/><circle cx="960" cy="144.1" r="7.0" class="surface"/><path d="M947.9 164.1 a12.1 9.9 0 0 1 24.2 0z" class="surface"/><text x="994" y="156" font-size="16" text-anchor="start" class="ink b" xml:space="preserve">You</text><line x1="960" y1="180" x2="960" y2="440" class="line mid dash"/><path d="M246 210 L 592 210" class="nofill agentS mid" marker-end="url(#m-agent)"/><rect x="285" y="184.5" width="269" height="22.5" rx="6" class="bg"/><text x="420.0" y="200" font-size="13.5" text-anchor="middle" class="agentInk sb" xml:space="preserve">1  send the recap to jane@acme.com</text><path d="M594 258 L 248 258" class="nofill stopS mid dash" marker-end="url(#m-stop)"/><rect x="240" y="232.5" width="360" height="22.5" rx="6" class="bg"/><text x="420.0" y="248" font-size="13.5" text-anchor="middle" class="stopInk sb" xml:space="preserve">2  approval-required + the page of the request</text><path d="M606 306 L 952 306" class="nofill askS mid dash" marker-end="url(#m-ask)"/><rect x="615" y="280.5" width="330" height="22.5" rx="6" class="bg"/><text x="780.0" y="296" font-size="13.5" text-anchor="middle" class="askInk sb" xml:space="preserve">3  “Send the recap to Jane?” waits for you</text><path d="M954 354 L 608 354" class="nofill accentS mid" marker-end="url(#m-accent)"/><rect x="653" y="328.5" width="254" height="22.5" rx="6" class="bg"/><text x="780.0" y="344" font-size="13.5" text-anchor="middle" class="accentInk sb" xml:space="preserve">4  you read the call and approve</text><path d="M246 414 L 592 414" class="nofill okS mid" marker-end="url(#m-ok)"/><rect x="221" y="388.5" width="398" height="22.5" rx="6" class="bg"/><text x="420.0" y="404" font-size="13.5" text-anchor="middle" class="okInk sb" xml:space="preserve">5  you tell the agent; it replays the call: it runs</text><rect x="969" y="300" width="207" height="96" rx="14" class="surface line thin"/><text x="983" y="324" font-size="10.5" text-anchor="start" class="muted mono" xml:space="preserve">gmail.send-to-zone-allowlist</text><text x="983" y="348" font-size="12.5" text-anchor="start" class="ink mono" xml:space="preserve">jane@acme.com · recap</text><rect x="983" y="360" width="72" height="26" rx="13" class="accent"/><text x="1019" y="378" font-size="12" text-anchor="middle" class="onAccent b" xml:space="preserve">Approve</text><rect x="1061" y="360" width="70" height="26" rx="13" class="surface line thin"/><text x="1096" y="378" font-size="12" text-anchor="middle" class="ink b" xml:space="preserve">Refuse</text></svg>
