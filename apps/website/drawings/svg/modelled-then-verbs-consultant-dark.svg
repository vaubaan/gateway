<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d"><title id="t">Modelled, then folded into verbs</title><desc id="d">Gmail, modelled: one mailbox plane with what Gmail keeps, plus zones Gmail does not have: who wrote a mail and who receives it, read from your domains and your client list. Sending becomes four permissions, one per recipient zone, each on its own row. The 19 permissions fold into 4 verbs a person ticks.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .thick{stroke-width:2.5} .dash{stroke-dasharray:6 6} .nofill{fill:none} .bg{fill:#0E1215} .surface{fill:#151A1F} .ink{fill:#E8ECEF} .muted{fill:#A3ADB7} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#8FB0FF} .accentS{stroke:#8FB0FF} .accentSoft{fill:#17254A} .accentInk{fill:#CBD9FF} .accentInkS{stroke:#CBD9FF} .vault{fill:#1C2228} .human{fill:#3CC9BD} .humanS{stroke:#3CC9BD} .humanSoft{fill:#0D302D} .humanInk{fill:#8EE6DC} .agent{fill:#A990F0} .agentS{stroke:#A990F0} .agentSoft{fill:#26203D} .agentInk{fill:#D6CBFA} .ok{fill:#3DDC84} .okS{stroke:#3DDC84} .okSoft{fill:#0D3320} .okInk{fill:#7EEAAA} .ask{fill:#8FB0FF} .askS{stroke:#8FB0FF} .askSoft{fill:#17254A} .askInk{fill:#CBD9FF} .stop{fill:#FF6B6B} .stopS{stroke:#FF6B6B} .stopSoft{fill:#3F1215} .stopInk{fill:#FFA3A3} .r1{fill:#A1E3B7} .r1Soft{fill:#173221} .r1B{stroke:#2C5A3B} .r2{fill:#C8D2DD} .r2Soft{fill:#282C30} .r2B{stroke:#41474E} .r3{fill:#EAC3E5} .r3Soft{fill:#342633} .r3B{stroke:#5A4058} .r4{fill:#FFBCEE} .r4Soft{fill:#48203C} .r4B{stroke:#74365F} .inkS{stroke:#E8ECEF} .mutedS{stroke:#A3ADB7} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1} .termOk{fill:#5CC48A} .termAsk{fill:#9DB7FF} .termStop{fill:#F08A76} .onAccent{fill:#0E1215} .onAccentS{stroke:#0E1215} svg{--s:#151A1F}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker><marker id="m-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ask"/></marker><marker id="m-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="stop"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok"/></marker><marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="agent"/></marker><marker id="m-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="human"/></marker></defs><rect x="0" y="0" width="1200" height="680" rx="24" class="bg line thin"/><text x="64" y="72" font-size="28" text-anchor="start" class="ink b" xml:space="preserve">We modelled each service. You tick a few verbs.</text><text x="64" y="102" font-size="16" text-anchor="start" class="muted" xml:space="preserve">Its planes, its entities, where the environment lives; then its acts, cut into permissions, folded into verbs.</text><rect x="40" y="140" width="460" height="464" rx="16" class="surface line thin"/><rect x="40" y="140" width="460" height="40" rx="16" class="vault"/><rect x="40" y="164" width="460" height="16" class="vault"/><line x1="40" y1="180" x2="500" y2="180" class="line thin"/><rect x="40" y="140" width="460" height="464" rx="16" class="nofill line thin"/><text x="58" y="166" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">1 ·      Gmail, modelled</text><g transform="translate(76 150) scale(0.8333)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/></g><text x="60" y="204" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">1 plane, the mailbox; zones added by Vaubaan</text><rect x="60" y="222" width="420" height="48" rx="12" class="accentSoft"/><text x="76" y="252" font-size="15" text-anchor="start" class="accentInk mono b" xml:space="preserve">mailbox</text><text x="153.8" y="252" font-size="12.5" text-anchor="start" class="accentInk" xml:space="preserve">knows your domains and clients</text><rect x="60" y="292" width="98" height="268" rx="12" class="vault"/><line x1="109" y1="270" x2="109" y2="292" class="accentS thin"/><text x="72" y="318" font-size="13.5" text-anchor="start" class="ink mono b" xml:space="preserve">stored</text><rect x="68" y="331" width="82" height="24" rx="8" class="surface line thin"/><text x="74" y="348" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">label</text><rect x="68" y="361" width="82" height="24" rx="8" class="surface line thin"/><text x="74" y="378" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">thread</text><rect x="68" y="391" width="82" height="24" rx="8" class="surface line thin"/><text x="74" y="408" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">message</text><rect x="68" y="421" width="82" height="24" rx="8" class="surface line thin"/><text x="74" y="438" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">attachment</text><rect x="68" y="451" width="82" height="24" rx="8" class="surface line thin"/><text x="74" y="468" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">draft</text><rect x="168" y="292" width="98" height="268" rx="12" class="vault accentS thin dash"/><line x1="216" y1="270" x2="216" y2="292" class="accentS thin"/><text x="180" y="318" font-size="13.5" text-anchor="start" class="ink mono b" xml:space="preserve">from</text><rect x="176" y="331" width="82" height="24" rx="8" class="surface line thin"/><text x="182" y="348" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">notifications</text><rect x="176" y="361" width="82" height="24" rx="8" class="surface line thin"/><text x="182" y="378" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">colleagues</text><rect x="176" y="391" width="82" height="24" rx="8" class="surface line thin"/><text x="182" y="408" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">clients</text><rect x="176" y="421" width="82" height="24" rx="8" class="surface line thin"/><text x="182" y="438" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">unknown</text><rect x="275" y="292" width="98" height="268" rx="12" class="vault accentS thin dash"/><line x1="324" y1="270" x2="324" y2="292" class="accentS thin"/><text x="287" y="318" font-size="13.5" text-anchor="start" class="ink mono b" xml:space="preserve">to</text><rect x="283" y="331" width="82" height="24" rx="8" class="surface line thin"/><text x="289" y="348" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">yourself</text><rect x="283" y="361" width="82" height="24" rx="8" class="surface line thin"/><text x="289" y="378" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">colleagues</text><rect x="283" y="391" width="82" height="24" rx="8" class="surface line thin"/><text x="289" y="408" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">clients</text><rect x="283" y="421" width="82" height="24" rx="8" class="surface line thin"/><text x="289" y="438" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">anyone</text><rect x="382" y="292" width="98" height="268" rx="12" class="vault accentS thin dash"/><line x1="431" y1="270" x2="431" y2="292" class="accentS thin"/><text x="394" y="318" font-size="13.5" text-anchor="start" class="ink mono b" xml:space="preserve">flags</text><rect x="390" y="331" width="82" height="24" rx="8" class="surface line thin"/><text x="396" y="348" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">sensitive</text><rect x="390" y="361" width="82" height="24" rx="8" class="surface line thin"/><text x="396" y="378" font-size="11.5" text-anchor="start" class="ink" xml:space="preserve">bulk</text><rect x="60" y="574" width="26" height="14" rx="4" class="nofill accentS thin dash"/><text x="94" y="586" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">dashed: not in Gmail, added by the model</text><path d="M504 372 L 524 372" class="nofill accentS mid" marker-end="url(#m-accent)"/><rect x="530" y="140" width="290" height="464" rx="16" class="surface line thin"/><rect x="530" y="140" width="290" height="40" rx="16" class="accentSoft"/><rect x="530" y="164" width="290" height="16" class="accentSoft"/><line x1="530" y1="180" x2="820" y2="180" class="line thin"/><rect x="530" y="140" width="290" height="464" rx="16" class="nofill line thin"/><text x="548" y="166" font-size="14" text-anchor="start" class="accentInk b" xml:space="preserve">2 · One act, one line per recipient</text><rect x="548" y="196" width="254" height="30" rx="15" class="surface accentS mid"/><text x="675.0" y="216" font-size="13.5" text-anchor="middle" class="ink b" xml:space="preserve">Send a message</text><path d="M570 226 V 245 H 590" class="nofill accentS thin"/><rect x="592" y="233" width="100" height="24" rx="12" class="surface line thin"/><text x="642" y="250" font-size="11.5" text-anchor="middle" class="ink sb" xml:space="preserve">yourself</text><rect x="698" y="234" width="55" height="22" rx="11" class="r1Soft r1B thin"/><text x="726" y="249" font-size="9.5" text-anchor="middle" class="r1 b" xml:space="preserve">Harmless</text><path d="M570 226 V 277 H 590" class="nofill accentS thin"/><rect x="592" y="265" width="100" height="24" rx="12" class="surface line thin"/><text x="642" y="282" font-size="11.5" text-anchor="middle" class="ink sb" xml:space="preserve">colleagues</text><rect x="698" y="266" width="131" height="22" rx="11" class="r3Soft r3B thin"/><text x="763" y="281" font-size="9.5" text-anchor="middle" class="r3 b" xml:space="preserve">Repairable, at a price</text><path d="M570 226 V 309 H 590" class="nofill accentS thin"/><rect x="592" y="297" width="100" height="24" rx="12" class="surface line thin"/><text x="642" y="314" font-size="11.5" text-anchor="middle" class="ink sb" xml:space="preserve">clients</text><rect x="698" y="298" width="109" height="22" rx="11" class="r4Soft r4B thin"/><text x="753" y="313" font-size="9.5" text-anchor="middle" class="r4 b" xml:space="preserve">Cannot be repaired</text><path d="M570 226 V 341 H 590" class="nofill accentS thin"/><rect x="592" y="329" width="100" height="24" rx="12" class="surface line thin"/><text x="642" y="346" font-size="11.5" text-anchor="middle" class="ink sb" xml:space="preserve">anyone</text><rect x="698" y="330" width="109" height="22" rx="11" class="r4Soft r4B thin"/><text x="753" y="345" font-size="9.5" text-anchor="middle" class="r4 b" xml:space="preserve">Cannot be repaired</text><text x="550" y="380" font-size="12" text-anchor="start" class="muted" xml:space="preserve">priced by who receives it</text><rect x="548" y="404" width="254" height="30" rx="15" class="surface accentS mid"/><text x="675.0" y="424" font-size="13.5" text-anchor="middle" class="ink b" xml:space="preserve">Read a thread</text><path d="M570 434 V 453 H 590" class="nofill accentS thin"/><rect x="592" y="441" width="100" height="24" rx="12" class="surface line thin"/><text x="642" y="458" font-size="11.5" text-anchor="middle" class="ink sb" xml:space="preserve">unknown sender</text><rect x="698" y="442" width="55" height="22" rx="11" class="r1Soft r1B thin"/><text x="726" y="457" font-size="9.5" text-anchor="middle" class="r1 b" xml:space="preserve">Harmless</text><text x="550" y="492" font-size="12" text-anchor="start" class="muted" xml:space="preserve">where injected text comes from</text><path d="M824 372 L 846 372" class="nofill accentS mid" marker-end="url(#m-accent)"/><rect x="852" y="140" width="308" height="464" rx="16" class="surface line thin"/><rect x="852" y="140" width="308" height="40" rx="16" class="accentSoft"/><rect x="852" y="164" width="308" height="16" class="accentSoft"/><line x1="852" y1="180" x2="1160" y2="180" class="line thin"/><rect x="852" y="140" width="308" height="464" rx="16" class="nofill line thin"/><text x="870" y="166" font-size="14" text-anchor="start" class="accentInk b" xml:space="preserve">3 · Verbs you tick</text><text x="1142" y="166" font-size="13" text-anchor="end" class="muted mono" xml:space="preserve">19 permissions</text><rect x="870" y="195" width="20" height="20" rx="5" class="surface line mid"/><text x="900" y="210" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">Search the mail</text><text x="1142" y="210" font-size="12" text-anchor="end" class="muted" xml:space="preserve">8 lines</text><text x="900" y="232" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">Read the structure, the threads and</text><text x="900" y="250" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">the messages, whoever sent them.</text><rect x="870" y="273" width="20" height="20" rx="5" class="surface line mid"/><text x="900" y="288" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">Draft</text><text x="1142" y="288" font-size="12" text-anchor="end" class="muted" xml:space="preserve">4 lines</text><text x="900" y="310" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">Write and edit drafts. Nothing</text><text x="900" y="328" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">leaves.</text><rect x="870" y="351" width="20" height="20" rx="5" class="surface line mid"/><text x="900" y="366" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">Send</text><text x="1142" y="366" font-size="12" text-anchor="end" class="muted" xml:space="preserve">4 lines</text><text x="900" y="388" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">Send a message or a draft. Nothing</text><text x="900" y="406" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">can call it back.</text><rect x="870" y="429" width="20" height="20" rx="5" class="surface line mid"/><text x="900" y="444" font-size="15" text-anchor="start" class="ink b" xml:space="preserve">Tidy</text><text x="1142" y="444" font-size="12" text-anchor="end" class="muted" xml:space="preserve">3 lines</text><text x="900" y="466" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve">Apply, remove and create labels.</text><text x="64" y="640" font-size="14" text-anchor="start" class="muted" xml:space="preserve">21 services modelled the same way: 29 planes, 279 permissions, 85 verbs.</text></svg>
