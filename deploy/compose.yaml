# Vaubaan Gateway — reference deployment: the gateway, its data volume and a
# TLS-terminating reverse proxy (Caddy, automatic certificates).
#
#   cp deploy/config/.env.example deploy/config/.env         # then edit
#   cp deploy/config/gateway.example.yaml deploy/config/gateway.yaml
#   docker compose --env-file deploy/config/.env -f deploy/compose.yaml up -d --build
#
# `--env-file` is required on every command (up, down, logs, config): it is
# where Compose reads GATEWAY_DOMAIN, the one variable handed to the proxy.
# Every value comes from deploy/config/.env or deploy/config/gateway.yaml;
# nothing in this file is specific to one company.
name: vaubaan

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    image: vaubaan-gateway:local
    restart: unless-stopped
    init: true
    # Hardening (security audit 2026-10-31, L9): the image's own root filesystem
    # is read-only, no Linux capability is kept and no process gains a privilege.
    # The server writes to /data (the volume) and to /tmp, nothing else; it runs
    # as the image's user 10001, so the entrypoint's root branch (chown, setpriv)
    # is not taken here.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - ./config/.env
    environment:
      # The mounted YAML wins over the environment, key by key (the example
      # file ships with every key commented out, so .env decides until edited).
      # The store path belongs here, next to the volume that holds it.
      VAUBAAN_CONFIG_FILE: /config/gateway.yaml
      VAUBAAN_STORE_PATH: /data/gateway.db
      # The master key goes on its own volume, gateway-key at /keys, never beside
      # the store it seals: a snapshot or backup of gateway-data alone opens
      # nothing (ADR master-key-generated-and-handed-over-by-the-instance,
      # amendment 2026-10-31). deploy/config/.env names the file
      # (VAUBAAN_MASTER_KEY_FILE=/keys/master.key), or gives the key itself; the
      # boot warns while the file sits on /data. Back the two volumes up
      # separately; keep the key's copy off the host too.
      # The one proxy whose X-Forwarded-For is believed: Caddy, at its fixed
      # address below. Never a whole Docker pool: every container on it could
      # then pick the address it is limited and audited under. A value in
      # deploy/config/.env wins (another proxy in front of Caddy, say). Behind an
      # edge that overwrites a client-address header (client_ip_header), remove
      # this line: the two settings exclude each other.
      VAUBAAN_TRUSTED_PROXIES: ${VAUBAAN_TRUSTED_PROXIES:-172.30.253.2}
    networks:
      - edge
    volumes:
      - gateway-data:/data
      - gateway-key:/keys
      - ./config/gateway.yaml:/config/gateway.yaml:ro
    # The image's HEALTHCHECK (deploy/docker/Dockerfile, honours PORT) applies;
    # `depends_on: service_healthy` below relies on it.
    expose:
      - '3000'

  proxy:
    # Pinned by version and by digest (multi-architecture index). The digest
    # is what is pulled; the tag is ignored once it is present, so bump both together.
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    # The proxy faces the internet, so it receives GATEWAY_DOMAIN (host part
    # of public_url) and nothing else: never give it the gateway's env_file,
    # which holds the master key, the bootstrap token and the IdP secret.
    # Caddy obtains and renews the certificate for it (ports 80/443 reachable).
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?set GATEWAY_DOMAIN in deploy/config/.env and pass --env-file deploy/config/.env}
    networks:
      edge:
        # Fixed, so the gateway can trust this address alone (VAUBAAN_TRUSTED_PROXIES).
        ipv4_address: 172.30.253.2
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  # The proxy and the gateway, nothing else. If the subnet is taken on the
  # host, change it here and the two addresses above together.
  edge:
    ipam:
      config:
        - subnet: 172.30.253.0/29

volumes:
  gateway-data:
  gateway-key:
  caddy-data:
  caddy-config:
