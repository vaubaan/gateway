# Version updates, proposed as pull requests (docs/workflow/coding-workflow.md,
# "Dependency updates"). Dependabot reads this file from the default branch only.
#
# Every pull request costs a CI run in billed minutes (ADR
# ci-billed-minutes-budget), so the updates come in as few pull requests as
# possible: npm once a week, every minor and patch together in one pull request
# and every major together in another, a major only once it is a month old; the
# base image, Caddy and the actions once a month.
#
# Cooldown: a version is proposed only once it has been public for some days —
# never one published in the last 72 hours. A malicious release is usually found
# and pulled within that window. Security updates (an advisory with a fixed
# version) are not delayed by the cooldown nor by the schedule: Dependabot opens
# them at once, when Dependabot security updates are enabled in the repository
# settings; the dependency audit of every CI run fails on them meanwhile.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 4
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    ignore:
      # The types of Node follow the runtime (the base image of
      # deploy/docker/Dockerfile and node-version of the workflows), never run
      # ahead of it: types of a newer major compile calls the runtime does not
      # have. The major moves with the base image, by hand, in one pull request.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7 ships no compiler API, which typescript-eslint's typed
      # rules and our structural tests need: stay on 6.x until
      # typescript-eslint supports 7 (ADR typescript-7, status proposed,
      # which says when to remove this entry).
      - dependency-name: typescript
        versions: ['>=7.0.0']
    groups:
      # One pull request for every minor and patch, production and development.
      npm:
        patterns: ['*']
        update-types: [minor, patch]
      # One pull request for every major: still a decision each, read together.
      npm-major:
        patterns: ['*']
        update-types: [major]

  # The base image of deploy/docker/Dockerfile (node, pinned by version and
  # digest). A new version also needs the documentation that quotes it: the
  # structural test base-images-pinned fails until deploy/README.md and the
  # coding workflow are updated on the same branch. The OAuth broker's image
  # (apps/oauth-broker/Dockerfile) starts from the same pinned base, which its
  # own test holds (apps/oauth-broker/tests/unit/image.test.ts).
  - package-ecosystem: docker
    directories: ['/deploy/docker', '/apps/oauth-broker']
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 4
    commit-message:
      prefix: chore(deps)
    ignore:
      # The Node major is the runtime of the image: a decision, not a bump.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # Caddy in the reference Compose file, pinned the same way.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 4
    commit-message:
      prefix: chore(deps)

  # The actions of the workflows, pinned by commit: Dependabot moves the commit
  # and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ['*']
