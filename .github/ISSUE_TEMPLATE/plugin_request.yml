name: Plugin request
description: Ask for a new provider plugin, or announce that you will write one.
title: '[plugin] '
labels: ['plugin']
body:
  - type: markdown
    attributes:
      value: |
        A provider plugin lives under `plugins/<provider>`. The guide to write one is `plugins/README.md`; this issue is its step 0. Its purpose is to agree on the tools and on the dangerous operations before any code: the risk catalog is the part that is reviewed hardest.

        To correct a plugin that already exists, use "Catalog correction" or "Bug report".
  - type: input
    id: provider
    attributes:
      label: Provider
      placeholder: e.g. Linear, Datadog, AWS IAM
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Link to the provider's API documentation
      description: The classifier is written from this documentation, never from memory.
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: What an agent would do with it
      description: The work you want a coding agent to be able to do. It bounds the tools worth exposing and the risks worth modelling.
    validations:
      required: true
  - type: dropdown
    id: credential
    attributes:
      label: How does the provider authenticate
      description: The three kinds a plugin can declare. A token the user creates once at the provider and pastes is the default; OAuth is kept for a provider that gives no such token (ADR one-place-to-authorize-services-token-first).
      options:
        - API key or personal token pasted by the user (`api-key`)
        - OAuth 2.0 with user consent, through the gateway's broker (`oauth2`)
        - SSH key pair generated by the gateway (`ssh-key`)
        - Several, or something else (explain below)
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Resources and environments
      description: What a connection reaches and a mission should be limited to (repositories, projects, zones, databases…), and whether the provider tells production from staging or test (separate projects, a mode, a branch, nothing).
      placeholder: One resource per project. No notion of environment at the provider; the owner labels each project.
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Tools
      description: The operations to expose, as verb and noun. Mark reads and writes.
      placeholder: |
        list_issues (read), get_issue (read), create_issue (write), close_issue (write)
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Dangerous operations
      description: What should never happen without the mission creator having accepted it. Think of what is irreversible, costly, visible to customers, touches secrets or personal data, or changes access rights.
    validations:
      required: true
  - type: input
    id: existing
    attributes:
      label: Existing MCP server for this provider, if any
      description: A link. A plugin may wrap one, provided every tool can be classified.
  - type: dropdown
    id: contribution
    attributes:
      label: Are you offering to write it
      options:
        - 'Yes, I will open a PR'
        - 'Yes, with guidance'
        - 'No, this is a request'
    validations:
      required: true
