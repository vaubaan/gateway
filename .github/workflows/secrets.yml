name: secrets

# Secret scan on every push to a work branch (ci.yml runs the same scan in its
# `audit` job on a pull request; main receives only squash merges of
# scanned branches): a credential pushed to a work branch is found before it is
# merged, not after. The whole history, with the
# rules and reviewed exceptions of .gitleaks.toml (scripts/secret-scan.sh).
# Seconds of work; one billed minute per push.
#
# A finding: revoke the credential at its issuer first, then remove it from the
# branch. The history is not rewritten to hide a secret: it was exposed.

on:
  push:
    branches-ignore: [main]

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/secret-scan.sh
