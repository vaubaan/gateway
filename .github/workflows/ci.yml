name: ci

on:
  push:
    branches: [main, v5]
  pull_request:
    branches: [main, v5]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# @sbw-vaubaan/harness is an optionalDependency served from a private registry;
# npm skips it when NPM_READ_TOKEN is absent (see CONTRIBUTING.md).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
        env:
          SKIP_LIVE: '1'

  # Builds the single gateway image (deploy/docker/Dockerfile) and runs the
  # container smoke test: incomplete configuration exits naming the key, a
  # complete one serves /healthz, native addons load, process is non-root.
  # Publishing to a registry is the release pipeline's job (P3.2).
  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: vaubaan-gateway:ci
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: deploy/docker/smoke.sh vaubaan-gateway:ci
