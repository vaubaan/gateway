name: ci

on:
  push:
    branches: [main, v5]
  pull_request:
    branches: [main, v5]
  workflow_dispatch:
  # Weekly, the security checks only (secrets, sast, audit, the image scan):
  # a new advisory or a new rule finds what an unchanged tree already ships.
  # GitHub runs schedules from the default branch only.
  schedule:
    - cron: '23 5 * * 1'
  # The release pipeline (release.yml) calls this workflow as its gates, so a
  # release passes exactly what a pull request passes.
  workflow_call:

# `github.workflow` is the caller's name when this file is called by
# release.yml: a release of a ref never cancels, nor is cancelled by, the CI
# run of the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependencies are installed with `npm ci`: exactly the lockfile, or a failure.
#
# Actions are pinned by commit, as in release.yml: a tag can be moved, a commit
# cannot. The comment after each pin names the release it is.
permissions:
  contents: read

jobs:
  # What this run has to check (scripts/ci-scope.sh): `code=false` when a push
  # or a pull request changes documentation only (docs/**, *.md). Then the
  # `docs` job runs instead of check, lint, test, e2e and docker. A schedule,
  # a manual run, a release (workflow_call) or a new branch checks everything.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: scripts/ci-scope.sh "$BASE" HEAD | tee -a "$GITHUB_OUTPUT"

  # Types, format, registry signatures, the website build. Incremental: the
  # tsc build info and the Prettier cache of the last run are restored, so a
  # small change re-checks little (the caches hold results, never a verdict:
  # a file whose content changed is checked again).
  check:
    needs: scope
    if: github.event_name != 'schedule' && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Every installed package carries the registry's signature, and those
      # that publish a provenance attestation have a valid one.
      - run: npm audit signatures
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/tsconfig.tsbuildinfo
            !node_modules/**
            .cache/prettier
          key: check-cache-${{ github.sha }}
          restore-keys: check-cache-
      - run: npm run type-check
      - run: npm run format:check
      # The gateway is built by `e2e` (and by `docker`, in the image).
      - run: npm run build --workspace @vaubaan/website
        env:
          VAUBAAN_BUILD_TYPECHECKED: '1'

  # Type-aware ESLint. On a pull request the cache of the last run is restored
  # and only the files whose content changed are linted; a push to a
  # protected branch lints everything (a type changed in one file can make a
  # rule fail in another file that did not change).
  lint:
    needs: scope
    if: github.event_name != 'schedule' && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/eslint
          key: eslint-cache-${{ github.sha }}
          restore-keys: eslint-cache-
      # The website imports the collections fumadocs generates (.source/);
      # without them its types do not resolve (`type-check` generates them in
      # `check`, this job does not run it).
      - run: npm run generate --workspace @vaubaan/website
      - run: npm run lint
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/eslint
          key: eslint-cache-${{ github.sha }}

  # Vitest, in two shards. Each runs its half of the `shared` project without
  # isolation; the first also runs the `isolated` project (npm run test).
  test:
    needs: scope
    if: github.event_name != 'schedule' && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npx vitest run --project shared --no-isolate --shard="${{ matrix.shard }}/2"
      - if: matrix.shard == 1
        run: npx vitest run --project isolated

  # A documentation-only change: the format of the changed files, and the tests
  # that read documentation (the structural index against the spec, the key
  # table of the configuration handbook, …): every test file naming `docs/`
  # or a `.md` file.
  docs:
    needs: scope
    if: github.event_name != 'schedule' && needs.scope.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/tsconfig.tsbuildinfo
            !node_modules/**
            .cache/prettier
          key: check-cache-${{ github.sha }}
          restore-keys: check-cache-
      - run: npm run format:check
      - name: Tests that read documentation
        run: |
          mapfile -t files < <(git ls-files '*.test.ts' '*.test.tsx' '*.test.mjs' |
            xargs grep -lE "docs/|\.md['\"\`]")
          npx vitest run --project shared --no-isolate "${files[@]}"

  # Dependency audit: `npm audit --omit=dev` against the reviewed allowlist
  # (.github/audit-allowlist.json). Fails on an advisory that is not allowlisted
  # or whose review date has passed; a registry that does not answer after the
  # retries is a warning, never a failure (scripts/audit-gate.mjs). Reads the
  # lockfile only: nothing is installed, no install script runs.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/audit-gate.mjs
      # Every lockfile entry downloads from the npm registry, with a
      # sha512 integrity, the package it names (scripts/lockfile-gate.mjs).
      - run: node scripts/lockfile-gate.mjs
      # The workflows themselves: syntax, expressions, and shellcheck on every
      # `run:` (actionlint, pinned by checksum; shellcheck is on the runner).
      - name: Workflows are valid
        run: |
          actionlint=$(scripts/fetch-tool.sh actionlint "${RUNNER_TEMP}/security-tools")
          "$actionlint" -color

  # Secret scan of the whole history with gitleaks, pinned by checksum
  # (scripts/secret-scan.sh, reviewed exceptions in .gitleaks.toml). The other
  # branches are scanned on every push by secrets.yml.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/secret-scan.sh

  # Static analysis with Semgrep: the community security rules at a pinned
  # commit of semgrep/semgrep-rules, and this codebase's rules
  # (.semgrep/vaubaan.yml, tested first). Semgrep runs from its image pinned by
  # digest; no account, no registry rules fetched at run time
  # (scripts/sast.sh). A finding fails the job: fix it, or suppress it on its
  # line with the reason.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: 9bbf021d0acffa3095fcffd17b2bc7787eb4796d # develop, 2026-10-08
          path: .semgrep-rules
          persist-credentials: false
      - run: |
          docker run --rm --network none -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            scripts/sast.sh /src/.semgrep-rules

  # Browser tests against an ephemeral instance (apps/gateway/tests/e2e/v5):
  # the built app on the real composition root with the `:memory:` store, a
  # simulated identity provider and a mocked provider. No credential, no
  # network beyond the browser download. Includes the cutover smoke
  # (docs/tests/e2e-tests.md).
  #
  # e2e and docker do not wait for `check`: they start with it, so the run
  # lasts as long as its longest job, not the sum of three.
  #
  # The browser is cached by Playwright version. Its system libraries are not
  # installed: the runner image ships Google Chrome, and with it everything
  # Chromium needs. The build skips its tsc pass (`check` type-checks).
  e2e:
    needs: scope
    if: github.event_name != 'schedule' && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install chromium
      - run: npm run test:e2e:v5
        env:
          VAUBAAN_BUILD_TYPECHECKED: '1'
      # The Vitest suites that need the build (`.next/standalone`, the demo
      # server): `test` does not build, so they are skipped there and run here.
      - run: >-
          npx vitest run --project shared --no-isolate
          apps/gateway/tests/integration/standalone-
          apps/gateway/tests/integration/demo/
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-v5-results
          path: test-results/v5
          retention-days: 7
          if-no-files-found: ignore

  # Builds the single gateway image (deploy/docker/Dockerfile) and runs the
  # container smoke test: incomplete configuration exits naming the key, a
  # complete one serves /healthz, native addons load, process is non-root.
  # Publishing to a registry is the release pipeline's job (release.yml).
  #
  # Then scans the image with Trivy (scripts/image-scan.sh): a HIGH or CRITICAL
  # vulnerability with a fixed version, in the Debian packages or in the npm
  # packages the image ships, fails the job. The vulnerability database is
  # cached for a day.
  docker:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The commit /healthz reports, written as `git archive` writes it
      # (ADR deployed-commit-stamped-by-git-archive); no build argument.
      - name: Stamp the commit
        run: scripts/stamp-commit.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: vaubaan-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: deploy/docker/smoke.sh vaubaan-gateway:ci
      - name: Day of the vulnerability database
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - name: Image scan
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: scripts/image-scan.sh vaubaan-gateway:ci
