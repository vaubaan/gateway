name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# .npmrc reads NPM_READ_TOKEN for @sbw-vaubaan GH Packages.
# Vercel has a dedicated NPM_READ_TOKEN secret (read:packages scope).
# CI reuses NPM_PUBLISH_TOKEN (same PAT, broader scope) under that name.
permissions:
  contents: read

env:
  NPM_READ_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
