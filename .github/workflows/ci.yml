name: ci

on:
  push:
    branches: [main, v5]
  pull_request:
    branches: [main, v5]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# @sbw-vaubaan/harness is an optionalDependency served from a private registry;
# npm skips it when NPM_READ_TOKEN is absent (see CONTRIBUTING.md).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
        env:
          SKIP_LIVE: '1'
