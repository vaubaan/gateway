name: ci

on:
  push:
    branches: [main, v5]
  pull_request:
    branches: [main, v5]
  workflow_dispatch:
  # The release pipeline (release.yml) calls this workflow as its gates, so a
  # release passes exactly what a pull request passes.
  workflow_call:

# `github.workflow` is the caller's name when this file is called by
# release.yml: a release of a ref never cancels, nor is cancelled by, the CI
# run of the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# @sbw-vaubaan/harness is an optionalDependency served from a private registry;
# npm skips it when NPM_READ_TOKEN is absent (see CONTRIBUTING.md).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test

  # Dependency audit: `npm audit --omit=dev` against the reviewed allowlist
  # (.github/audit-allowlist.json). Fails on an advisory that is not allowlisted
  # or whose review date has passed; a registry that does not answer after the
  # retries is a warning, never a failure (scripts/audit-gate.mjs). Reads the
  # lockfile only: nothing is installed, no install script runs.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-gate.mjs

  # Browser tests against an ephemeral instance (apps/gateway/tests/e2e/v5):
  # the built app on the real composition root with the `:memory:` store, a
  # simulated identity provider and a mocked provider. No credential, no
  # network beyond the browser download. Includes the cutover smoke
  # (docs/tests/e2e-tests.md).
  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:v5
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-v5-results
          path: test-results/v5
          retention-days: 7
          if-no-files-found: ignore

  # Builds the single gateway image (deploy/docker/Dockerfile) and runs the
  # container smoke test: incomplete configuration exits naming the key, a
  # complete one serves /healthz, native addons load, process is non-root.
  # Publishing to a registry is the release pipeline's job (release.yml).
  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: vaubaan-gateway:ci
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: deploy/docker/smoke.sh vaubaan-gateway:ci
