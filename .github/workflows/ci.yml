name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# .npmrc uses NPM_READ_TOKEN (read:packages scope) for @sbw-vaubaan GH Packages.
# NPM_PUBLISH_TOKEN kept for reference; NPM_READ_TOKEN is the one .npmrc reads.
# PAT used because the org plan disables cross-repo GITHUB_TOKEN reads on packages.
permissions:
  contents: read

env:
  NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
  NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
