name: ci

# Billed minutes are the budget of this file (docs/workflow/coding-workflow.md).
# GitHub bills every job rounded up to the next minute, so the code checks run
# as one job, in series, cheapest first, instead of ten parallel jobs of a few
# seconds each; and the expensive runs happen when they buy something:
#
#   pull request (ready)   job `audit`: every gate but the browser
#   pull request (draft)   nothing: a draft is work in progress
#   label `e2e` on a PR    job `e2e` too (the browser tests), on demand
#   push to main / v5      nothing: a squash merge of a pull request that was
#                          up to date is the tree that pull request checked
#   schedule (weekly)      everything: `audit`, `e2e`, `docker` with its scan
#   release (workflow_call)
#   manual run             everything
on:
  pull_request:
    branches: [main, v5]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
  # Weekly, the whole file on the default branch: the browser tests, the image
  # and its scan, and what a new advisory or a new rule finds in an unchanged
  # tree. GitHub runs schedules from the default branch only.
  schedule:
    - cron: '23 5 * * 1'
  # The release pipeline (release.yml) calls this workflow as its gates, so a
  # release passes everything, browser tests included.
  workflow_call:

# `github.workflow` is the caller's name when this file is called by
# release.yml: a release of a ref never cancels, nor is cancelled by, the CI
# run of the same ref. Labelling a pull request `e2e` starts a run of its own
# group, so it does not cancel the run of the last push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'e2e' || 'gate' }}
  cancel-in-progress: true

# Dependencies are installed with `npm ci`: exactly the lockfile, or a failure.
#
# Actions are pinned by commit, as in release.yml: a tag can be moved, a commit
# cannot. The comment after each pin names the release it is.
permissions:
  contents: read

jobs:
  # Every gate of a pull request, in one job (one billed rounding, not ten).
  # Cheapest and most decisive first, so a failing run stops early:
  #
  #   scope        scripts/ci-scope.sh: `code=false` when only docs/** or *.md
  #                changed; a schedule, a manual run or a release checks all
  #   supply chain audit-gate (npm audit --omit=dev against the reviewed
  #                allowlist), lockfile-gate, actionlint on the workflows
  #   secrets      gitleaks over the whole history (scripts/secret-scan.sh)
  #   install      .github/actions/setup, then `npm audit signatures`
  #   code         type-check, format, website build, lint, every Vitest test
  #   docs only    format, and the tests that read documentation
  #   sast         Semgrep from its image pinned by digest (scripts/sast.sh)
  #
  # Named `audit` for continuity: scripts/audit-gate.test.mjs reads the
  # dependency audit from this job.
  audit:
    # Not on a draft, and not again when a pull request is only labelled.
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: scripts/ci-scope.sh "$BASE" HEAD | tee -a "$GITHUB_OUTPUT"
      # A change the browser can show, without the label that runs the browser
      # tests: said on the run, never a failure (the weekly run and the release
      # gates run them whatever).
      - if: >-
          github.event_name == 'pull_request' && steps.scope.outputs.surface == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'e2e')
        run: >-
          echo "::notice title=Browser tests not run::This pull request changes what the
          browser shows (a page, a component, a style, a browser test or a plugin).
          Add the label e2e to run the browser tests on it."

      # Supply chain: reads the lockfile only, nothing installed yet.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: node scripts/audit-gate.mjs
      # Every lockfile entry downloads from the npm registry, with a sha512
      # integrity, the package it names (scripts/lockfile-gate.mjs).
      - run: node scripts/lockfile-gate.mjs
      # The workflows themselves: syntax, expressions, and shellcheck on every
      # `run:` (actionlint, pinned by checksum; shellcheck is on the runner).
      - name: Workflows are valid
        run: |
          actionlint=$(scripts/fetch-tool.sh actionlint "${RUNNER_TEMP}/security-tools")
          "$actionlint" -color
      # Secret scan of the whole history with gitleaks, pinned by checksum
      # (reviewed exceptions in .gitleaks.toml). Work branches are scanned on
      # every push by secrets.yml.
      - run: scripts/secret-scan.sh

      - uses: ./.github/actions/setup
      # Every installed package carries the registry's signature, and those
      # that publish a provenance attestation have a valid one.
      - run: npm audit signatures
      # Incremental: the tsc build info, the Prettier cache and, on a pull
      # request, the ESLint cache of an earlier run are restored (results,
      # never a verdict: a file whose content changed is checked again).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/tsconfig.tsbuildinfo
            !node_modules/**
            .cache/prettier
          key: check-cache-${{ github.sha }}
          restore-keys: check-cache-

      # Code.
      - if: steps.scope.outputs.code == 'true'
        run: npm run type-check
      - run: npm run format:check
      # Docs: the harness linters (schema, links, tracks, generated files fresh).
      # The site's generated copy under apps/website/public is ignored (package.json).
      - run: npx vaubaan-harness lint
      # The gateway is built by `e2e` (and by `docker`, in the image).
      - if: steps.scope.outputs.code == 'true'
        run: npm run build --workspace @vaubaan/website
        env:
          VAUBAAN_BUILD_TYPECHECKED: '1'
      # ESLint's blind spot: a file whose content did not change is not linted
      # again when a type it imports changed. A pull request restores the
      # cache; the weekly run, a manual run and a release lint every file.
      - if: steps.scope.outputs.code == 'true' && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/eslint
          key: eslint-cache-${{ github.sha }}
          restore-keys: eslint-cache-
      - if: steps.scope.outputs.code == 'true'
        run: npm run lint
      - if: steps.scope.outputs.code == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/eslint
          key: eslint-cache-${{ github.sha }}
      # Vitest: the `shared` project without isolation, then `isolated`
      # (npm run test). The suites that need the build run in `e2e`.
      - if: steps.scope.outputs.code == 'true'
        run: npx vitest run --project shared --no-isolate
      - if: steps.scope.outputs.code == 'true'
        run: npx vitest run --project isolated

      # Documentation only: the tests that read documentation (the structural
      # index against the spec, the key table of the configuration handbook,
      # …): every test file naming `docs/` or a `.md` file.
      - if: steps.scope.outputs.code == 'false'
        name: Tests that read documentation
        run: |
          mapfile -t files < <(git ls-files '*.test.ts' '*.test.tsx' '*.test.mjs' |
            xargs grep -lE "docs/|\.md['\"\`]")
          npx vitest run --project shared --no-isolate "${files[@]}"

      # Static analysis with Semgrep: the community security rules at a pinned
      # commit of semgrep/semgrep-rules, and this codebase's rules
      # (.semgrep/vaubaan.yml, tested first). No account, no registry rules
      # fetched at run time. A finding fails the job: fix it, or suppress it on
      # its line with the reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: 9bbf021d0acffa3095fcffd17b2bc7787eb4796d # develop, 2026-10-08
          path: .semgrep-rules
          persist-credentials: false
      - name: Static analysis
        run: |
          docker run --rm --network none -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            scripts/sast.sh /src/.semgrep-rules

  # Browser tests against an ephemeral instance (apps/gateway/tests/e2e/v5):
  # the built app on the real composition root with the `:memory:` store, a
  # simulated identity provider and a mocked provider. No credential, no
  # network beyond the browser download. Includes the cutover smoke
  # (docs/tests/e2e-tests.md). About five billed minutes.
  #
  # Weekly, on a manual run and in the release gates (a release cannot pass
  # without them); on a pull request only when it carries the label `e2e`
  # (put it on a change to the pages, the components, the styles, the mission
  # form or a plugin's catalog). Locally, `npm run test:e2e:v5`.
  #
  # The browser is cached by Playwright version. Its system libraries are not
  # installed: the runner image ships Google Chrome, and with it everything
  # Chromium needs. The build skips its tsc pass (`audit` type-checks).
  e2e:
    needs: audit
    # `audit` is skipped when the run only answers the label: then `e2e` runs
    # alone, on the head the pull request's last run checked.
    if: >-
      !cancelled() &&
      (needs.audit.result == 'success' ||
        (github.event.action == 'labeled' && github.event.label.name == 'e2e' &&
          needs.audit.result == 'skipped')) &&
      (github.event_name != 'pull_request' ||
        (!github.event.pull_request.draft &&
          contains(github.event.pull_request.labels.*.name, 'e2e')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install chromium
      - run: npm run test:e2e:v5
        env:
          VAUBAAN_BUILD_TYPECHECKED: '1'
      # The Vitest suites that need the build (`.next/standalone`, the demo
      # server): `audit` does not build the gateway, so they run here.
      - run: >-
          npx vitest run --project shared --no-isolate
          apps/gateway/tests/integration/standalone-
          apps/gateway/tests/integration/demo/
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-v5-results
          path: test-results/v5
          retention-days: 7
          if-no-files-found: ignore

  # Builds the single gateway image (deploy/docker/Dockerfile) and runs the
  # container smoke test: incomplete configuration exits naming the key, a
  # complete one serves /healthz, native addons load, process is non-root.
  # Publishing to a registry is the release pipeline's job (release.yml).
  #
  # Weekly and on a manual run of this workflow only: every release builds,
  # smoke-tests and scans its own image on each architecture (release.yml,
  # job `image`), so a pull request or a push does not build one.
  #
  # Then scans the image with Trivy (scripts/image-scan.sh): a HIGH or CRITICAL
  # vulnerability with a fixed version, in the Debian packages or in the npm
  # packages the image ships, fails the job. The vulnerability database is
  # cached for a day.
  docker:
    # `github.workflow` is the caller's name in a called run: the release
    # gates do not build this image a second time.
    if: >-
      github.workflow == 'ci' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The commit /healthz reports, written as `git archive` writes it
      # (docs/workflow/coding-workflow.md); no build argument.
      - name: Stamp the commit
        run: scripts/stamp-commit.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: vaubaan-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: deploy/docker/smoke.sh vaubaan-gateway:ci
      - name: Day of the vulnerability database
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - name: Image scan
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: scripts/image-scan.sh vaubaan-gateway:ci
