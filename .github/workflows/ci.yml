name: ci

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm -w @vauban/core run build
      - run: npm -w @vauban/eslint-plugin run build
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test
      - run: npm run test:arch
