name: desktop

# Builds the desktop app for macOS (ADR desktop-app-tauri-shell-over-the-node-standalone-server):
# the gateway's standalone output and the official Node binary of the image's version
# (apps/desktop/scripts/assemble.mjs), under the Tauri shell of apps/desktop/src-tauri.
#
#   push to main touching apps/desktop or this file, or a run by hand   one .dmg per
#   architecture, Vaubaan-<version>-<arm64|x64>.dmg, uploaded as an artifact.
#   called by release.yml at a tag v2.x.y   the same; release.yml attaches the .dmg
#   files to the GitHub release when they are signed (output `signed`).
#   With the Apple secrets set, every Mach-O is signed under the hardened runtime and
#   the app is notarized; without them the app is signed ad hoc (Gatekeeper warns), for
#   testing only, and never attached to a release.
#
# Before the upload, the built app is opened: it must answer /healthz on 127.0.0.1:3100,
# and stop its server when it is quit as a person quits it.
#
# Secrets (Settings > Secrets > Actions), all or none:
#   APPLE_CERTIFICATE           the "Developer ID Application" certificate, .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <name> (<team id>)"
#   APPLE_API_ISSUER            App Store Connect API: issuer id
#   APPLE_API_KEY               App Store Connect API: key id
#   APPLE_API_PRIVATE_KEY       App Store Connect API: the .p8 file's content
#
# Actions are pinned by commit; the comment gives the version. Bump both together.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  workflow_call:
    outputs:
      signed:
        description: "'true' when the .dmg files are signed and notarized"
        value: ${{ jobs.macos.outputs.signed }}
    secrets:
      APPLE_CERTIFICATE: { required: false }
      APPLE_CERTIFICATE_PASSWORD: { required: false }
      APPLE_SIGNING_IDENTITY: { required: false }
      APPLE_API_ISSUER: { required: false }
      APPLE_API_KEY: { required: false }
      APPLE_API_PRIVATE_KEY: { required: false }

# Called by release.yml, the run takes the caller's group: a release is never cancelled.
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'desktop' }}

permissions: {}

env:
  TAURI_CLI: '@tauri-apps/cli@2.12.4'

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The gateway's version (root package.json) names the .dmg; the bundle takes its
      # numeric core (2.0.0 for 2.0.0-alpha.31): macOS versions are numbers only.
      - name: Version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          case "${{ matrix.target }}" in aarch64-*) arch=arm64 ;; *) arch=x64 ;; esac
          {
            echo "version=$version"
            echo "core=${version%%-*}"
            echo "file=Vaubaan-$version-$arch.dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Build the gateway
        run: npm run build --workspace @vaubaan/gateway-app

      - name: Assemble the gateway and Node for ${{ matrix.target }}
        run: node apps/desktop/scripts/assemble.mjs --target ${{ matrix.target }}

      - name: Rust for ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Icons
        working-directory: apps/desktop/src-tauri
        run: npx --yes "$TAURI_CLI" icon ../../gateway/src/app/icon.svg --output icons

      - name: Signing keychain
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned build::The Apple secrets are not set: the .dmg is unsigned and Gatekeeper will warn."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '" ')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/api-key.p8"
          echo "api_key_path=$RUNNER_TEMP/api-key.p8" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Notarization refuses an app holding an unsigned Mach-O: the native addons in the
      # resources are signed here, the Node binary and the shell by the Tauri bundler.
      - name: Sign the native addons
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          find apps/desktop/src-tauri/resources -type f -name '*.node' -print0 |
            xargs -0 -n1 codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY"
          codesign --force --options runtime --timestamp \
            --entitlements apps/desktop/src-tauri/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" apps/desktop/src-tauri/binaries/node-${{ matrix.target }}

      - name: Build the app
        working-directory: apps/desktop/src-tauri
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
          CORE_VERSION: ${{ steps.version.outputs.core }}
          DMG: ${{ steps.version.outputs.file }}
        run: |
          # Signed and notarized with the secrets; otherwise signed ad hoc ("-"), which
          # Apple silicon requires to run any binary. The bundler notarizes only when it
          # sees the API variables, so they are set only for a signed build.
          if [ "$SIGNED" = "true" ]; then
            export APPLE_SIGNING_IDENTITY="$IDENTITY" APPLE_API_ISSUER="$API_ISSUER" \
              APPLE_API_KEY="$API_KEY" APPLE_API_KEY_PATH="$API_KEY_PATH"
          else
            export APPLE_SIGNING_IDENTITY="-"
          fi
          npx --yes "$TAURI_CLI" build --target ${{ matrix.target }} --bundles app,dmg \
            --config "{\"version\":\"$CORE_VERSION\"}"
          mkdir -p "$RUNNER_TEMP/dist"
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg "$RUNNER_TEMP/dist/$DMG"

      - name: Start the app, then quit it
        run: |
          app="$(find "$PWD/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)"
          open -n "$app"
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3100/healthz > "$RUNNER_TEMP/healthz.json"; then break; fi
            sleep 1
          done
          if ! grep -q '"status":"ok"' "$RUNNER_TEMP/healthz.json" 2>/dev/null; then
            echo "::error title=The app did not start its gateway::no /healthz on 127.0.0.1:3100 within 90 s"
            cat "$HOME/Library/Application Support/com.vaubaan.desktop/gateway.log" || true
            exit 1
          fi
          cat "$RUNNER_TEMP/healthz.json"; echo
          # As a person quits it (Cmd-Q): the shell stops its server on the way out.
          osascript -e 'tell application "Vaubaan" to quit'
          for _ in $(seq 1 20); do
            if ! curl -sf http://127.0.0.1:3100/healthz > /dev/null; then echo "stopped with the app"; exit 0; fi
            sleep 1
          done
          echo "::error title=The gateway outlived the app::/healthz still answers 20 s after the app quit"
          exit 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaubaan-desktop-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/${{ steps.version.outputs.file }}
          if-no-files-found: error
          retention-days: 14
