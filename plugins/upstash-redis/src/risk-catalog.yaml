# Risk catalog of the `upstash-redis` provider — one plane, two API layers.
#
# Spec : docs/spec/gateway-risk-model.md §4 (schema), §4.6 (macro-actions).
# Handbook : docs/handbook/providers/upstash-redis.md.
#
# Loaded by the plugin SDK at boot (`loadCatalogFile`) ; the loader refuses
# unknown keys, malformed ids, patterns of another provider, a missing
# fallback, a `presets` key, a live risk in no macro-action, a macro-action
# entry that is not a risk of this catalog, a non-numeric base budget.
#
# Two API layers, one data model :
#   - Management API (api.upstash.com/v2, Basic auth) : `account.database[*]`,
#     `database[D].stats`, `database[D].credentials` ;
#   - Data API (per-database REST endpoint, Bearer) : `database[D].key-space[K]`,
#     with the literal markers `.delete` (a command that removes keys, fields,
#     members or entries : DEL, UNLINK, EXPIRE with a TTL of 0, HDEL, LPOP…),
#     `.flush` (FLUSHDB / FLUSHALL) and `.execute` (scripts, administration,
#     and any command the classifier cannot read). The command table lives in
#     `classify.ts` ; the same command costs the same risk through the
#     dedicated tools and through the generic `execute` tool.
#
# Environments : the **database** is the resource the owner labels
# (`development`, `staging`, `prod`), so every write risk is env-scoped : a
# mission accepts `upstash-redis[staging].write-data`, never a bare
# `upstash-redis.write-data`. Reads stay account-scoped. `create-database`
# is account-rooted (the new database is not a resource yet) and stays
# account-scoped as well.
#
# The fallback `upstash-redis.uncategorized-write` counts only when no
# specific entry matched the write (policy-engine rule) ; no
# macro-action carries it. Seen in production, it means a tool classifies to a slice
# no fine-grained entry covers : add the entry.
#
# Adding a risk : append an entry, bump `catalog_version`, update `catalog_date`.
# Removing or renaming a risk : forbidden — mark it `deprecated: true` and
# point `replaced_by` at its successor.
#
# Risk count : 10 named risks + 1 fallback.

# catalog_version 7 (2026-10-30) : macro-actions, each entry with its base
# budget (ADR macro-actions-and-trust-levels-prefill-the-policy). No risk,
# pattern or preset changed.
# catalog_version 8 (2026-10-31) : presets retired (same ADR) ; no risk,
# pattern or macro-action changed.
provider: upstash-redis
catalog_version: 8
catalog_date: 2026-10-31

risks:
  # ─── READS ─────────────────────────────────────────────────────────────

  - id: upstash-redis.read-database-metadata
    label: 'Read database list / details / stats (Management API reads)'
    reason: >-
      Inventory of databases, their configuration, endpoints, and usage
      statistics. Surface of attack is negligible : metadata only, no
      data or credential leaks (`execute` strips the REST tokens from the
      Management API answers). This permission is the always-on baseline ; every
      read of the service needs it.
    matches: 'upstash-redis.[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  - id: upstash-redis.read-data
    label: 'Read Redis data (GET, KEYS, SCAN, HGETALL, LRANGE, SMEMBERS, TTL, DBSIZE)'
    reason: >-
      Read operations on the key-value data stored in a database. May
      expose application secrets if stored in Redis (session tokens,
      cached credentials). Standard posture for a coding agent in debug
      mode.
    matches: 'upstash-redis.database[**].key-space[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  # ─── WRITES — DATA ─────────────────────────────────────────────────────

  - id: upstash-redis.write-data
    label: 'Write Redis data (SET, HSET, LPUSH, SADD — without a time to live)'
    reason: >-
      Create, overwrite or modify individual keys, through the dedicated
      tools or the generic `execute` tool. An overwrite replaces the
      previous value, which is lost unless it is kept elsewhere ; a RENAME
      replaces the destination key. Affects application state if the app
      reads from Redis at runtime. The deletion commands (DEL, UNLINK, the
      POP and REM families), every command that sets a time to live
      (EXPIRE, SETEX, SET … EX) or moves data out of a key (RENAME, LMOVE,
      SMOVE), FLUSH and arbitrary commands need it next to their own, more
      severe permission, so a mission holding `write-data` alone cannot run
      them : it can write and overwrite values that stay, nothing else.
    matches: 'upstash-redis.database[**].key-space[**].W'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session
    acceptable_in_envs: [development, staging, prod]

  - id: upstash-redis.delete-data
    label: 'Delete keys, fields, members or entries — now, or by a time to live or a move (DEL, UNLINK, HDEL, LPOP, EXPIRE, SET … EX, RENAME)'
    reason: >-
      Targeted removal of data : whole keys (DEL, UNLINK, GETDEL), parts of
      a value (HDEL, LPOP, SREM, ZREM, XTRIM…), any time to live given to a
      key or a field (EXPIRE, PEXPIRE, SETEX, SET with EX or PX, the
      absolute expiries) — the data is gone when it elapses, and one second
      is a deletion in all but name —, and the moves (RENAME, LMOVE, SMOVE,
      RPOPLPUSH), which take a key or an element out of its source.
      Through the dedicated `del`, `expire` and `set` tools or the generic
      `execute` tool. Costly to reverse if the data is not backed up
      elsewhere. May break application state. A cache write with a time to
      live therefore needs this permission next to `write-data`.
    matches: 'upstash-redis.database[**].key-space[**].delete.W'
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session
    acceptable_in_envs: [development, staging, prod]

  - id: upstash-redis.flush-database
    label: 'FLUSHDB / FLUSHALL — mass data deletion via the execute tool'
    reason: >-
      FLUSHDB / FLUSHALL wipes all keys in the database. Irreversible
      without a backup. Only reachable via the generic `execute` tool
      (not exposed as a dedicated tool).
    matches: 'upstash-redis.database[**].key-space.flush.W'
    vector:
      reversibility: irreversible
      blast: account
      data: data
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [development, staging, prod]

  - id: upstash-redis.execute-arbitrary
    label: 'Generic execute — scripts, administration and any uncategorized Redis command'
    reason: >-
      The `execute` tool can run any Redis command. A command that is not
      a known read, write, deletion or flush falls into this catch-all :
      scripts and functions (EVAL, FCALL), server administration (CONFIG,
      ACL), transaction control, and any command the gateway does not know
      or cannot read. A script can delete or flush the database, so
      holding this permission allows everything a Redis command can do.
    matches: 'upstash-redis.database[**].key-space[**].execute.W'
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: free
      visibility: internal
      persistence: session
    acceptable_in_envs: [development, staging, prod]

  # ─── WRITES — MANAGEMENT ───────────────────────────────────────────────

  - id: upstash-redis.create-database
    label: 'Create a new database (Management API)'
    reason: >-
      Creates a new Redis database in the Upstash account. Reversible
      (can delete it). May incur costs if the account has a paid plan.
      Account-rooted : the new database is not a mission resource yet.
    matches: 'upstash-redis.account.database.W'
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: moderate
      visibility: internal
      persistence: posture

  - id: upstash-redis.delete-database
    label: 'Delete an entire database (Management API)'
    reason: >-
      Permanently deletes a Redis database and all its data. Irreversible
      without a backup. Equivalent to dropping a production data store.
    matches: 'upstash-redis.account.database[**].delete.W'
    vector:
      reversibility: irreversible
      blast: account
      data: data
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [development, staging, prod]

  - id: upstash-redis.modify-database
    label: 'Rename database (Management API)'
    reason: >-
      Modifies database metadata (currently: rename). Rename can break
      any downstream reference that uses the old name. Classified as
      credentials touch because it affects the database identity.
    matches: 'upstash-redis.database[**].credentials.W'
    vector:
      reversibility: costly
      blast: single
      data: secret
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [development, staging, prod]

  - id: upstash-redis.read-stats
    label: 'Read usage statistics'
    reason: >-
      Read-only access to database usage statistics (commands processed,
      memory usage, throughput). No data or credential exposure.
    matches: 'upstash-redis.database[**].stats.R'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  # ─── FALLBACK (required) ───────────────────────────────────────────────

  - id: upstash-redis.uncategorized-write
    label: 'Uncategorized Upstash Redis write'
    reason: >-
      Catch-all for writes that have not been explicitly categorised. If
      observed in production, signals that a tool was added without a
      matching catalog entry — the mission creator must opt in explicitly (no
      implicit accept). In no macro-action.
    matches: 'upstash-redis.[**].W'
    fallback: true
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: free
      visibility: internal
      persistence: session
    acceptable_in_envs: [development, staging, prod]

# Macro-actions (ADR macro-actions-and-trust-levels-prefill-the-policy) : what a
# mission creator ticks, each at a trust cran. Every entry but the fallback
# belongs to exactly one, with its base budget (the cran multiplies it ×1,
# ×3, ×10). The gateway adds "Anything else", holding the fallback.
macro_actions:
  - id: peek
    label: 'Peek'
    description: 'Metadata, stats and values.'
    entries:
      - risk_id: upstash-redis.read-database-metadata
        quota: 2000
        rate_limit: { max: 120, window_seconds: 60 }
      - risk_id: upstash-redis.read-stats
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
      - risk_id: upstash-redis.read-data
        quota: 5000
        rate_limit: { max: 120, window_seconds: 60 }
  - id: write
    label: 'Write keys'
    description: 'Set keys.'
    entries:
      - risk_id: upstash-redis.write-data
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
  - id: delete
    label: 'Delete keys'
    description: 'Delete keys and flush the database.'
    entries:
      - risk_id: upstash-redis.delete-data
        quota: 100
        rate_limit: { max: 10, window_seconds: 60 }
      - risk_id: upstash-redis.flush-database
        quota: 5
        rate_limit: { max: 1, window_seconds: 60 }
  - id: manage
    label: 'Manage databases'
    description: 'Create, rename, delete, and arbitrary commands.'
    entries:
      - risk_id: upstash-redis.create-database
        quota: 10
        rate_limit: { max: 2, window_seconds: 60 }
      - risk_id: upstash-redis.modify-database
        quota: 5
        rate_limit: { max: 1, window_seconds: 60 }
      - risk_id: upstash-redis.delete-database
        quota: 2
        rate_limit: { max: 1, window_seconds: 60 }
      - risk_id: upstash-redis.execute-arbitrary
        quota: 50
        rate_limit: { max: 5, window_seconds: 60 }
