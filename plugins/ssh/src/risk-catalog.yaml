# SSH risk catalog — provider `ssh`.
#
# Spec    : docs/spec/gateway-risk-model.md §4.
# Source  : .vaubaan/research/providers/railway-ssh.md §2.4.
#
# Four risks + one fallback :
#   - ssh.exec-read                    — whitelisted reads
#   - ssh.exec-write                   — writes on any host (env-varied via vector_overrides)
#   - ssh.exec-read-secret-files       — co-touched on cat /etc/..., etc.
#   - ssh.uncategorized-write          — fallback catch-all
#
# CONVENTION — `acceptable_in_envs`
# ---------------------------------
# SSH's "env" segment is the `host_slug` of the binding (one host = one env).
# `acceptable_in_envs` lists every known host slug the manager may accept
# this risk for. The canonical slugs are `staging-vps`, `dev-vps`, and
# `prod-vps`.
#
# PER-ENV RISK PROFILE — `vector_overrides`
# ------------------------------------------
# `ssh.exec-write` carries a default vector (non-prod profile) and
# `vector_overrides` for env slugs whose risk profile differs. The
# runtime resolves the effective vector via `resolveVector(entry, env)`.
# Cf. docs/spec/risk-entry-per-env-vector.md §1.
#
# MULTI-SLICE — secret-file co-touch
# -----------------------------------
# The classifier (`risk-classifier.ts`) emits TWO slices when the cmd
# matches "looks like reading a secret file" heuristics
# (`cat /etc/...`, `cat ~/.ssh/...`, `stat /root/...`, ...) :
#   1. `ssh.host[<slug>].command.R`              (touches `ssh.exec-read`)
#   2. `ssh.host[<slug>].command.R`              (also touches `ssh.exec-read-secret-files`)
# Both risks must be accepted for the call to pass — forcing the manager
# to explicitly consent to potential credential-file exfiltration via the
# `cat` whitelist hole.

ssh:
  risks:
    - id: ssh.exec-read
      label: 'Exécuter une commande shell read-only whitelist'
      reason: >
        Commandes en lecture seule reconnues par la whitelist regex
        (`journalctl`, `cat`, `ls`, `tail`, `head`, `grep`, `ps`,
        `docker ps/inspect/logs`, `systemctl status`, `df`, `free`,
        `uptime`, `ss -tlnp`, `md5sum`, `stat`). Pas de mutation.
      matches: 'ssh.host[**].command.R'
      vector:
        reversibility: reversible
        blast: env
        data: data
        cost: free
        visibility: internal
        persistence: stateless

    - id: ssh.exec-write
      label: 'Exécuter une commande shell arbitraire'
      reason: >
        Toute commande hors-whitelist read → traitée W. Inclut sudo,
        install, rm, systemctl restart, docker run, etc. Sur un host
        non-prod (`staging-vps`, `dev-vps`) le risque est acceptable
        avec confirmation explicite du manager (reversal coûteux mais
        blast limité). Sur un host de production (`prod-vps`) la surface
        d'attaque est maximale : posture-shift potentiel, downtime
        possible, coût non borné. Le vector_overrides prod-vps reflète
        cette escalation.
      matches: 'ssh.host[**].command.W'
      vector:
        reversibility: costly
        blast: env
        data: data
        cost: moderate
        visibility: internal
        persistence: posture
      vector_overrides:
        prod-vps:
          reversibility: irreversible
          data: secret
          cost: unbounded
      acceptable_in_envs:
        - staging-vps
        - dev-vps
        - prod-vps

    - id: ssh.exec-read-secret-files
      label: 'Lire un fichier potentiellement sensible (cat /etc/..., stat key)'
      reason: >
        La whitelist autorise `cat <path>` sans filtrer le path — donc
        `cat /etc/shadow`, `cat ~/.ssh/id_rsa`, `cat /root/.env` passent
        en R. Risque d'exfiltration des credentials hôte. Co-touché par
        le classifier en plus de `ssh.exec-read` quand le cmd ressemble
        à un read sensible — force le manager à consentir explicitement.
      matches: 'ssh.host[**].command.R'
      vector:
        reversibility: reversible
        blast: env
        data: secret
        cost: free
        visibility: internal
        persistence: stateless

    - id: ssh.uncategorized-write
      label: 'Écriture SSH non catégorisée'
      reason: >
        Catch-all pour les writes qui n'ont pas été explicitement
        catégorisés (toute slice W non couverte par exec-write).
        Sert de filet pour les futurs tools (ex.
        `ssh__sftp_put`) — en pratique jamais touché tant que `ssh__exec`
        est le seul tool exposé.
      matches: 'ssh.**.W'
      vector:
        reversibility: costly
        blast: env
        data: data
        cost: moderate
        visibility: internal
        persistence: session
