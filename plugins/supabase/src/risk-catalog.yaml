# Risk catalog of the `supabase` provider — four planes under one project.
#
# Spec : docs/spec/gateway-risk-model.md §4 (schema), docs/spec/vaubaan-gateway.md §3.2 (presets).
# Handbook : docs/handbook/providers/supabase.md.
#
# Loaded by the plugin SDK at boot (`loadCatalogFile`) ; the loader refuses
# unknown keys, malformed ids, patterns of another provider, a missing
# fallback, zero presets, a preset entry that is not an explicit risk of this
# catalog, a deprecated risk in a preset, a non-numeric budget.
#
# Cardinality convention (see classify.ts) :
#   row[one]    bounded write on one identified row ;
#   row[bulk]   unbounded write (UPDATE/DELETE without a bounded WHERE, TRUNCATE, COPY, mass INSERT) ;
#   object[one] / object[bulk] : idem for storage paths ;
#   user[one]   / user[bulk]   : idem for GoTrue users.
# The markers are literal identifiers, so `row[one]` and `row[bulk]` are
# mutually exclusive at match time.
#
# Environments : a Supabase project is the resource the owner labels (`staging`,
# `prod`, `preview`), so every write risk is env-scoped : a mission accepts
# `supabase[staging].migration-write`, never a bare `supabase.migration-write`.
# Bulk writes are structurally not grantable on prod (`acceptable_in_envs`
# excludes it). Reads stay account-scoped except `auth.read-users` (PII).
#
# The fallback `supabase.uncategorized-write` counts only when no specific
# entry matched the write (policy-engine rule, P1.2-SDK) ; presets never
# carry it. Seen in production, it means a tool classifies to a slice no
# fine-grained entry covers : add the entry.
#
# Adding a risk : append an entry, bump `catalog_version`, update `catalog_date`.
# Removing or renaming a risk : forbidden — mark it `deprecated: true` and
# point `replaced_by` at its successor.
#
# Risk count : 24 named risks + 1 fallback.

provider: supabase
catalog_version: 1
catalog_date: 2026-10-13

risks:
  # ───────────────────────────────────────────────────────────────────────
  # Plane `db`
  # ───────────────────────────────────────────────────────────────────────

  - id: supabase.read-data
    label: Read data and schema
    reason: >-
      SELECT and schema inspection, including `execute_sql`, which runs on
      the Management API read-only endpoint. Can leak PII through
      `auth.users` or application tables when the schema is not
      compartmented. Deliberately broad : every Supabase read fires it, and
      the more specific read risks (`auth.read-users`,
      `storage.signed-url-read`, `functions.read`) co-fire to harden the
      policy.
    matches: supabase.**.R
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  - id: supabase.row-write-one
    label: Write rows one by one (bounded target)
    reason: >-
      Targeted INSERT/UPDATE/DELETE (by id, bounded WHERE). Reversible by
      rewriting when the agent kept the previous value.
    matches: supabase.project[**].schema[**].table[**].row[one].W
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.bulk-row-write
    label: Bulk write on a table
    reason: >-
      Mass INSERT, UPDATE/DELETE without or with a wide WHERE, TRUNCATE,
      COPY. No automatic rollback, high blast. Structurally not grantable
      on prod.
    matches: supabase.project[**].schema[**].table[**].row[bulk].W
    vector:
      reversibility: costly
      blast: bulk
      data: data
      cost: moderate
      visibility: internal
      persistence: session
    acceptable_in_envs: [preview, staging]

  - id: supabase.migration-write
    label: Apply a migration (DDL)
    reason: >-
      CREATE/DROP/ALTER TABLE or INDEX. Costly to revert (manual down
      migration) and can break the applications that read the schema.
      Matches the schema/table-level write strictly (no row segment), so a
      row write never fires it by accident.
    matches: supabase.project[**].schema[*].table[*].W
    vector:
      reversibility: costly
      blast: env
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.policy-write
    label: Change RLS (CREATE/ALTER/DROP POLICY)
    reason: >-
      Critical posture shift : opens or closes data access for every role.
      One mistake is a public data leak.
    matches: supabase.project[**].policy[**].W
    vector:
      reversibility: costly
      blast: account
      data: data
      cost: free
      visibility: public
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.db-role-write
    label: Create or modify Postgres roles
    reason: >-
      Credential posture : CREATE ROLE, GRANT, REVOKE. No MCP tool today ;
      declared ahead so a future tool lands on an existing risk.
    matches: supabase.project[**].db-role[**].W
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.extension-write
    label: Enable or disable a Postgres extension
    reason: >-
      Shifts the available SQL surface. Some extensions (`pg_net`, `http`)
      open outbound exfiltration. No tool today ; declared ahead.
    matches: supabase.project[**].extension[**].W
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  # ───────────────────────────────────────────────────────────────────────
  # Plane `storage`
  # ───────────────────────────────────────────────────────────────────────

  - id: supabase.storage.object-read
    label: List or download storage objects
    reason: >-
      Reads user files, which may be PII (identity documents, photos,
      exports). Served through the service key regardless of bucket ACL.
    matches: supabase.project[**].bucket[**].object[**].R
    vector:
      reversibility: reversible
      blast: single
      data: pii
      cost: free
      visibility: internal
      persistence: stateless

  - id: supabase.storage.object-write-one
    label: Upload or delete one object
    reason: >-
      Mutation of one precise path. Reversible when the agent keeps a copy
      before overwriting.
    matches: supabase.project[**].bucket[**].object[one].W
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.storage.bulk-object-write
    label: Bulk upload or delete of objects
    reason: >-
      Prefix-wide or glob deletes, bucket cascade. Supabase Storage has no
      versioning by default : a bulk delete is irreversible. Structurally not
      grantable on prod.
    matches: supabase.project[**].bucket[**].object[bulk].W
    vector:
      reversibility: irreversible
      blast: bulk
      data: pii
      cost: moderate
      visibility: internal
      persistence: session
    acceptable_in_envs: [preview, staging]

  - id: supabase.storage.signed-url-read
    label: Issue a signed URL
    reason: >-
      A read on the bucket that may exfiltrate the object to an external
      recipient through a temporary signed URL. Distinct from a plain
      list/download : the recipient is chosen by the agent.
    matches: supabase.project[**].bucket[**].object[**].signed-url[**].R
    vector:
      reversibility: reversible
      blast: single
      data: pii
      cost: free
      visibility: public
      persistence: session

  - id: supabase.bucket-write
    label: Create, modify or delete a bucket
    reason: >-
      Posture shift : a public bucket leaks misclassified private objects ;
      a delete cascades irreversibly over the objects. Matches the
      bucket-level write strictly (no object segment).
    matches: supabase.project[**].bucket[*].W
    vector:
      reversibility: irreversible
      blast: env
      data: pii
      cost: free
      visibility: public
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.storage-config-write
    label: Change the project storage configuration
    reason: >-
      Quotas, transformations, CDN. Affects the whole project and every
      application consuming storage.
    matches: supabase.project[**].storage-config.W
    vector:
      reversibility: reversible
      blast: env
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  # ───────────────────────────────────────────────────────────────────────
  # Plane `auth`
  # ───────────────────────────────────────────────────────────────────────

  - id: supabase.auth.read-users
    label: List or read users
    reason: >-
      PII : emails, providers, last sign-in, user metadata ; the volume can
      be large. Also covers direct SELECTs on `auth.users` through
      `execute_sql`.
    matches: supabase.project[**].user[**].R
    vector:
      reversibility: reversible
      blast: bulk
      data: pii
      cost: free
      visibility: internal
      persistence: stateless
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.auth.user-write-one
    label: Create, modify or delete one user
    reason: >-
      Affects one identity. Reversible (re-create) except delete, which
      cascades on the rows the user owns (FK ON DELETE CASCADE).
    matches: supabase.project[**].user[one].W
    vector:
      reversibility: costly
      blast: single
      data: pii
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.auth.bulk-user-write
    label: Bulk user manipulation
    reason: >-
      Mass creation or deletion. Risk of locking real users out.
      Structurally not grantable on prod.
    matches: supabase.project[**].user[bulk].W
    vector:
      reversibility: irreversible
      blast: bulk
      data: pii
      cost: moderate
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging]

  - id: supabase.auth.generate-link
    label: Generate a magic link, recovery or invite
    reason: >-
      The returned URL signs in as that user. If it leaks (logs, audit,
      wrong recipient), account takeover.
    matches: supabase.project[**].user[**].link[**].W
    vector:
      reversibility: reversible
      blast: single
      data: secret
      cost: free
      visibility: internal
      persistence: session
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.sso-provider-write
    label: Configure a SAML / OIDC identity provider
    reason: >-
      Federated identity posture. A wrong configuration lets anyone with an
      account on that IdP sign in.
    matches: supabase.project[**].sso-provider[**].W
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.third-party-auth-write
    label: Configure a third-party auth provider (Firebase, Auth0, …)
    reason: >-
      Same as SSO : identity posture, federates an external JWT issuer for
      authentication.
    matches: supabase.project[**].third-party-auth[**].W
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.auth-config-write
    label: Change the project auth configuration
    reason: >-
      JWT secret, expiries, redirect allow-list, signup policy. The smallest
      mistake opens or breaks authentication for everyone.
    matches: supabase.project[**].auth-config.W
    vector:
      reversibility: costly
      blast: account
      data: secret
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  # ───────────────────────────────────────────────────────────────────────
  # Plane `functions`
  # ───────────────────────────────────────────────────────────────────────

  - id: supabase.functions.read
    label: List or read Edge Functions (metadata and body)
    reason: >-
      The body may contain inline secrets when the author hard-coded a key
      (a frequent anti-pattern).
    matches: supabase.project[**].edge-function[**].R
    vector:
      reversibility: reversible
      blast: single
      data: secret
      cost: free
      visibility: internal
      persistence: stateless

  - id: supabase.functions.body-write
    label: Create, modify or delete the code of an Edge Function
    reason: >-
      Changing the code injects custom behaviour into every invocation.
      Reversible when the source is in git. Bounded to `edge-function[*]`
      strictly so child writes such as `function-deployment` do not fire it.
    matches: supabase.project[**].edge-function[*].W
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.functions.deploy
    label: Deploy a new version of an Edge Function
    reason: >-
      Switches the runtime to the new version. On prod, an immediate change
      of public behaviour.
    matches: supabase.project[**].edge-function[**].function-deployment[**].W
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: moderate
      visibility: public
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.function-secret-write
    label: Create, modify or delete a function secret
    reason: >-
      Secrets consumed by Edge Functions at runtime. A delete can break the
      function immediately ; a create or update can poison it.
    matches: supabase.project[**].function-secret[**].W
    vector:
      reversibility: costly
      blast: env
      data: secret
      cost: free
      visibility: internal
      persistence: posture
    acceptable_in_envs: [preview, staging, prod]

  # ───────────────────────────────────────────────────────────────────────
  # Fallback — must exist. Counts only when no specific entry matched.
  # ───────────────────────────────────────────────────────────────────────

  - id: supabase.uncategorized-write
    label: Uncategorized Supabase write
    reason: >-
      Catch-all for writes without a dedicated entry. A mission accepting it
      for an environment accepts every uncategorized write of the provider
      there ; the budget and the gate bound it. A tool firing only this risk
      is a catalog bug.
    matches: supabase.**.W
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: free
      visibility: internal
      persistence: session
    acceptable_in_envs: [preview, staging, prod]

# ─────────────────────────────────────────────────────────────────────────
# Presets — UI sugar : pre-fill a mission policy, the creator adjusts, the
# persisted policy is always the explicit enumeration (spec §3.2).
# Quotas are actions per mission period ; rate limits per sliding window.
# ─────────────────────────────────────────────────────────────────────────

presets:
  - id: read-only-analyst
    label: Read-only analyst
    description: Query data and schema, list buckets and objects, on every selected project. No write, no user PII listing.
    entries:
      - risk_id: supabase.read-data
        quota: 5000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: supabase.storage.object-read
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto

  - id: staging-developer
    label: Staging developer
    description: One token per code project. Reads everywhere ; every write only on staging-labelled projects, nothing on prod.
    entries:
      - risk_id: supabase.read-data
        quota: 10000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: supabase.storage.object-read
        quota: 2000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: supabase.functions.read
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].auth.read-users
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].bulk-row-write
        quota: 200
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].migration-write
        quota: 200
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].policy-write
        quota: 100
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].bucket-write
        quota: 50
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].storage.object-write-one
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].storage.bulk-object-write
        quota: 50
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].auth.user-write-one
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].auth.generate-link
        quota: 100
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].functions.body-write
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].functions.deploy
        quota: 200
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].function-secret-write
        quota: 50
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto

  - id: migration-operator
    label: Migration operator
    description: Apply schema migrations. Free on staging ; each prod migration or RLS change waits for approval. Bulk row writes stay staging-only.
    entries:
      - risk_id: supabase.read-data
        quota: 2000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].migration-write
        quota: 100
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].bulk-row-write
        quota: 50
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[staging].policy-write
        quota: 50
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: supabase[prod].migration-write
        quota: 20
        rate_limit: { max: 2, window_seconds: 60 }
        gate: approval
      - risk_id: supabase[prod].policy-write
        quota: 10
        rate_limit: { max: 2, window_seconds: 60 }
        gate: approval
