# Risk catalog of the `railway` service.
#
# Spec : docs/spec/gateway-risk-model.md §4 (schema), §4.6 (macro-actions).
# ADR  : docs/decisions/rewrap-official-mcps.md ; docs/decisions/plugin-contract-and-credential-spec.md.
# Handbook : docs/handbook/services/railway.md.
#
# Loaded by the plugin SDK at boot (`loadCatalogFile`) ; this file is the only
# catalog artefact. Rules the loader enforces : `service` is the plugin id,
# every risk id starts with it, every `matches` pattern parses as a slice of
# this service, a `railway.uncategorized-*` fallback exists, every other
# live risk in exactly one macro-action with a numeric base quota and rate
# limit — never a wildcard.
#
# Adding a risk : append an entry, bump `catalog_version`, update `catalog_date`.
# Changing a `matches` pattern : same bump (v3 repointed `bulk-variables-replace`).
# Removing or renaming a risk : forbidden — mark it `deprecated: true` and
# point `replaced_by` at its successor, so existing missions keep working.
#
# 9 risks + 1 fallback. Environments are the owner's labels on the Railway
# *project* resource (`prod`, `staging`, `preview`, `dev`), not Railway's own
# environment names : the classifier stamps the label of the project a call
# touches into the `environment[...]` segment of the slice.

# catalog_version 5 (2026-10-30) : macro-actions, each entry with its base
# budget (ADR macro-actions-and-trust-levels-prefill-the-policy). No risk,
# pattern or preset changed.
# catalog_version 6 (2026-10-31) : presets retired (same ADR) ; no risk,
# pattern or macro-action changed.
# catalog_version 7 (2026-11-05) : a narrative per macro-action (spec §4.6) ;
# no risk, pattern or macro-action changed.
# catalog_version 8 (2026-11-13) : the persistence axis is retired (spec §4.2) ;
# no risk, pattern or macro-action changed.
service: railway
catalog_version: 8
catalog_date: 2026-11-13

risks:
  # ───── Reads ────────────────────────────────────────────────────────────────
  - id: railway.read-account
    label: 'Read the account and the list of projects'
    reason: >-
      Account metadata only (`whoami`, `list-projects`). No secret is
      returned ; the blast radius is the whole workspace because the call is
      not scoped to a project.
    matches: 'railway.account[**].R'
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: internal
  - id: railway.read-runtime
    label: 'Read services, deployments and statuses'
    reason: >-
      Runtime metadata of a project (services, deployments, status). No
      secret payload. Broad by design : it co-matches every project-scoped
      read, so a more specific read permission (logs, variables) is required on
      top of it.
    matches: 'railway.project[**].R'
    vector:
      reversibility: reversible
      blast: env
      data: metadata
      cost: free
      visibility: internal
  - id: railway.read-logs
    label: 'Read the logs of a deployment'
    reason: >-
      Application logs often contain printed secrets (DSN, JWT, stack traces
      with PII). Classified `data` rather than `secret` because a well-run
      project does not log its secrets ; a strict creator leaves it out.
    matches: 'railway.project[**].environment[**].service[**].deployment[**].logs.R'
    vector:
      reversibility: reversible
      blast: env
      data: data
      cost: free
      visibility: internal
  - id: railway.read-variables
    label: 'Read environment variables (including secrets)'
    reason: >-
      Returns variable values in clear by default. The main exfiltration
      surface for production credentials, hence env-scoped : holding it on
      staging says nothing about prod.
    matches: 'railway.project[**].environment[**].service-var[**].R'
    acceptable_in_envs: [staging, preview, dev, prod]
    vector:
      reversibility: reversible
      blast: env
      data: secret
      cost: free
      visibility: internal
  # ───── Deploys ──────────────────────────────────────────────────────────────
  - id: railway.deploy
    label: 'Redeploy a service or accept staged changes (deploy)'
    reason: >-
      Reversible : a new deploy fixes a bad one, and Railway bills usage.
      On prod the deployed state is visible to customers until reverted,
      hence the per-env vector override.
    matches: 'railway.project[**].environment[**].service[**].deployment.W'
    acceptable_in_envs: [staging, preview, dev, prod]
    vector:
      reversibility: reversible
      blast: env
      data: data
      cost: moderate
      visibility: internal
    vector_overrides:
      prod:
        reversibility: costly
        visibility: public

  # ───── Variables ────────────────────────────────────────────────────────────
  - id: railway.upsert-variable
    label: 'Create, modify or delete an environment variable'
    reason: >-
      Scalar change of named variables (upsert or delete). Triggers an
      implicit redeploy unless `skipDeploys` is set. On prod a wrong value
      breaks the service immediately.
    matches: 'railway.project[**].environment[**].service-var[**].W'
    acceptable_in_envs: [staging, preview, dev, prod]
    vector:
      reversibility: reversible
      blast: env
      data: secret
      cost: moderate
      visibility: internal
    vector_overrides:
      prod:
        reversibility: costly

  - id: railway.bulk-variables-replace
    label: 'Replace every environment variable in bulk (replace=true)'
    reason: >-
      DESTRUCTIVE : every variable absent from the payload is deleted.
      Detected from `replace` set on `upsert-variables`, from an empty or
      malformed variable payload, and on every `railway-agent` call. Any
      environment, prod or not.
    # The classifier emits this marker slice for the replace case only : a
    # write of named variables touches `railway.upsert-variable` alone.
    matches: 'railway.project[**].environment[**].service-var-replace.W'
    vector:
      reversibility: irreversible
      blast: env
      data: secret
      cost: moderate
      visibility: internal
  # ───── Account ──────────────────────────────────────────────────────────────
  - id: railway.create-project
    label: 'Create a new Railway project'
    reason: >-
      Account-level write. Not reversible from the MCP surface (deleting a
      project needs the dashboard) and may generate unbounded cost.
    matches: 'railway.account[**].project.W'
    vector:
      reversibility: costly
      blast: account
      data: metadata
      cost: unbounded
      visibility: internal
  # ───── Agent (meta-tool) ────────────────────────────────────────────────────
  - id: railway.agent-action
    label: 'Invoke the Railway agent (conversational meta-tool)'
    reason: >-
      The upstream agent decides alone what to mutate ; no fine
      classification is possible. Catch-all by construction : the classifier
      also emits the deployment, variable write and variable replace slices,
      so a mission must hold those permissions too. Explicit opt-in only.
    matches: 'railway.account[**].agent-session.W'
    vector:
      reversibility: costly
      blast: account
      data: secret
      cost: unbounded
      visibility: internal
  # ───── Fallback — must exist ────────────────────────────────────────────────
  - id: railway.uncategorized-write
    label: 'Uncategorized Railway write'
    reason: >-
      Catch-all for writes without a dedicated entry. Seen in production, it
      means a tool classifies to a slice no fine-grained entry covers : add
      the entry.
    matches: 'railway.**.W'
    fallback: true
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: moderate
      visibility: internal
# Macro-actions (ADR macro-actions-and-trust-levels-prefill-the-policy) : what a
# mission creator ticks, each at a trust level. Every entry but the fallback
# belongs to exactly one, with its base budget (the trust level multiplies it ×1,
# ×3, ×10). The gateway adds "Anything else", holding the fallback.
macro_actions:
  - id: watch
    label: 'Watch'
    description: 'Projects, services, deployments and logs.'
    narrative: >-
      Following what runs: the workspace's projects, then the services, deployments, statuses
      and logs of the mission's projects. Nothing is changed. Logs are a permission of their own
      because applications print secrets and personal data into them more often than they
      should.
    entries:
      - risk_id: railway.read-account
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
      - risk_id: railway.read-runtime
        quota: 2000
        rate_limit: { max: 120, window_seconds: 60 }
      - risk_id: railway.read-logs
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
  - id: deploy
    label: 'Deploy'
    description: 'Redeploy and apply staged changes.'
    narrative: >-
      Redeploying a service or applying the changes staged on an environment. A bad deploy is
      undone by the next one, but on prod customers see it until then, so the permission is held
      per environment label.
    entries:
      - risk_id: railway.deploy
        quota: 20
        rate_limit: { max: 2, window_seconds: 60 }
  - id: configure
    label: 'Configure'
    description: 'Read and write variables.'
    narrative: >-
      Reading and writing the environment variables of a project, where its production
      credentials live. Each permission is held per environment, so holding staging says nothing
      about prod. Replacing every variable at once is kept apart because whatever the payload
      leaves out is deleted.
    entries:
      - risk_id: railway.read-variables
        quota: 50
        rate_limit: { max: 5, window_seconds: 60 }
      - risk_id: railway.upsert-variable
        quota: 20
        rate_limit: { max: 5, window_seconds: 60 }
      - risk_id: railway.bulk-variables-replace
        quota: 5
        rate_limit: { max: 1, window_seconds: 60 }
  - id: create
    label: 'Create'
    description: "Projects and Railway's agent."
    narrative: >-
      Creating a new Railway project and handing a free-text request to Railway's own agent. A
      project is created outside the mission's projects and can cost without limit. The agent
      decides alone what to change with the whole credential, so a mission must also hold the
      deploy and variable permissions it may use.
    entries:
      - risk_id: railway.create-project
        quota: 5
        rate_limit: { max: 1, window_seconds: 60 }
      - risk_id: railway.agent-action
        quota: 50
        rate_limit: { max: 10, window_seconds: 60 }
