# Railway — risk catalog (v4 risk-based model)
#
# Source of truth : .vaubaan/research/providers/railway-ssh.md §1.4.
# Spec           : docs/spec/gateway-risk-model.md §4.
#
# This YAML is the human-readable canonical form for catalog review. The
# runtime imports `risk-catalog.ts` (1:1 with this file). When editing,
# update BOTH. A CI lint (Phase 2) will diff the two.
#
# 9 risks + 1 fallback. Coverage matrix : research §1.5.

railway:
  risks:
    # ───── Reads ────────────────────────────────────────────────────────────
    - id: railway.read-account
      label: 'Lire compte & liste de projets'
      reason: >-
        Lecture metadata account. Aucun secret.
      matches: 'railway.account[**].R'
      vector:
        {
          reversibility: reversible,
          blast: account,
          data: metadata,
          cost: free,
          visibility: internal,
          persistence: stateless,
        }

    - id: railway.read-runtime
      label: 'Lire services, déploiements, statuts'
      reason: >-
        Lecture metadata runtime — pas de payload secret.
      matches: 'railway.project[**].R'
      vector:
        {
          reversibility: reversible,
          blast: env,
          data: metadata,
          cost: free,
          visibility: internal,
          persistence: stateless,
        }

    - id: railway.read-logs
      label: "Lire les logs d'un déploiement"
      reason: >-
        Logs peuvent contenir des secrets imprimés par l'app (DSN, JWT
        loggés, stack-traces). À traiter comme `data` sensible côté audit.
      matches: 'railway.project[**].environment[**].service[**].deployment[**].logs.R'
      vector:
        {
          reversibility: reversible,
          blast: env,
          data: data,
          cost: free,
          visibility: internal,
          persistence: stateless,
        }

    - id: railway.read-variables
      label: 'Lire les env vars (incluant secrets)'
      reason: >-
        Retourne les valeurs en clair par défaut. C'est la principale
        surface d'exfiltration des credentials prod.
      matches: 'railway.project[**].environment[**].service-var[**].R'
      vector:
        {
          reversibility: reversible,
          blast: env,
          data: secret,
          cost: free,
          visibility: internal,
          persistence: stateless,
        }

    # ───── Deploys ──────────────────────────────────────────────────────────
    - id: railway.deploy
      label: 'Redeploy / accept-deploy'
      reason: >-
        Reversible : un nouveau deploy peut tout corriger. Pas de
        communication aval. Coût Railway facturé à l'usage.
      matches: 'railway.project[**].environment[**].service[**].deployment.W'
      acceptable_in_envs: [staging, preview, dev, prod]
      vector:
        {
          reversibility: reversible,
          blast: env,
          data: data,
          cost: moderate,
          visibility: internal,
          persistence: session,
        }
      vector_overrides:
        prod:
          reversibility: costly
          visibility: public

    # ───── Variables ────────────────────────────────────────────────────────
    - id: railway.upsert-variable
      label: 'Modifier une env var'
      reason: >-
        Modif scalaire d'une var. Trigge un redeploy implicite sauf
        skipDeploys=true. Sur prod, une valeur erronée peut briser
        immédiatement le service.
      matches: 'railway.project[**].environment[**].service-var[**].W'
      acceptable_in_envs: [staging, preview, dev, prod]
      vector:
        {
          reversibility: reversible,
          blast: env,
          data: secret,
          cost: moderate,
          visibility: internal,
          persistence: posture,
        }
      vector_overrides:
        prod:
          reversibility: costly

    - id: railway.bulk-variables-replace
      label: 'Remplacer en bulk toutes les env vars (replace=true)'
      reason: >-
        DESTRUCTIF : toute var absente du payload est supprimée. Détecté via
        `replace:true` côté upsert-variables. Tout env, prod ou pas.
      matches: 'railway.project[**].environment[**].service-var[*].W'
      vector:
        {
          reversibility: irreversible,
          blast: env,
          data: secret,
          cost: moderate,
          visibility: internal,
          persistence: posture,
        }

    # ───── Account ──────────────────────────────────────────────────────────
    - id: railway.create-project
      label: 'Créer un nouveau projet Railway'
      reason: >-
        Account-level write. Pas réversible automatiquement (delete-project
        requiert UI). Peut générer du coût.
      matches: 'railway.account[**].project.W'
      vector:
        {
          reversibility: costly,
          blast: account,
          data: metadata,
          cost: unbounded,
          visibility: internal,
          persistence: posture,
        }

    # ───── Agent (méta-tool) ────────────────────────────────────────────────
    - id: railway.agent-action
      label: 'Invocation railway-agent (méta-tool conversationnel)'
      reason: >-
        L'agent upstream peut décider seul quoi muter — pas de
        classification fine possible. Catch-all par construction. Tout
        usage doit être audité humain (opt-in explicite obligatoire).
      matches: 'railway.account[**].agent-session.W'
      vector:
        {
          reversibility: costly,
          blast: account,
          data: secret,
          cost: unbounded,
          visibility: internal,
          persistence: posture,
        }

    # ───── Fallback ─────────────────────────────────────────────────────────
    - id: railway.uncategorized-write
      label: 'Écriture Railway non catégorisée'
      reason: >-
        Catch-all. Si vu en prod, signale qu'une entrée manque au catalogue.
      matches: 'railway.**.W'
      vector:
        {
          reversibility: costly,
          blast: env,
          data: data,
          cost: moderate,
          visibility: internal,
          persistence: session,
        }
