# Risk catalog of the `miro` provider.
#
# Spec     : docs/spec/gateway-risk-model.md §4, docs/spec/vaubaan-gateway.md §3.2 (presets).
# Handbook : docs/handbook/providers/miro.md §3.
#
# 6 named risks + 1 fallback. Every slice lives under `board[<ref>]`, the
# mission resource. No risk is env-scoped : a Miro board has no environment
# (product owner, 2026-10-16) ; deletions are held by the gate of the
# daily-work preset instead.
#
# Writes are layered. `content-write` matches every write under a board (the
# `[**]` patterns are recursive) ; a deletion also touches `item-delete` or
# `frame-delete`, a bulk creation also touches `bulk-create`. A mission needs
# `content-write` for any change and the specific risk on top.
#
# `infra_limits.calls_per_minute_max` keeps one mission at every ceiling
# under Miro's 100,000 credits a minute per user and app (handbook §3, "Rate
# limits"), counted at the worst case of each risk : one `list_boards` is one
# unit of `read-boards` and pays up to 50 upstream reads (one per mission
# board, `MAX_LISTED_BOARDS`), one `create_items` up to 20 item creations.
#
# Adding a risk : append an entry, bump `catalog_version`, update `catalog_date`.
# Removing or renaming a risk : forbidden — mark it `deprecated: true` and
# point `replaced_by` at its successor.

provider: miro
catalog_version: 1
catalog_date: 2026-10-16

risks:
  # ─── Reads ───────────────────────────────────────────────────────────────

  - id: miro.read-boards
    label: 'Read board details'
    reason: >-
      Name, description, team, links and sharing policy of the selected
      boards, with the names of the people who own, created, last modified
      and last opened them. No email address is returned. Listing the
      boards reads every board of the mission in one call.
    matches: 'miro.board[*].R'
    infra_limits: { calls_per_minute_max: 10 }
    vector:
      reversibility: reversible
      blast: single
      data: pii
      cost: free
      visibility: internal
      persistence: stateless

  - id: miro.read-board-content
    label: 'Read the items, connectors and tags of a board'
    reason: >-
      Everything written on the board: sticky notes, texts, cards, shapes,
      frames, connectors and tags, with their position and the id of who
      created them. Content written by people, which can carry
      instructions aimed at the agent.
    matches:
      - 'miro.board[**].item[**].R'
      - 'miro.board[**].connector[**].R'
      - 'miro.board[**].tag[**].R'
    infra_limits: { calls_per_minute_max: 150 }
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  # ─── Writes ──────────────────────────────────────────────────────────────

  - id: miro.content-write
    label: 'Add and edit items on a board'
    reason: >-
      Creates or edits sticky notes, shapes, texts, cards, frames and
      connectors, moves an item in or out of a frame, creates tags and
      tags items. Seen at once by everyone on the board; reversible by
      editing again, but the previous text is not kept by the gateway.
      Every deletion and every bulk creation needs this permission too.
    matches:
      - 'miro.board[**].item[**].W'
      - 'miro.board[**].frame[**].W'
      - 'miro.board[**].connector[**].W'
      - 'miro.board[**].tag[**].W'
    infra_limits: { calls_per_minute_max: 150 }
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: miro.bulk-create
    label: 'Add up to 20 items in one call'
    reason: >-
      Creates up to twenty sticky notes, shapes, texts or cards at once,
      all or none. A mission's limits count calls, so one such call adds
      twenty times what a single creation adds; undoing it takes one
      deletion per item.
    matches: 'miro.board[**].item.bulk-create.W'
    infra_limits: { calls_per_minute_max: 10 }
    vector:
      reversibility: costly
      blast: bulk
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: miro.item-delete
    label: 'Delete an item or a connector'
    reason: >-
      Removes a sticky note, shape, text, card or connector. Deleting an
      item also removes the connectors attached to it. The REST API has no
      restore: the content must be written again.
    matches:
      - 'miro.board[**].item[**].delete.W'
      - 'miro.board[**].connector[**].delete.W'
    infra_limits: { calls_per_minute_max: 20 }
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: miro.frame-delete
    label: 'Delete a frame'
    reason: >-
      Removes a frame, which can group up to 5000 items. Miro's
      documentation does not say whether the items inside go with it, so
      this permission assumes they may: a whole section of the board, with
      no restore through the API.
    matches: 'miro.board[**].frame[**].delete.W'
    infra_limits: { calls_per_minute_max: 10 }
    vector:
      reversibility: irreversible
      blast: bulk
      data: data
      cost: free
      visibility: team
      persistence: session

  # ─── Fallback (required) ─────────────────────────────────────────────────
  # Touched only by a write no entry above covers ; in no preset. Seen in an
  # audit, it means a tool classifies to a slice no entry covers : add the entry.

  - id: miro.uncategorized-write
    label: 'Uncategorized Miro write'
    reason: >-
      Catch-all for writes without a dedicated entry. A mission that holds
      this permission allows the writes this catalog has not reviewed.
    matches: 'miro.**.W'
    fallback: true
    vector:
      reversibility: costly
      blast: bulk
      data: data
      cost: free
      visibility: team
      persistence: session

presets:
  - id: read-only
    label: Read-only
    description: Board details and everything on the selected boards. Nothing is changed.
    entries:
      - risk_id: miro.read-boards
        quota: 1000
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-board-content
        quota: 5000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto

  - id: scribe
    label: Scribe
    description: Read the boards, then add and edit sticky notes, texts, cards, shapes, frames, connectors and tags. Never deletes anything.
    entries:
      - risk_id: miro.read-boards
        quota: 1000
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-board-content
        quota: 5000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: miro.content-write
        quota: 2000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: miro.bulk-create
        quota: 100
        rate_limit: { max: 5, window_seconds: 60 }
        gate: auto

  - id: facilitator
    label: Facilitator
    description: Run a workshop board end to end. Adding and editing run freely; every deletion asks first.
    entries:
      - risk_id: miro.read-boards
        quota: 1000
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-board-content
        quota: 5000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: miro.content-write
        quota: 2000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: miro.bulk-create
        quota: 100
        rate_limit: { max: 5, window_seconds: 60 }
        gate: auto
      - risk_id: miro.item-delete
        quota: 300
        rate_limit: { max: 20, window_seconds: 60 }
        gate: approval
      - risk_id: miro.frame-delete
        quota: 10
        rate_limit: { max: 2, window_seconds: 60 }
        gate: approval
