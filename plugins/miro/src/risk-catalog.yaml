# Risk catalog of the `miro` provider.
#
# Spec     : docs/spec/gateway-risk-model.md §4, docs/spec/vaubaan-gateway.md §3.2 (presets).
# Handbook : docs/handbook/providers/miro.md.
#
# 13 named risks + 1 fallback. Every slice of a tool that names a board lives
# under `board[<ref>]`, the mission resource ; a new board (`board.W`) and
# Miro's format guides (`format-guide.R`) name none. No risk is env-scoped :
# a Miro board has no environment (product owner, 2026-10-16) ; deletions are
# held by the gate of the facilitator preset instead.
#
# Writes are layered. `content-write` matches every write under a board (the
# `[**]` patterns are recursive) ; a deletion also touches `item-delete` or
# `frame-delete`, a creation of many items at once also touches
# `bulk-create`. A mission needs `content-write` for any change and the
# specific risk on top. An update of the canvas (`canvas_update_from_svg`)
# may delete what the new document no longer holds : it touches both
# deletion risks on every call.
#
# Catalog 2 (2026-10-21) : the plugin rewraps Miro's official MCP server
# (docs/handbook/providers/miro.md). The six risks of catalog 1 keep
# their ids and their meaning ; their reasons name the new tools, and
# `read-board-content` / `content-write` now cover comments. Two risks are
# added : `board-create`, `read-format-guide`.
#
# Catalog 3 (2026-10-23) : the tool list captured from a real Miro account.
# Every id of catalog 2 is kept with its meaning. Five risks are added for the
# board's own details and its sharing, never covered by `content-write` (its
# patterns name the board's content only) :
#   - `read-board-details`  — the space a board is in (`board[<ref>].metadata.R`) ;
#   - `read-board-access`   — who can open a board, with emails (`…access.R`) ;
#   - `board-details-write` — a board's title, description, icon (`…metadata.W`) ;
#   - `board-share`         — granting or changing access (`…access.W`) : the
#     board's whole content goes to whoever is named, an exfiltration path ;
#   - `boardcast-create`    — a narrated walkthrough (`…boardcast.W`).
#
# `infra_limits.calls_per_minute_max` stays under the rate limits Miro
# applies to its MCP server per user (⚠ the figures are not published ;
# handbook).
#
# Adding a risk : append an entry, bump `catalog_version`, update `catalog_date`.
# Removing or renaming a risk : forbidden — mark it `deprecated: true` and
# point `replaced_by` at its successor.

provider: miro
catalog_version: 3
catalog_date: 2026-10-23

risks:
  # ─── Reads ───────────────────────────────────────────────────────────────

  - id: miro.read-boards
    label: 'List the boards of the mission'
    reason: >-
      Ref, name and link of each board of the mission. Answered by the
      gateway from what it discovered: no board outside the mission is
      named, and nothing is read at Miro.
    matches: 'miro.board[*].R'
    infra_limits: { calls_per_minute_max: 10 }
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  - id: miro.read-board-content
    label: 'Read what is on a board'
    reason: >-
      Everything drawn on the selected boards (sticky notes, texts, shapes,
      documents, tables, diagrams, images, prototype screens) and their
      comments, with who wrote them. Content written by people, which can
      carry instructions aimed at the agent.
    matches:
      - 'miro.board[**].item[**].R'
      - 'miro.board[**].connector[**].R'
      - 'miro.board[**].tag[**].R'
      - 'miro.board[**].comment[**].R'
    infra_limits: { calls_per_minute_max: 120 }
    vector:
      reversibility: reversible
      blast: single
      data: pii
      cost: free
      visibility: internal
      persistence: stateless

  - id: miro.read-format-guide
    label: "Read Miro's format guides"
    reason: >-
      The specifications of the SVG and typed formats the canvas tools read
      and write, as Miro serves them. Miro's documentation: nothing of the
      company's.
    matches: 'miro.format-guide.R'
    infra_limits: { calls_per_minute_max: 30 }
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  - id: miro.read-board-details
    label: "Read a board's details"
    reason: >-
      Which space of the team a board of the mission is in. Metadata
      only: nothing drawn on the board.
    matches: 'miro.board[*].metadata.R'
    infra_limits: { calls_per_minute_max: 30 }
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  - id: miro.read-board-access
    label: 'See who can open a board'
    reason: >-
      The people and groups that can open a board of the mission, the role
      each holds and, for people, their email address. A list of
      colleagues' names and emails the agent did not have before.
    matches: 'miro.board[*].access.R'
    infra_limits: { calls_per_minute_max: 30 }
    vector:
      reversibility: reversible
      blast: single
      data: pii
      cost: free
      visibility: internal
      persistence: stateless

  # ─── Writes ──────────────────────────────────────────────────────────────

  - id: miro.content-write
    label: 'Add and edit content on a board'
    reason: >-
      Adds items (from SVG, images, tables, prototypes), edits tables and
      what is drawn, and writes, answers and resolves comments. Seen at once
      by everyone on the board; reversible by editing again, but the
      previous content is not kept by the gateway. Every deletion and every
      creation of many items at once needs this permission too.
    matches:
      - 'miro.board[**].item[**].W'
      - 'miro.board[**].frame[**].W'
      - 'miro.board[**].connector[**].W'
      - 'miro.board[**].tag[**].W'
      - 'miro.board[**].comment[**].W'
    infra_limits: { calls_per_minute_max: 60 }
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: miro.bulk-create
    label: 'Add many items in one call'
    reason: >-
      Creates as many items as one SVG document or one prototype holds, in
      a single call. A mission's limits count calls, so one such call can
      add far more than a single item; undoing it takes one deletion per
      item.
    matches: 'miro.board[**].item.bulk-create.W'
    infra_limits: { calls_per_minute_max: 10 }
    vector:
      reversibility: costly
      blast: bulk
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: miro.item-delete
    label: 'Delete items'
    reason: >-
      Removes items from a board. An update of the canvas deletes whatever
      the new SVG document no longer holds, so every such update needs this
      permission. Miro's MCP server has no restore: the content must be
      written again.
    matches:
      - 'miro.board[**].item[**].delete.W'
      - 'miro.board[**].connector[**].delete.W'
    infra_limits: { calls_per_minute_max: 20 }
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: miro.frame-delete
    label: 'Delete frames'
    reason: >-
      Removes a frame, which can group thousands of items, possibly with
      what it holds: a whole section of the board, with no restore through
      the MCP server. An update of the canvas may do so, so every such
      update needs this permission.
    matches: 'miro.board[**].frame[**].delete.W'
    infra_limits: { calls_per_minute_max: 20 }
    vector:
      reversibility: irreversible
      blast: bulk
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: miro.board-create
    label: 'Create a board'
    reason: >-
      Creates a new board in the team chosen at connection. It becomes a
      resource of the account at once and is reached by the missions
      issued on the whole account. The board stays at Miro until someone
      deletes it there.
    matches: 'miro.board.W'
    infra_limits: { calls_per_minute_max: 5 }
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: miro.board-details-write
    label: 'Rename a board'
    reason: >-
      Changes the title, the description or the icon of a board of the
      mission. Seen by everyone who can open it, and in the team's board
      list; reversible by changing them again, but the previous values are
      not kept by the gateway.
    matches: 'miro.board[*].metadata.W'
    infra_limits: { calls_per_minute_max: 10 }
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: team
      persistence: session

  - id: miro.board-share
    label: 'Share a board, or change who can open it'
    reason: >-
      Grants a person (by email or user id) or a group a role on a board of
      the mission, from viewer to owner, or changes the role they hold.
      Whoever is named can then read everything on the board and, depending
      on the role, change it, share it further or take it over; the person
      may be outside the company where Miro's sharing settings allow it.
      Access can be taken back at Miro, what was read cannot.
    matches: 'miro.board[*].access.W'
    infra_limits: { calls_per_minute_max: 5 }
    vector:
      reversibility: irreversible
      blast: single
      data: pii
      cost: free
      visibility: public
      persistence: posture

  # ⚠ Whether a boardcast draws on the plan's Miro AI credits (its voice is
  # generated by Miro) is not documented : `cost` assumes it may.
  - id: miro.boardcast-create
    label: 'Record a narrated walkthrough'
    reason: >-
      Creates a boardcast on a board of the mission: a replayable
      walkthrough whose narration Miro speaks with a generated voice, from
      the text the agent writes, and a playback link. Seen by everyone who
      can open the board; removed at Miro only.
    matches: 'miro.board[*].boardcast.W'
    infra_limits: { calls_per_minute_max: 5 }
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: moderate
      visibility: team
      persistence: session

  # ─── Fallback (required) ─────────────────────────────────────────────────
  # Touched only by a write no entry above covers ; in no preset. Seen in an
  # audit, it means a tool classifies to a slice no entry covers : add the entry.

  - id: miro.uncategorized-write
    label: 'Uncategorized Miro write'
    reason: >-
      Catch-all for writes without a dedicated entry. A mission that holds
      this permission allows the writes this catalog has not reviewed.
    matches: 'miro.**.W'
    fallback: true
    vector:
      reversibility: costly
      blast: bulk
      data: data
      cost: free
      visibility: team
      persistence: session

presets:
  - id: read-only
    label: Read-only
    description: Read everything on the selected boards, their comments and which space they are in. Nothing is changed, and who can open a board is not read.
    entries:
      - risk_id: miro.read-boards
        quota: 1000
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-board-content
        quota: 5000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-format-guide
        quota: 500
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-board-details
        quota: 500
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto

  - id: scribe
    label: Scribe
    description: Read the boards, then add content, fill tables and write comments. Never deletes anything, so it cannot update what is already drawn (an update may delete).
    entries:
      - risk_id: miro.read-boards
        quota: 1000
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-board-content
        quota: 5000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-format-guide
        quota: 500
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-board-details
        quota: 500
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: miro.content-write
        quota: 2000
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: miro.bulk-create
        quota: 100
        rate_limit: { max: 5, window_seconds: 60 }
        gate: auto

  - id: facilitator
    label: Facilitator
    description: Run a workshop board end to end. Adding content, renaming the board, recording a walkthrough and seeing who can open it run freely; every update of what is drawn, which may delete, every new board and every change of who can open a board ask first.
    entries:
      - risk_id: miro.read-boards
        quota: 1000
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-board-content
        quota: 5000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-format-guide
        quota: 500
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: miro.read-board-details
        quota: 500
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: miro.content-write
        quota: 2000
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: miro.bulk-create
        quota: 100
        rate_limit: { max: 5, window_seconds: 60 }
        gate: auto
      - risk_id: miro.item-delete
        quota: 300
        rate_limit: { max: 20, window_seconds: 60 }
        gate: approval
      - risk_id: miro.frame-delete
        quota: 50
        rate_limit: { max: 5, window_seconds: 60 }
        gate: approval
      - risk_id: miro.board-create
        quota: 10
        rate_limit: { max: 2, window_seconds: 60 }
        gate: approval
      - risk_id: miro.read-board-access
        quota: 200
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: miro.board-details-write
        quota: 50
        rate_limit: { max: 5, window_seconds: 60 }
        gate: auto
      - risk_id: miro.boardcast-create
        quota: 20
        rate_limit: { max: 2, window_seconds: 60 }
        gate: auto
      - risk_id: miro.board-share
        quota: 20
        rate_limit: { max: 2, window_seconds: 60 }
        gate: approval
