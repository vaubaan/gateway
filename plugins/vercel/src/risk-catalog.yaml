# Risk catalog of the `vercel` provider.
#
# Spec     : docs/spec/gateway-risk-model.md §4 (schema), §4.6 (macro-actions).
# Handbook : docs/handbook/providers/vercel.md.
#
# Loaded at boot by `@vaubaan/plugin-sdk` (`loadCatalogFile`) ; this file is
# the only catalog artefact.
#
# 16 named risks + 1 fallback. Env-specific pairs of the provider research
# (deploy-preview / deploy-prod, env-var-write-preview / env-var-write-prod)
# are single entries with `acceptable_in_envs` and a `vector_overrides.prod`
# block ; the runtime qualifies them per environment (`vercel[prod].deploy`).
# The Vercel environment is the closed triad prod | preview | development and
# lives in the call arguments (`target`), which the classifier turns into the
# `env[<label>]` segment of the slice.
#
# Rules the loader enforces : every id starts with `vercel.` ; every pattern
# parses as a slice of this provider ; the `vercel.uncategorized-*` fallback
# exists ; every other live risk sits in exactly one macro-action with a
# numeric base quota and rate limit.
#
# Adding a risk : append an entry, bump `catalog_version`, update `catalog_date`.
# Removing or renaming a risk : forbidden — mark it `deprecated: true` and
# point `replaced_by` at its successor, so existing missions keep working.

# catalog_version 4 (2026-10-30) : macro-actions, each entry with its base
# budget (ADR macro-actions-and-trust-levels-prefill-the-policy). No risk,
# pattern or preset changed.
# catalog_version 5 (2026-10-31) : presets retired (same ADR) ; no risk,
# pattern or macro-action changed.
provider: vercel
catalog_version: 5
catalog_date: 2026-10-31

risks:
  # ─── READS ─────────────────────────────────────────────────────────────

  - id: vercel.read-account
    label: 'Read account / team / project metadata'
    reason: >-
      Inventory of teams, projects, deployments, build/runtime logs, env-var
      keys (encrypted), domains, toolbar threads. Surface of attack is
      negligible : metadata only, no plaintext secret leaks. This permission is
      the always-on baseline that every other read assumes.
    matches: 'vercel.[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  - id: vercel.read-deployment
    label: 'Read deployments + build/runtime logs'
    reason: >-
      Runtime logs can carry app data (PII if the app logs by accident,
      OWASP LLM01 surface via tokens injected into logs). Standard posture
      for a coding agent in debug mode but still distinct from pure
      metadata read.
    matches: 'vercel.project[**].deployment[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  - id: vercel.read-env-var
    label: 'Read env vars (encrypted values only)'
    reason: >-
      Listing of env-var keys with values returned encrypted by Vercel.
      No direct secret exfiltration possible. Discriminates from the
      plaintext variant which is the higher-severity write.
    matches: 'vercel.project[**].env-var[*].R'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  - id: vercel.read-env-var-plaintext
    label: 'Read env vars in plaintext (`decrypt=true`)'
    reason: >-
      `list_env_vars` with `decrypt=true` returns Stripe keys, DB URLs,
      JWT signing secrets etc. in the clear. Equivalent to a full
      credentials compromise on the project. Distinct risk class from
      the encrypted read.
    matches: 'vercel.project[**].env-var[*].plaintext.R'
    vector:
      reversibility: reversible
      blast: account
      data: secret
      cost: free
      visibility: internal
      persistence: stateless

  - id: vercel.fetch-deployment-url
    label: 'HTTP fetch to a Vercel deployment URL'
    reason: >-
      `web_fetch_vercel_url` makes an outbound HTTP request against a
      deployment URL. Logs an access on the target side, may consume
      bandwidth. Not a major security risk but worth a dedicated permission for
      audit-log granularity.
    matches: 'vercel.project[**].deployment[**].fetch.R'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: public
      persistence: stateless

  # ─── WRITES — DEPLOYMENT-PROTECTION BYPASS (credential mint) ───────────

  - id: vercel.mint-bypass-token
    label: 'Mint a deployment-protection bypass token'
    reason: >-
      Credential creation. The token bypasses SSO / Password Gate on a
      single deployment URL with a short TTL. Exposing the URL out-of-band
      bypasses the project deployment-protection.
    matches: 'vercel.project[**].deployment[**].bypass-token.W'
    vector:
      reversibility: reversible
      blast: single
      data: secret
      cost: free
      visibility: internal
      persistence: session

  # ─── WRITES — DEPLOYMENT ───────────────────────────────────────────────

  - id: vercel.deploy
    label: 'Trigger a deployment'
    reason: >-
      Preview / development builds have no prod impact and are reversible.
      Production deploys are public and costly to roll back (prod alias
      re-pointed, CDN cache invalidated). The vector_overrides for prod
      reflect the higher blast and visibility.
    matches:
      - 'vercel.project[**].env[preview,development].deployment.W'
      - 'vercel.project[**].env[prod].deployment.W'
    acceptable_in_envs: [preview, development, prod]
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: moderate
      visibility: team
      persistence: session
    vector_overrides:
      prod:
        reversibility: costly
        blast: env
        visibility: public

  # ─── WRITES — TOOLBAR (low-risk feedback comments) ─────────────────────

  - id: vercel.toolbar-write
    label: 'Write / edit / react on toolbar threads'
    reason: >-
      UI comment surface on deployment previews. Visible to the team only,
      reversible via delete/edit, zero effect on build / runtime / routing.
      Semantically a mutate but the risk is minimal.
    matches: 'vercel.project[**].deployment[**].toolbar-thread[**].W'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: team
      persistence: session

  # ─── WRITES — ENV VARS (secrets) ───────────────────────────────────────

  - id: vercel.env-var-write
    label: 'Write / update / delete env vars'
    reason: >-
      Affects future builds on the targeted env. The stored value is a
      secret on the Vercel side. On prod a bad value breaks the service
      at the next deploy ; an attacker-injected value exfiltrates traffic
      or takes over the app. The vector_overrides for prod reflect the
      costly reversibility.
    matches:
      - 'vercel.project[**].env[preview,development].env-var[**].W'
      - 'vercel.project[**].env[prod].env-var[**].W'
    acceptable_in_envs: [preview, development, prod]
    vector:
      reversibility: reversible
      blast: env
      data: secret
      cost: moderate
      visibility: internal
      persistence: posture
    vector_overrides:
      prod:
        reversibility: costly

  - id: vercel.env-var-fan-out
    label: 'Write env var on every env in one call (prod included)'
    reason: >-
      `upsert_env_var target=['production','preview','development']` (or
      target omitted = all 3 by Vercel default), and `delete_env_var`
      (whose upstream API removes the var from every env it lives in
      regardless of the Vaubaan hint), touch all 3 envs in a single tool
      call. Treated as its own permission so the agent who only holds
      `env-var-write` on preview does NOT silently escalate to prod.
    matches: 'vercel.project[**].env-var-fan-out.W'
    vector:
      reversibility: costly
      blast: bulk
      data: secret
      cost: free
      visibility: internal
      persistence: posture

  # ─── WRITES — PROJECT SETTINGS (build pipeline) ────────────────────────

  - id: vercel.project-settings-write
    label: 'Update project settings (framework, build cmd, node version, root dir)'
    reason: >-
      Modifies the build pipeline for *every* future deployment of all 3
      envs. A bad install / build command breaks preview AND prod at the
      next push. Posture-shift on the CI chain.
    matches: 'vercel.project[**].project-settings.W'
    vector:
      reversibility: costly
      blast: account
      data: metadata
      cost: free
      visibility: internal
      persistence: posture

  # ─── READS — FIREWALL (WAF config inspection) ──────────────────────────

  - id: vercel.firewall-read
    label: 'Read firewall / WAF configuration'
    reason: >-
      Exposes the full WAF posture of a project : custom rules, IP
      blocking entries, managed rulesets, OWASP CRS settings, and the
      firewallEnabled toggle. Metadata-only (no mutations), but reveals
      the security policy surface — an attacker who sees the rules can
      craft bypasses.
    matches: 'vercel.project[**].firewall.R'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  # ─── WRITES — FIREWALL (WAF toggle + rules + IP blocking) ─────────────

  - id: vercel.firewall-write
    label: 'Toggle the project firewall on/off'
    reason: >-
      Flipping the WAF off exposes the project to all unfiltered
      traffic. Flipping it on may block legitimate visitors if rules
      are misconfigured. Posture-shift affecting production traffic
      immediately.
    matches: 'vercel.project[**].firewall.W'
    vector:
      reversibility: reversible
      blast: env
      data: metadata
      cost: free
      visibility: public
      persistence: posture

  - id: vercel.firewall-rule-write
    label: 'Create / update / remove a custom firewall rule'
    reason: >-
      A bad rule can silently expose production to attacks (too
      permissive) or block legitimate traffic (too restrictive).
      Each rule is project-scoped and applies to all deployments.
      Posture-shift with public-facing impact on every request.
    matches: 'vercel.project[**].firewall.firewall-rule[**].W'
    vector:
      reversibility: reversible
      blast: env
      data: metadata
      cost: free
      visibility: public
      persistence: posture

  - id: vercel.ip-rule-write
    label: 'Add / remove an IP blocking rule'
    reason: >-
      IP rules directly control which source IPs can reach the
      project. A wrong deny blocks paying customers ; a wrong bypass
      lets an attacker in. Immediate public-facing posture-shift.
    matches: 'vercel.project[**].firewall.ip-rule[**].W'
    vector:
      reversibility: reversible
      blast: env
      data: metadata
      cost: free
      visibility: public
      persistence: posture

  # ─── WRITES — DOMAINS (external DNS posture shift) ──────────────────────

  - id: vercel.domain-write
    label: 'Attach / verify / detach a custom domain'
    reason: >-
      External DNS coupling. Attach → public routing (can hijack traffic
      from a domain the org controls). Detach → breaks the public service
      if the domain is prod. Verify is idempotent but folded into the same
      risk for UX simplicity.
    matches: 'vercel.project[**].domain[**].W'
    vector:
      reversibility: costly
      blast: account
      data: metadata
      cost: free
      visibility: public
      persistence: posture

  # ─── FALLBACK (required) ───────────────────────────────────────────────

  - id: vercel.uncategorized-write
    label: 'Uncategorized Vercel write'
    reason: >-
      Catch-all for writes that have not been explicitly categorised. If
      observed in production, signals that a tool was added without a
      matching catalog entry — the mission creator must opt in explicitly (no
      implicit accept).
    matches: 'vercel.[**].W'
    fallback: true
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: free
      visibility: internal
      persistence: session

# Macro-actions (ADR macro-actions-and-trust-levels-prefill-the-policy) : what a
# mission creator ticks, each at a trust level. Every entry but the fallback
# belongs to exactly one, with its base budget (the trust level multiplies it ×1,
# ×3, ×10). The gateway adds "Anything else", holding the fallback.
macro_actions:
  - id: watch
    label: 'Watch'
    description: 'Projects, deployments, encrypted environment keys and firewall.'
    entries:
      - risk_id: vercel.read-account
        quota: 2000
        rate_limit: { max: 120, window_seconds: 60 }
      - risk_id: vercel.read-deployment
        quota: 2000
        rate_limit: { max: 120, window_seconds: 60 }
      - risk_id: vercel.read-env-var
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
      - risk_id: vercel.firewall-read
        quota: 200
        rate_limit: { max: 30, window_seconds: 60 }
  - id: deploy
    label: 'Deploy and review'
    description: 'Deploy, open a preview and comment.'
    entries:
      - risk_id: vercel.deploy
        quota: 50
        rate_limit: { max: 5, window_seconds: 60 }
      - risk_id: vercel.fetch-deployment-url
        quota: 300
        rate_limit: { max: 30, window_seconds: 60 }
      - risk_id: vercel.mint-bypass-token
        quota: 50
        rate_limit: { max: 5, window_seconds: 60 }
      - risk_id: vercel.toolbar-write
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
  - id: configure
    label: 'Configure'
    description: 'Environment variables, in clear and in writing.'
    entries:
      - risk_id: vercel.read-env-var-plaintext
        quota: 20
        rate_limit: { max: 5, window_seconds: 60 }
      - risk_id: vercel.env-var-write
        quota: 50
        rate_limit: { max: 5, window_seconds: 60 }
      - risk_id: vercel.env-var-fan-out
        quota: 50
        rate_limit: { max: 5, window_seconds: 60 }
  - id: protect
    label: 'Protect'
    description: 'Firewall and IP rules.'
    entries:
      - risk_id: vercel.firewall-write
        quota: 20
        rate_limit: { max: 5, window_seconds: 60 }
      - risk_id: vercel.firewall-rule-write
        quota: 50
        rate_limit: { max: 10, window_seconds: 60 }
      - risk_id: vercel.ip-rule-write
        quota: 100
        rate_limit: { max: 20, window_seconds: 60 }
  - id: own
    label: 'Own'
    description: 'Project settings and domains.'
    entries:
      - risk_id: vercel.project-settings-write
        quota: 50
        rate_limit: { max: 5, window_seconds: 60 }
      - risk_id: vercel.domain-write
        quota: 20
        rate_limit: { max: 5, window_seconds: 60 }
