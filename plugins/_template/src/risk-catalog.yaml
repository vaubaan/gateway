# Risk catalog of the `template` provider.
#
# Spec : docs/spec/gateway-risk-model.md §4 (schema), docs/spec/vaubaan-gateway.md §3.2 (presets).
#
# Rules the loader enforces at boot :
#   - `provider` is the plugin id ; every risk id starts with it ;
#   - every `matches` pattern parses as a slice of this provider ;
#   - exactly one `<provider>.uncategorized-*` fallback exists, flagged `fallback: true` ;
#   - at least one preset ; every preset entry names a risk of THIS catalog,
#     with an explicit quota, rate limit and gate — never a wildcard.
#
# Adding a risk : append an entry, bump `catalog_version`, update `catalog_date`.
# Removing or renaming a risk : forbidden — mark it `deprecated: true` and
# point `replaced_by` at its successor, so existing missions keep working.

provider: template
catalog_version: 1
catalog_date: 2026-10-13

risks:
  - id: template.read-widgets
    label: 'Read widgets'
    reason: >-
      Reads expose widget contents to the agent. Contents are attacker-
      influenced upstream (OWASP LLM01) ; nothing is modified.
    matches:
      - 'template.workspace[**].widget[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  - id: template.widget-write
    label: 'Create or modify a widget'
    reason: >-
      Reversible on staging ; on prod the change is visible to customers
      until reverted, hence the per-env vector override.
    matches: 'template.workspace[**].widget[**].W'
    acceptable_in_envs: [staging, prod]
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: team
      persistence: session
    vector_overrides:
      prod:
        reversibility: costly
        visibility: public

  # A destructive operation gets its own entry through a verb leaf of the
  # data model (`delete`). The pattern of `widget-write` above, `widget[**].W`,
  # also matches a deletion : a slice may touch several risks, and the mission
  # must then have accepted every one of them. A deletion therefore needs
  # `widget-write` and `widget-delete`.
  - id: template.widget-delete
    label: 'Delete a widget'
    reason: >-
      A deleted widget cannot be restored. Kept apart from other writes so a
      mission can modify widgets without being able to remove them.
    matches: 'template.workspace[**].widget[**].delete.W'
    acceptable_in_envs: [staging, prod]
    vector:
      reversibility: irreversible
      blast: single
      data: data
      cost: free
      visibility: team
      persistence: session
    vector_overrides:
      prod:
        visibility: public

  # Fallback — must exist, exactly once. It is touched only by writes no
  # other entry covers, so a preset should not include it. Seen in
  # production, it means a tool classifies to a slice no fine-grained entry
  # covers : add the entry.
  - id: template.uncategorized-write
    label: 'Uncategorized write'
    reason: >-
      Catch-all for writes without a dedicated entry. A mission creator
      who includes it allows the writes this catalog has not reviewed.
    matches: 'template.**.W'
    fallback: true
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: moderate
      visibility: internal
      persistence: session

presets:
  - id: reader
    label: Reader
    description: Read every widget of the selected workspaces, no write.
    entries:
      - risk_id: template.read-widgets
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto

  - id: developer
    label: Developer
    description: Read everywhere; write and delete on staging freely, on prod asking first.
    entries:
      - risk_id: template.read-widgets
        quota: 5000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: template[staging].widget-write
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: template[prod].widget-write
        quota: 20
        rate_limit: { max: 5, window_seconds: 60 }
        gate: approval
      # Deleting on staging : both risks are `auto`. Deleting on prod : one
      # gated risk is enough for the whole call to wait for an approval.
      - risk_id: template[staging].widget-delete
        quota: 50
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: template[prod].widget-delete
        quota: 5
        rate_limit: { max: 2, window_seconds: 60 }
        gate: approval
