# Risk catalog of the `context7` service.
#
# Spec     : docs/spec/gateway-risk-model.md §4 (schema), §4.6 (macro-actions).
# Handbook : docs/handbook/services/context7.md.
#
# Rules the loader enforces at boot :
#   - `service` is the plugin id ; every risk id starts with it ;
#   - every `matches` pattern parses as a slice of this service ;
#   - exactly one `<service>.uncategorized-*` fallback exists, flagged `fallback: true` ;
#   - every risk but the fallback in exactly one macro-action, with an
#     explicit base budget (quota and rate limit) — never a wildcard, no gate.
#
# Adding a risk : append an entry, bump `catalog_version`, update `catalog_date`.
# Removing or renaming a risk : forbidden — mark it `deprecated: true` and
# point `replaced_by` at its successor, so existing missions keep working.
#
# 1 risk + 1 fallback. Both tools are the same act : send the agent's
# question to Context7 and read documentation back. The vector is what a
# documentation read is : nothing at the service changes, one library, its
# contents, within the plan's quota, seen by the company. The question leaving
# the company is said in the reason and the narrative. No environment : Context7 has
# none, no risk is env-scoped. No `infra_limits` : Context7 publishes no rate
# figure, and a 429 is a service failure.

# catalog_version 2 (2026-10-30) : macro-actions, each entry with its base
# budget (ADR macro-actions-and-trust-levels-prefill-the-policy). No risk,
# pattern or preset changed.
# catalog_version 3 (2026-10-31) : presets retired (same ADR) ; no risk,
# pattern or macro-action changed.
# catalog_version 4 (2026-11-05) : a narrative per macro-action (spec §4.6) ;
# no risk, pattern or macro-action changed.
# catalog_version 5 (2026-11-13) : the persistence axis is retired (spec §4.2) ;
# no pattern or macro-action changed. One vector corrected : `query-docs` was
# filed as irreversible (the question cannot be recalled), which put a
# documentation read in the row "Cannot be repaired" ; it is now the vector of
# a read (reversible, single, data, free, internal).
service: context7
catalog_version: 5
catalog_date: 2026-11-13

risks:
  - id: context7.query-docs
    label: 'Ask Context7 about library documentation'
    reason: >-
      The question the agent writes, which may carry code or internal
      context, is sent to Context7, a third party that stores queries; the
      documentation that comes back is third-party text. Each call also
      spends the key's monthly Context7 quota.
    matches: 'context7.index[**].library[**].R'
    vector:
      reversibility: reversible # a read changes nothing at the service
      blast: single
      data: data #                documentation contents
      cost: free #                within the plan's monthly quota
      visibility: internal

  - id: context7.uncategorized-write
    label: 'Uncategorized write'
    reason: 'Catch-all for writes without a dedicated entry. No Context7 tool of this plugin writes.'
    matches: 'context7.**.W'
    fallback: true
    vector: { reversibility: costly, blast: account, data: data, cost: moderate, visibility: team }

# Macro-actions (ADR macro-actions-and-trust-levels-prefill-the-policy) : what a
# mission creator ticks, each at a trust level. Every entry but the fallback
# belongs to exactly one, with its base budget (the trust level multiplies it ×1,
# ×3, ×10). The gateway adds "Anything else", holding the fallback.
macro_actions:
  - id: ask
    label: 'Ask the docs'
    description: 'Ask Context7 about library documentation.'
    narrative: >-
      Finding a library and reading its documentation while the agent codes. Nothing is written
      anywhere, but the question leaves the company: Context7 stores the queries it receives,
      and a question may quote code or internal context. What comes back is third-party text,
      and every call spends the key's monthly Context7 quota.
    entries:
      - risk_id: context7.query-docs
        quota: 300
        rate_limit: { max: 20, window_seconds: 60 }
