# Risk catalog of the `resend` provider.
#
# Spec : docs/spec/resend.md §5 (v4 modelling), docs/spec/gateway-risk-model.md §4
#        + §4bis (scope caps), docs/spec/vaubaan-gateway.md §3.2 (presets).
# ADR  : docs/decisions/scope-caps-amplification-axis.md (caps + infra_limits),
#        docs/decisions/unified-gates-drop-confirm.md (no default_gate),
#        docs/decisions/plugin-contract-and-credential-spec.md (presets, loader).
#
# Version 2 (v5 SDK migration). Slices are rooted at the mission resources —
# `domain[<name>]` for everything that sends, `segment[<id>]` for broadcasts
# and membership — instead of the v4 `account[<binding slug>]`. Two v4 risks
# named after Resend's retired "audiences" are deprecated and replaced :
# `read-audiences` → `read-segments`, `audience-write` → `segment-write`.
# Their patterns are kept verbatim so the ids stay resolvable ; they never
# match a v5 slice and no preset offers them.
#
# Pattern discipline : `[**]` spans any number of segments, `[*]` exactly one
# identifier. Write patterns use `[*]` and explicit leaves so that a contact
# write never touches `segment-write`, and a broadcast send never touches
# `broadcast-draft` — the v4 catalog conflated them.
#
# Only `send-email-external-unbounded` is env-scoped : the owner labels domain
# resources with free-form environments, and that one risk is refused outside
# `staging` / `dev`. The fallback is never offered in a preset : the engine
# counts it only when no specific risk matched.
#
# Adding a risk : append an entry, bump `catalog_version`, update `catalog_date`.
# Removing or renaming a risk : forbidden — mark it `deprecated: true` and
# point `replaced_by` at its successor.

provider: resend
catalog_version: 2
catalog_date: 2026-10-13

risks:
  # ─── READS ─────────────────────────────────────────────────────────────

  - id: resend.read-email-status
    label: 'Read email send status and metadata'
    reason: >-
      Retrieve the status, subject, from/to and tags of a sent email.
      Metadata-level : GET /emails/:id returns no body content. Low risk.
    matches: 'resend.email[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  - id: resend.read-domains
    label: 'Read sending domains and DNS verification status'
    reason: >-
      List or retrieve the mission's sending domains with their DKIM / SPF /
      DMARC records and the recipient-zone configuration (describe_zones).
      Reveals the sending posture ; no secret (DNS records are public).
    matches: 'resend.domain[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  - id: resend.read-audiences
    label: 'Read audiences and contacts (PII) — v4, replaced by read-segments'
    reason: >-
      v4 risk rooted at the binding account. Resend renamed audiences to
      segments and made contacts account-level ; `resend.read-segments`
      carries the same PII read. Kept so the id stays resolvable.
    matches:
      - 'resend.account[**].audience[**].R'
      - 'resend.account[**].audience[**].contact[**].R'
    deprecated: true
    replaced_by: resend.read-segments
    vector:
      reversibility: reversible
      blast: account
      data: pii
      cost: free
      visibility: internal
      persistence: stateless

  - id: resend.read-segments
    label: 'Read segments and contacts (PII)'
    reason: >-
      List or retrieve the mission's segments, the account's contacts and the
      members of a segment. Contacts carry PII (email, first_name, last_name,
      custom properties) — GDPR-relevant, every read by an agent is a
      minimisation question. Distinct from read-broadcasts so a campaign
      status can be checked without unlocking the contact database.
    matches:
      - 'resend.segment[*].R'
      - 'resend.segment[*].member[*].R'
      - 'resend.contact[*].R'
    vector:
      reversibility: reversible
      blast: account
      data: pii
      cost: free
      visibility: internal
      persistence: stateless

  - id: resend.read-broadcasts
    label: 'Read broadcast campaigns'
    reason: >-
      List or retrieve broadcast metadata (name, subject, status, schedule)
      of the mission's segments. No contact-level PII, aggregate campaign
      information only.
    matches: 'resend.segment[*].broadcast[*].R'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  # ─── WRITES — TRANSACTIONAL EMAIL (rooted at the sending domain) ───────

  - id: resend.send-email-internal
    label: 'Send a transactional email to internal recipients only'
    reason: >-
      Every recipient belongs to the sending domain's internal_domains. Low
      exfiltration risk — the message stays inside the organisation.
      Side effect : a real email lands in a real inbox.
    matches: 'resend.domain[*].to-zone[internal].W'
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session

  - id: resend.send-email-allowlist
    label: 'Send a transactional email to pre-approved external recipients'
    reason: >-
      Every recipient is internal or matches allowlist_domains /
      allowlist_addresses of the sending domain. Pre-approved but external :
      the message leaves the organisation and cannot be recalled.
    matches: 'resend.domain[*].to-zone[allowlist].W'
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: resend.send-email-external-unbounded
    label: 'Send a transactional email to an arbitrary external recipient'
    reason: >-
      At least one recipient matches neither internal_domains nor the
      allowlists. Cardinal exfiltration vector : an agent could put sensitive
      data in the body and send it to an attacker-controlled address,
      irreversibly. Acceptable only on domains labelled staging or dev.
    matches: 'resend.domain[*].to-zone[external-unbounded].W'
    acceptable_in_envs: [staging, dev]
    vector:
      reversibility: irreversible
      blast: single
      data: secret
      cost: free
      visibility: public
      persistence: session

  - id: resend.send-batch
    label: 'Send a batch of transactional emails (up to 100 per call)'
    reason: >-
      POST /emails/batch sends up to 100 emails in one call. Bulk
      amplification whatever the recipient zone — the classifier also emits
      the zone slice, so both risks must be accepted. A distinct marker so the
      creator consents to bulk sending explicitly.
    matches: 'resend.domain[*].recipient-count[batch].W'
    vector:
      reversibility: irreversible
      blast: bulk
      data: data
      cost: moderate
      visibility: team
      persistence: session
    caps:
      items_per_call_max: 100
      calls_per_minute_max: 5
      calls_per_session_max: 50
    infra_limits:
      items_per_call_max: 100

  # ─── WRITES — SEGMENTS & CONTACTS ──────────────────────────────────────

  - id: resend.audience-write
    label: 'Create or delete an audience — v4, replaced by segment-write'
    reason: >-
      v4 risk rooted at the binding account. Resend renamed audiences to
      segments ; `resend.segment-write` carries the same structural change.
      Kept so the id stays resolvable.
    matches: 'resend.account[**].audience[**].W'
    deprecated: true
    replaced_by: resend.segment-write
    vector:
      reversibility: costly
      blast: env
      data: metadata
      cost: free
      visibility: internal
      persistence: posture

  - id: resend.segment-write
    label: 'Create or delete a segment'
    reason: >-
      Structural change to the contact database. Creating a segment is low
      risk ; deleting one drops every membership it held (the contacts
      survive). Conservative vector for the worst case.
    matches:
      - 'resend.segment.W'
      - 'resend.segment[*].W'
    vector:
      reversibility: costly
      blast: env
      data: metadata
      cost: free
      visibility: internal
      persistence: posture

  - id: resend.contact-write
    label: 'Create, update or delete contacts ; add or remove segment members'
    reason: >-
      Mutate the contact database : add subscribers, edit PII fields,
      unsubscribe, delete, or move contacts in and out of a segment (which
      decides who a broadcast reaches). Reversible for creates, not for
      deletes.
    matches:
      - 'resend.contact.W'
      - 'resend.contact[*].W'
      - 'resend.segment[*].member[*].W'
    vector:
      reversibility: costly
      blast: env
      data: pii
      cost: free
      visibility: internal
      persistence: posture

  # ─── WRITES — BROADCASTS (rooted at the segment) ───────────────────────

  - id: resend.broadcast-draft
    label: 'Create or update a broadcast (draft, not sent)'
    reason: >-
      Draft a campaign for a segment of the mission. No side effect until
      sent — the classifier refuses a create carrying `send` or
      `scheduled_at`, which would bypass broadcast-send. Reversible (delete
      the draft).
    matches:
      - 'resend.segment[*].broadcast.W'
      - 'resend.segment[*].broadcast[*].W'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session

  - id: resend.broadcast-send
    label: 'Send a broadcast to its segment (mass email delivery)'
    reason: >-
      Deliver a broadcast to every contact of the segment. Cardinal bulk
      action — potentially thousands of real emails, irreversibly, at a cost
      that scales with the segment. The plugin re-reads the broadcast
      upstream and refuses to send one that targets another segment than the
      one named. The highest-risk operation of this provider.
    matches: 'resend.segment[*].broadcast[*].send.W'
    vector:
      reversibility: irreversible
      blast: bulk
      data: data
      cost: unbounded
      visibility: public
      persistence: posture
    caps:
      calls_per_minute_max: 1
      calls_per_session_max: 5
    infra_limits:
      calls_per_minute_max: 10

  - id: resend.broadcast-delete
    label: 'Delete a broadcast'
    reason: >-
      Remove a broadcast of a segment of the mission. A sent broadcast loses
      its record only (delivered emails are not recalled) ; a scheduled one
      is cancelled.
    matches: 'resend.segment[*].broadcast[*].delete.W'
    vector:
      reversibility: costly
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: session

  # ─── WRITES — DOMAINS ──────────────────────────────────────────────────

  - id: resend.domain-write
    label: 'Add, update or remove a sending domain'
    reason: >-
      Posture shift : adding a domain widens what the account can send from
      ; removing one breaks delivery for every sender on it ; tracking and
      TLS settings change what recipients see. DNS must be configured
      outside Resend. Suggested gate : approval.
    matches:
      - 'resend.domain.W'
      - 'resend.domain[*].W'
    vector:
      reversibility: costly
      blast: account
      data: metadata
      cost: free
      visibility: public
      persistence: posture

  - id: resend.domain-verify
    label: 'Trigger DNS verification of a domain'
    reason: >-
      Idempotent request that asks Resend to re-check the DNS records of a
      domain of the mission. No side effect beyond the attempt ; a step of
      the domain set-up posture shift.
    matches: 'resend.domain[*].dns-record[*].W'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  # ─── FALLBACK (required) ───────────────────────────────────────────────

  - id: resend.uncategorized-write
    label: 'Uncategorized Resend write'
    reason: >-
      Catch-all for a write no named risk covers. If Resend adds a surface
      (webhooks, API keys, templates) and Vaubaan wraps it before the catalog
      is updated, calls land here — fail-loud by design. Never offered in a
      preset.
    matches: 'resend.[**].W'
    fallback: true
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: moderate
      visibility: internal
      persistence: posture

# ─── PRESETS (UI sugar ; the persisted policy is always the explicit list) ──
#
# Values are a starting point — ADR `mission-presets-default-values` is
# deferred. `send-email-external-unbounded` is env-scoped and never offered :
# a creator adds `resend[staging].send-email-external-unbounded` by hand.

presets:
  - id: read-only
    label: Read-only
    description: Email status, sending domains and campaign metadata of the selected resources. No PII, no write.
    entries:
      - risk_id: resend.read-email-status
        quota: 2000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: resend.read-domains
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: resend.read-broadcasts
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto

  - id: developer
    label: Developer
    description: One token per code project — transactional sends to internal and allow-listed recipients, generous budgets ; no bulk, no PII, no domain change.
    entries:
      - risk_id: resend.read-email-status
        quota: 5000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: resend.read-domains
        quota: 2000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: resend.read-broadcasts
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: resend.send-email-internal
        quota: 2000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: resend.send-email-allowlist
        quota: 1000
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto

  - id: marketing-operator
    label: Marketing operator
    description: Contacts, segments and campaigns ; broadcast sends, batch sends and segment deletion need approval. No domain change.
    entries:
      - risk_id: resend.read-email-status
        quota: 2000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: resend.read-domains
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: resend.read-segments
        quota: 5000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: resend.read-broadcasts
        quota: 2000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: resend.send-email-internal
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: resend.send-email-allowlist
        quota: 1000
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: resend.send-batch
        quota: 50
        rate_limit: { max: 5, window_seconds: 60 }
        gate: approval
      - risk_id: resend.contact-write
        quota: 5000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: resend.segment-write
        quota: 20
        rate_limit: { max: 5, window_seconds: 60 }
        gate: approval
      - risk_id: resend.broadcast-draft
        quota: 200
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: resend.broadcast-send
        quota: 10
        rate_limit: { max: 1, window_seconds: 60 }
        gate: approval
      - risk_id: resend.broadcast-delete
        quota: 50
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto

  - id: domain-admin
    label: Domain admin
    description: Provision sending domains — read and verify freely, every domain mutation needs approval. No send.
    entries:
      - risk_id: resend.read-domains
        quota: 2000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: resend.domain-verify
        quota: 200
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: resend.domain-write
        quota: 20
        rate_limit: { max: 5, window_seconds: 60 }
        gate: approval
