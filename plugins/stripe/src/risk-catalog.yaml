# Stripe risk catalog — v4 risk-based model.
#
# Spec     : docs/spec/gateway-risk-model.md §4 + §4bis (scope caps).
# Research : .vaubaan/research/providers/stripe.md §3.
# ADR      : docs/decisions/scope-caps-amplification-axis.md
#            docs/decisions/unified-gates-drop-confirm.md (no default_gate).
#
# 14 named risks + 1 fallback = 15 total. RiskId format follows
# `<provider>.<name>` (cf. shared/src/risk.ts RISK_ID_REGEX). The env
# qualification (test/live) is encoded in the binding (mode is `envScopable`),
# not in the RiskId — the runtime resolves the env from the binding and
# qualifies the cardinal risks as `stripe[live].refund-create` etc.
#
# Slice patterns use the DSL declared in policy-engine/src/slice-dsl.ts
# (no regex, only `[*]` / `[**]` wildcards and `[a,b,c]` lists). Each pattern
# must match at least one tool's emitted slice — verified by the
# `risk-catalog.test.ts` coverage lint.
#
# One entry carries `caps` + `infra_limits` per the scope-caps ADR :
# `stripe.refund-create` (cardinal cost-unbounded irreversible action — the
# only Vaubaan risk to date touching real outbound cash). The other 13 risks
# stay caps-free at MVP — the org chooses.

provider: stripe

risks:
  # ─── READS ─────────────────────────────────────────────────────────────

  - id: stripe.read-catalog
    label: 'Read catalog (products, prices, coupons, promotion codes)'
    reason: >-
      Inventaire du catalogue commercial. Métadonnées publiques par
      construction (les prix s'affichent sur le site marketing).
      Aucune PII, aucun secret.
    matches:
      - 'stripe.account[**].mode[**].product[**].R'
      - 'stripe.account[**].mode[**].product[**].price[**].R'
      - 'stripe.account[**].mode[**].coupon[**].R'
      - 'stripe.account[**].mode[**].coupon[**].promotion-code[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: public
      persistence: stateless

  - id: stripe.read-billing-history
    label: 'Read billing history (subscriptions, invoices, charges, payment intents)'
    reason: >-
      Lecture de l'historique transactionnel. Pas d'exfil de PAN (Stripe
      masque), mais montants + dates + descriptions par client. Donne la
      trajectoire commerciale et permet l'analytics business. Distinct
      du read-customer-pii pour permettre des stats anonymisées.
    matches:
      - 'stripe.account[**].mode[**].customer[**].R'
      - 'stripe.account[**].mode[**].customer[**].subscription[**].R'
      - 'stripe.account[**].mode[**].customer[**].invoice[**].R'
      - 'stripe.account[**].mode[**].payment-intent[**].R'
      - 'stripe.account[**].mode[**].payment-intent[**].charge[**].R'
    vector:
      reversibility: reversible
      blast: account
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  - id: stripe.read-customer-pii
    label: 'Read customer PII (email, name, address, phone)'
    reason: >-
      Lecture des champs PII des customers (`email`, `name`, `address`,
      `phone`, `shipping`). Surface RGPD/CCPA — toute consommation par un
      agent IA déclenche obligation de minimisation. Distinct du
      read-billing-history pour permettre lecture "stats anonymisées" sans
      débloquer l'identité.
    matches: 'stripe.account[**].mode[**].customer[**].pii.R'
    vector:
      reversibility: reversible
      blast: account
      data: pii
      cost: free
      visibility: internal
      persistence: stateless

  - id: stripe.read-balance
    label: 'Read balance and balance transactions (cash position)'
    reason: >-
      Solde dispo + en attente + historique du ledger. Donne la position
      cash en temps réel. Sensible côté direction financière mais pas PII
      — distinct du read-billing-history pour permettre un agent "ops
      monitoring" sans accès aux détails clients.
    matches:
      - 'stripe.account[**].mode[**].balance.R'
      - 'stripe.account[**].mode[**].balance-transaction[**].R'
      - 'stripe.account[**].mode[**].event[**].R'
    vector:
      reversibility: reversible
      blast: account
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  # ─── WRITES — CATALOGUE (produits / prix / coupons) ────────────────────

  - id: stripe.catalog-write
    label: 'Create / update products, prices, coupons, promotion codes'
    reason: >-
      Modifications du catalogue commercial. Réversible (archive +
      recreate), pas d'impact direct sur les paiements existants, mais
      affecte tous les futurs checkouts. Posture-shift "soft" sur l'offre.
    matches:
      - 'stripe.account[**].mode[**].product[**].W'
      - 'stripe.account[**].mode[**].product[**].price[**].W'
      - 'stripe.account[**].mode[**].coupon[**].W'
      - 'stripe.account[**].mode[**].coupon[**].promotion-code[**].W'
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: public
      persistence: posture

  # ─── WRITES — ABONNEMENTS ──────────────────────────────────────────────

  - id: stripe.subscription-create
    label: 'Create a new subscription (may trigger immediate charge)'
    reason: >-
      Création d'un abonnement. Si proration immédiate (cas par défaut sans
      `billing_cycle_anchor`), Stripe facture immédiatement — donc side
      effect cash. Le classifier émet en parallèle `payment-intent.W` pour
      forcer l'opérateur à accepter le risque cash en même temps que la
      création de sub (worst-case, research §4.3 cas 2).
    matches: 'stripe.account[**].mode[**].customer[**].subscription.W'
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: moderate
      visibility: internal
      persistence: posture

  - id: stripe.subscription-update
    label: 'Update an existing subscription (plan change, quantity, metadata)'
    reason: >-
      Modification d'abonnement existant : changement de plan, quantité,
      métadonnées, pause_collection. Costly si proration (charge ou crédit
      immédiat selon direction). Posture-shift sur la facturation
      récurrente.
    matches: 'stripe.account[**].mode[**].customer[**].subscription[**].W'
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: moderate
      visibility: internal
      persistence: posture

  - id: stripe.subscription-cancel
    label: 'Cancel a subscription (stops future charges)'
    reason: >-
      Annulation d'abonnement. Stoppe la facturation future. Irréversible
      sémantiquement (resubscribe = nouvelle subscription, perte
      d'historique de fidélité). Côté client : perte d'accès au service
      à la fin de période.
    matches: 'stripe.account[**].mode[**].customer[**].subscription[**].cancel.W'
    vector:
      reversibility: irreversible
      blast: single
      data: data
      cost: moderate
      visibility: internal
      persistence: posture

  # ─── WRITES — FACTURES ─────────────────────────────────────────────────

  - id: stripe.invoice-create-draft
    label: 'Create a draft invoice (no customer notification)'
    reason: >-
      Création d'une facture en brouillon. Aucune notification client,
      aucun mouvement d'argent. Réversible par delete tant que non
      finalisée. Surface acceptable pour un agent "billing assistant".
    matches: 'stripe.account[**].mode[**].customer[**].invoice.W'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session

  - id: stripe.invoice-finalize
    label: 'Finalize an invoice (locks it and triggers payment attempt)'
    reason: >-
      Finalisation d'une facture draft. À ce moment, Stripe verrouille
      l'invoice (impossible à modifier), notifie le client (email auto par
      défaut) et tente automatiquement la collection si l'invoice est
      `auto_advance: true`. Costly à reverter (void laisse trace).
    matches: 'stripe.account[**].mode[**].customer[**].invoice[**].finalize.W'
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: moderate
      visibility: team
      persistence: posture

  - id: stripe.invoice-void
    label: 'Void a finalized invoice (cannot be undone)'
    reason: >-
      Annulation d'une invoice finalisée. **Action irréversible** par
      design Stripe (papertrail conservé mais l'invoice est inerte
      définitivement). Pas de mouvement d'argent direct mais déprécie la
      créance — impact comptable.
    matches: 'stripe.account[**].mode[**].customer[**].invoice[**].void.W'
    vector:
      reversibility: irreversible
      blast: single
      data: data
      cost: free
      visibility: team
      persistence: posture

  # ─── WRITES — REFUNDS (le plus sensible) ───────────────────────────────

  - id: stripe.refund-create
    label: 'Create a refund (real money out of the merchant account)'
    reason: >-
      Émission d'un remboursement. **Sortie d'argent réelle** côté
      merchant ; le coût est borné par le montant de la charge mais cumulé
      sur N appels = non borné en pratique. **Irréversible** (un refund
      ne se reverse pas — il faut recharger le client, qui peut refuser).
      Vecteur cardinal d'exfiltration financière par agent compromis ou
      prompt-injected.
    matches: 'stripe.account[**].mode[**].payment-intent[**].charge[**].refund[**].W'
    vector:
      reversibility: irreversible
      blast: account
      data: data
      cost: unbounded
      visibility: internal
      persistence: posture
    caps:
      items_per_call_max: 1
      calls_per_minute_max: 3
      calls_per_session_max: 20
    infra_limits:
      calls_per_minute_max: 30

  # ─── WRITES — WEBHOOKS (intégration + credential mint) ─────────────────

  - id: stripe.webhook-endpoint-write
    label: 'Create / update / delete a webhook endpoint configuration'
    reason: >-
      Configuration de l'URL et des events qu'un endpoint webhook reçoit.
      Posture-shift : un endpoint mal configuré peut router des events
      vers un attaquant (data flow externe), ou faire fuiter des données
      customer dans le payload. Distinct du mint-secret car l'update ne
      re-génère pas le secret.
    matches: 'stripe.account[**].mode[**].webhook-endpoint[**].W'
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: public
      persistence: posture

  - id: stripe.mint-webhook-secret
    label: 'Mint a new webhook signing secret (create_webhook_endpoint)'
    reason: >-
      Credential creation. Le secret `whsec_*` est retourné une seule
      fois à la création — il signe l'authenticité de tous les events
      reçus. Distinct du webhook-endpoint-write car même intention (créer
      un endpoint) produit un effet secret-bearer asymétrique. Aligne
      avec `vercel.mint-bypass-token` (credential minted via opération
      atomique).
    matches: 'stripe.account[**].mode[**].webhook-endpoint[**].secret.W'
    vector:
      reversibility: reversible
      blast: account
      data: secret
      cost: free
      visibility: internal
      persistence: posture

  # ─── FALLBACK (required) ───────────────────────────────────────────────

  - id: stripe.uncategorized-write
    label: 'Uncategorized Stripe write'
    reason: >-
      Catch-all pour les writes non catégorisés. Si Vaubaan étend vers
      `delete_customer`, `payment_intent.confirm`, `create_payout`,
      `create_transfer` (Connect), ces actions tomberont ici jusqu'à ce
      qu'un risk dédié soit ajouté — fail-loud par design.
    matches: 'stripe.[**].W'
    vector:
      reversibility: costly
      blast: account
      data: data
      cost: moderate
      visibility: internal
      persistence: posture
