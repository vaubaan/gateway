# Gmail risk catalog — loaded by `@vaubaan/plugin-sdk` (`loadCatalogFile`) at
# gateway boot. Experimental, classifier-only plugin : the risks below are
# evaluated on every call, but no tool executes yet (see plugins/gmail/README.md).
#
# Spec     : docs/spec/gateway-risk-model.md §4 + §4bis (scope caps) ;
#            docs/spec/vaubaan-gateway.md §3.2 (presets).
# ADR      : docs/decisions/scope-caps-amplification-axis.md ;
#            docs/decisions/plugin-contract-and-credential-spec.md.
# Handbook : docs/handbook/providers/gmail.md.
#
# 15 named risks + 1 fallback = 16. Ids are never renamed or deleted
# (deprecate instead). Gmail has no native environment : the `mailbox`
# entity is `envScopable` so an owner may still label a mailbox resource, but
# no risk is env-scoped today.
#
# Two entries carry `caps` (soft defaults) and `infra_limits` (hard ceilings)
# per the scope-caps ADR : `gmail.bulk-read` (volume is the cardinal risk)
# and `gmail.read-from-zone-unknown` (OWASP LLM01 : prompt injection through
# a message body — keep the blast small).

provider: gmail
catalog_version: 2
catalog_date: 2026-10-13

risks:
  # ─── READS ─────────────────────────────────────────────────────────────

  - id: gmail.read-mailbox
    label: 'Read mailbox structure (labels, threads, message headers)'
    reason: >-
      Inventory of labels, thread ids, subjects and sender names, and the
      containment slice of a thread fetch (whose content risk is carried by
      the from-zone marker emitted alongside). Limited attack surface, but
      the baseline every read needs. Also covers the synthetic
      `gmail__describe_zones` tool, which returns the zoning configuration.
    matches:
      - 'gmail.mailbox.label[**].R'
      - 'gmail.mailbox.thread[**].message[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: stateless

  - id: gmail.read-from-zone-automated
    label: 'Read messages from automated / notification senders'
    reason: >-
      Notifications (GitHub, Stripe, Vercel…). Little direct PII, but the
      bodies often carry injectable URLs and markdown (OWASP LLM01). Kept
      distinct so an "ops" agent can read alerts without unlocking personal
      correspondence.
    matches: 'gmail.mailbox.from-zone[automated].R'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  - id: gmail.read-from-zone-internal
    label: 'Read messages from internal-domain senders'
    reason: >-
      Correspondence between colleagues : may contain secrets, strategic
      decisions and privileged context. Distinct from the automated zone by
      least privilege.
    matches: 'gmail.mailbox.from-zone[internal].R'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  - id: gmail.read-from-zone-known-external
    label: 'Read messages from known external contacts (allowlist)'
    reason: >-
      Messages from pre-approved partners and customers (allowlist). Routine
      business traffic, comparatively low risk.
    matches: 'gmail.mailbox.from-zone[known-external].R'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  - id: gmail.read-from-zone-unknown
    label: 'Read messages from unknown senders'
    reason: >-
      Messages whose sender is neither internal nor allowlisted. The cardinal
      OWASP LLM01 vector — prompt injection through the message body. Strong
      posture recommended, tight caps.
    matches: 'gmail.mailbox.from-zone[unknown].R'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless
    caps:
      items_per_call_max: 10
      calls_per_minute_max: 20
      temporal_window_days: 7
    infra_limits:
      bytes_per_call_max: 1048576

  - id: gmail.read-drafts
    label: 'Read existing drafts'
    reason: >-
      Drafts reveal unsent intentions and earlier versions of external
      communications.
    matches: 'gmail.mailbox.draft[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless

  - id: gmail.read-sensitive-label
    label: 'Read messages tagged with a sensitive label (financial, legal, HR, …)'
    reason: >-
      Zone override : whoever the sender is, a thread carrying a label the
      owner declared sensitive is escalated. Guard rail for structurally
      private correspondence (payroll, legal, HR, invoices).
    matches: 'gmail.mailbox.sensitive-label[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: pii
      cost: free
      visibility: internal
      persistence: stateless

  - id: gmail.bulk-read
    label: 'Bulk read across the mailbox (non-discriminating query)'
    reason: >-
      `search_threads(q="is:unread")`, or any query without a `from:` / `to:`
      / `label:` discriminator, may return hundreds of threads at once and
      bypass per-message zoning. A distinct marker forces an explicit
      acceptance.
    matches: 'gmail.mailbox.bulk-marker.R'
    vector:
      reversibility: reversible
      blast: bulk
      data: data
      cost: free
      visibility: internal
      persistence: stateless
    caps:
      items_per_call_max: 50
      calls_per_minute_max: 5
      temporal_window_days: 90
    infra_limits:
      items_per_call_max: 500
      bytes_per_call_max: 10485760

  # ─── WRITES — DRAFTS ───────────────────────────────────────────────────
  # Every draft write emits two slices : the containment slice `draft.W`
  # (matched by `draft-write`) and the recipient-zone marker (matched by one
  # `draft-to-zone-*` risk). Both must be accepted ; without `draft-write`
  # the containment slice would fall to the fallback, which no preset offers.

  - id: gmail.draft-write
    label: 'Create / modify a draft (any recipient)'
    reason: >-
      Baseline write of a draft, whatever its recipients ; the exfiltration
      axis is carried by the `draft-to-zone-*` risk emitted alongside. Drafts
      are reversible (delete) and never sent by this plugin.
    matches:
      - 'gmail.mailbox.draft.W'
      - 'gmail.mailbox.draft[**].W'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session

  - id: gmail.draft-to-zone-self
    label: 'Create / modify a draft addressed to self only'
    reason: >-
      A memo to oneself. No external leak as long as the draft is not sent ;
      the official Google MCP server cannot send, so a draft is a terminal
      action here.
    matches: 'gmail.mailbox.to-zone[self].W'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session

  - id: gmail.draft-to-zone-internal
    label: 'Create / modify a draft addressed to internal recipients only'
    reason: >-
      A draft for colleagues. Stays internal while unsent ; no external
      exfiltration path.
    matches: 'gmail.mailbox.to-zone[internal].W'
    vector:
      reversibility: reversible
      blast: env
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: gmail.draft-to-zone-allowlist
    label: 'Create / modify a draft to pre-approved external contacts (allowlist)'
    reason: >-
      A draft to pre-approved external contacts (CRM-like). Limited risk while
      unsent ; if a `send_draft` tool is ever wrapped, this risk gates it
      naturally.
    matches: 'gmail.mailbox.to-zone[allowlist].W'
    vector:
      reversibility: reversible
      blast: env
      data: data
      cost: free
      visibility: team
      persistence: session

  - id: gmail.draft-to-zone-external-unbounded
    label: 'Create / modify a draft to an external recipient not in the allowlist'
    reason: >-
      A draft to an arbitrary external address : the cardinal exfiltration
      vector once sent, and even unsent its existence can leak intentions.
      Offered by no preset ; a mission accepts it only by explicit, conscious
      enumeration (the v4 `acceptable_in_envs: []` "never acceptable" marker
      is not expressible in a v5 catalog).
    matches: 'gmail.mailbox.to-zone[external-unbounded].W'
    vector:
      reversibility: reversible
      blast: account
      data: secret
      cost: free
      visibility: public
      persistence: session

  # ─── WRITES — LABELS ───────────────────────────────────────────────────

  - id: gmail.label-write
    label: 'Apply / remove labels on a thread or message (single)'
    reason: >-
      Mailbox organisation. UI-level and reversible (re-label). No direct
      security impact unless the label is `SPAM` / `TRASH` / `IMPORTANT`.
    matches: 'gmail.mailbox.thread[**].label.W'
    vector:
      reversibility: reversible
      blast: single
      data: metadata
      cost: free
      visibility: internal
      persistence: session

  - id: gmail.bulk-label-write
    label: 'Bulk apply / remove labels across many threads'
    reason: >-
      `label_thread` over N threads found by a wide `search_threads`. A silent
      risk : one MCP call can affect hundreds of threads. Distinct from the
      single label write.
    matches: 'gmail.mailbox.bulk-marker.W'
    vector:
      reversibility: reversible
      blast: bulk
      data: metadata
      cost: free
      visibility: internal
      persistence: session

  # ─── FALLBACK (required) ───────────────────────────────────────────────

  - id: gmail.uncategorized-write
    label: 'Uncategorized Gmail write'
    reason: >-
      Catch-all for writes no entry above covers. If the plugin ever surfaces
      `send_message`, `delete_message` or `create_filter`, they land here
      until a dedicated risk is added — fail-loud by design. Never offered in
      a preset.
    matches: 'gmail.[**].W'
    fallback: true
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: free
      visibility: internal
      persistence: posture

# Presets are default suggestions copied into a mission policy at issuance
# (spec §3.2). Gmail has no environment, so no entry is env-qualified.
# Values are provisional until ADR `mission-presets-default-values`.
# Deliberately in no preset : `gmail.read-sensitive-label` (PII, explicit
# acceptance), `gmail.draft-to-zone-external-unbounded` (never acceptable)
# and the fallback.
presets:
  - id: read-only
    label: Read-only triage
    description: List labels and drafts, search and read threads from automated, internal, allowlisted and unknown senders ; no write, no bulk read, no sensitive label.
    entries:
      - risk_id: gmail.read-mailbox
        quota: 2000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.read-from-zone-automated
        quota: 1000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.read-from-zone-internal
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.read-from-zone-known-external
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.read-from-zone-unknown
        quota: 200
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.read-drafts
        quota: 200
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto

  - id: developer
    label: Developer
    description: Experimental — read-only triage plus drafts to self, colleagues and allowlisted contacts and single-thread labelling ; bulk reads and bulk label writes need approval.
    entries:
      - risk_id: gmail.read-mailbox
        quota: 5000
        rate_limit: { max: 120, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.read-from-zone-automated
        quota: 2000
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.read-from-zone-internal
        quota: 1000
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.read-from-zone-known-external
        quota: 1000
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.read-from-zone-unknown
        quota: 300
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.read-drafts
        quota: 500
        rate_limit: { max: 30, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.draft-write
        quota: 300
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.draft-to-zone-self
        quota: 200
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.draft-to-zone-internal
        quota: 200
        rate_limit: { max: 20, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.draft-to-zone-allowlist
        quota: 100
        rate_limit: { max: 10, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.label-write
        quota: 500
        rate_limit: { max: 60, window_seconds: 60 }
        gate: auto
      - risk_id: gmail.bulk-read
        quota: 20
        rate_limit: { max: 5, window_seconds: 60 }
        gate: approval
      - risk_id: gmail.bulk-label-write
        quota: 20
        rate_limit: { max: 5, window_seconds: 60 }
        gate: approval
