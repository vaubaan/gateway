# Fixture catalog for the SDK's own tests. Not a real service.
service: acme
catalog_version: 4
catalog_date: 2026-10-31

risks:
  - id: acme.read-things
    label: 'Read things'
    reason: 'Reads leak nothing but the thing itself.'
    matches:
      - 'acme.space[**].thing[**].R'
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
  - id: acme.thing-write
    label: 'Write a thing'
    reason: 'Reversible edit of one thing. Costly on prod because customers see it.'
    matches: 'acme.space[**].thing[**].W'
    acceptable_in_envs: [staging, prod]
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: team
    vector_overrides:
      prod:
        reversibility: costly
        visibility: public
    caps:
      items_per_call_max: 50

  - id: acme.legacy-export
    label: 'Legacy export'
    reason: 'Kept for missions issued before v3.'
    matches: 'acme.space[**].export.R'
    deprecated: true
    replaced_by: acme.read-things
    vector:
      reversibility: reversible
      blast: account
      data: data
      cost: moderate
      visibility: internal
  - id: acme.uncategorized-write
    label: 'Uncategorized write'
    reason: 'Catch-all. Seen in production, it means the catalog misses an entry.'
    matches: 'acme.**.W'
    fallback: true
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: free
      visibility: internal
macro_actions:
  - id: read
    label: 'Read'
    description: 'Read things.'
    entries:
      - { risk_id: acme.read-things, quota: 500, rate_limit: { max: 60, window_seconds: 60 } }
  - id: write
    label: 'Write'
    description: 'Create and change things.'
    entries:
      - { risk_id: acme.thing-write, quota: 50, rate_limit: { max: 10, window_seconds: 60 } }
