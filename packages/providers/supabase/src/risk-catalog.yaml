# Supabase risk catalog — v4 (risk-based).
#
# Source of truth   : .vaubaan/research/providers/supabase.md §4 + §5.
# Spec              : docs/spec/gateway-risk-model.md §4, §16 Q2.
# Format contract   : @vaubaan/shared `RiskCatalog` / `RiskEntry`.
# Slice DSL         : @vaubaan/policy-engine `parseSlice` (spec §3).
#
# IDs follow the `<provider>.<segment>+` form. Env-scoped qualification
# (`supabase[<env>].<name>`) is injected at mint time by the engine, not
# in this file (the catalog stays env-agnostic). The `acceptable_in_envs`
# field is the structural restrictor that prevents accepting a risk for
# an unintended env even if project policy allows it.
#
# Cardinality convention (research §1.1, §2.4) :
#   row[one]    = bounded write on a single identified row.
#   row[bulk]   = unbounded write (UPDATE/DELETE without bounded WHERE,
#                 TRUNCATE, COPY, INSERT massif).
#   object[one] / object[bulk] : ditto for storage paths.
#   user[one]   / user[bulk]   : ditto for GoTrue user identities.
#
# The matcher's `matches` semantics treat the concrete slice as the
# canonical form ; cardinality markers are literal idents (not wildcards)
# so `row[one]` and `row[bulk]` are mutually exclusive at match time. See
# `risk-classifier.ts` for the emission rules.
#
# Risk count : 24 named risks + 1 fallback (`supabase.uncategorized-write`).

provider: supabase
risks:
  # ───────────────────────────────────────────────────────────────────────
  # Plane `db`
  # ───────────────────────────────────────────────────────────────────────

  - id: supabase.read-data
    label: Lire les données et le schéma
    reason: >-
      SELECT + schema inspection. Peut leak PII via auth.users / app users
      si le schema est mal cloisonné. Inclut les reads issus de
      `execute_sql` (post-§7.2 #2 strictement R-only enforced par Postgres).
      Pattern volontairement large : tout read Supabase fire `read-data`,
      les risks plus spécifiques (auth.read-users, storage.signed-url.R,
      functions.read sur secret leak) co-firent et durcissent le gate.
    matches: supabase.**.R
    vector:
      reversibility: reversible
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: stateless
    default_gate: allow

  - id: supabase.row-write-one
    label: Écrire row par row (cible bornée)
    reason: >-
      INSERT/UPDATE/DELETE ciblé (par id, par clause WHERE bornée).
      Reversible via re-écriture si l'agent garde la valeur précédente.
    matches: supabase.project[**].schema[**].table[**].row[one].W
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session
    default_gate: allow
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.bulk-row-write
    label: Écrire en bulk sur une table
    reason: >-
      INSERT massif, UPDATE/DELETE sans WHERE ou WHERE large, TRUNCATE,
      COPY. Pas de rollback automatique. Blast élevé.
    matches: supabase.project[**].schema[**].table[**].row[bulk].W
    vector:
      reversibility: costly
      blast: bulk
      data: data
      cost: moderate
      visibility: internal
      persistence: session
    default_gate: confirm
    acceptable_in_envs: [preview, staging]

  - id: supabase.migration.W
    label: Apply migration (DDL)
    reason: >-
      CREATE/DROP/ALTER TABLE/INDEX. Costly à reverter (down-migration
      manuelle). Peut casser les apps qui lisent. Matches strictly a
      schema/table-level write (no further row segment), so a row write
      doesn't accidentally fire migration.W.
    matches: supabase.project[**].schema[*].table[*].W
    vector:
      reversibility: costly
      blast: env
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    default_gate: confirm

  - id: supabase.policy.W
    label: Modifier la RLS (CREATE/ALTER POLICY)
    reason: >-
      Posture-shift critique : ouvre/ferme l'accès aux données pour tous
      les rôles. Une erreur ici = data leak public.
    matches: supabase.project[**].policy[**].W
    vector:
      reversibility: costly
      blast: account
      data: data
      cost: free
      visibility: public
      persistence: posture
    default_gate: deny

  - id: supabase.db-role.W
    label: Créer/modifier des rôles Postgres
    reason: >-
      Posture credentials. CREATE ROLE / GRANT / REVOKE. Pas de tool MCP
      aujourd'hui (entrée anticipée pour le futur).
    matches: supabase.project[**].db-role[**].W
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    default_gate: deny

  - id: supabase.extension.W
    label: Activer/désactiver une extension Postgres
    reason: >-
      Posture-shift de la surface SQL disponible. Certaines extensions
      (pg_net, http) ouvrent l'exfiltration sortante. Pas de tool
      aujourd'hui (entrée anticipée).
    matches: supabase.project[**].extension[**].W
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    default_gate: deny

  # ───────────────────────────────────────────────────────────────────────
  # Plane `storage`
  # ───────────────────────────────────────────────────────────────────────

  - id: supabase.storage.object.R
    label: Lister / télécharger des objets storage
    reason: >-
      Lectures de fichiers users (peut être PII : pièces d'ID, photos,
      exports). Selon ACL bucket, accès via clé service.
    matches: supabase.project[**].bucket[**].object[**].R
    vector:
      reversibility: reversible
      blast: single
      data: pii
      cost: free
      visibility: internal
      persistence: stateless
    default_gate: allow

  - id: supabase.storage.object-write-one
    label: Upload/delete d'un objet ciblé
    reason: >-
      Mutation d'un path précis. Reversible si l'agent garde une copie
      avant l'overwrite.
    matches: supabase.project[**].bucket[**].object[one].W
    vector:
      reversibility: costly
      blast: single
      data: data
      cost: free
      visibility: internal
      persistence: session
    default_gate: allow
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.storage.bulk-object-write
    label: Upload/delete bulk d'objets
    reason: >-
      List + delete via glob ou prefix-wide. Supabase Storage n'a pas de
      versioning par défaut — bulk delete = irréversible.
    matches: supabase.project[**].bucket[**].object[bulk].W
    vector:
      reversibility: irreversible
      blast: bulk
      data: pii
      cost: moderate
      visibility: internal
      persistence: session
    default_gate: confirm
    acceptable_in_envs: [preview, staging]

  - id: supabase.storage.signed-url.R
    label: Générer une URL signée
    reason: >-
      READ sur le bucket MAIS exfiltre potentiellement la data vers un
      destinataire externe via URL temporaire signée. Risk distinct du
      simple list/download — le destinataire est choisi par l'agent.
    matches: supabase.project[**].bucket[**].object[**].signed-url[**].R
    vector:
      reversibility: reversible
      blast: single
      data: pii
      cost: free
      visibility: public
      persistence: session
    default_gate: confirm

  - id: supabase.bucket.W
    label: Créer/modifier/supprimer un bucket
    reason: >-
      Posture-shift : un bucket public peut leaker des objets privés mal
      classés. Delete = cascade irréversible sur les objets. Matches the
      bucket-level write strictly (no further object segment).
    matches: supabase.project[**].bucket[*].W
    vector:
      reversibility: irreversible
      blast: env
      data: pii
      cost: free
      visibility: public
      persistence: posture
    default_gate: confirm

  - id: supabase.storage-config.W
    label: Modifier la storage config globale
    reason: >-
      Quotas, transformations, CDN. Affecte tout le projet et toutes les
      apps qui consomment le storage.
    matches: supabase.project[**].storage-config.W
    vector:
      reversibility: reversible
      blast: env
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    default_gate: deny

  # ───────────────────────────────────────────────────────────────────────
  # Plane `auth`
  # ───────────────────────────────────────────────────────────────────────

  - id: supabase.auth.read-users
    label: Lister/lire les utilisateurs
    reason: >-
      PII : emails, providers, last_sign_in_at, metadata user. Volume
      potentiellement gros. Couvre aussi les SELECT directs sur
      `auth.users` via execute_sql (cf. research §9 Q3).
    matches: supabase.project[**].user[**].R
    vector:
      reversibility: reversible
      blast: bulk
      data: pii
      cost: free
      visibility: internal
      persistence: stateless
    default_gate: confirm
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.auth.user-write-one
    label: Créer/modifier/supprimer un user ciblé
    reason: >-
      Affecte une identité unique. Reversible (re-create) sauf delete qui
      cascade sur les rows owned par le user (FK ON DELETE CASCADE).
    matches: supabase.project[**].user[one].W
    vector:
      reversibility: costly
      blast: single
      data: pii
      cost: free
      visibility: internal
      persistence: posture
    default_gate: confirm

  - id: supabase.auth.bulk-user-write
    label: Manipulation bulk d'utilisateurs
    reason: >-
      Création / suppression massive. Risque d'exclusion accidentelle de
      vrais users en prod.
    matches: supabase.project[**].user[bulk].W
    vector:
      reversibility: irreversible
      blast: bulk
      data: pii
      cost: moderate
      visibility: internal
      persistence: posture
    default_gate: deny

  - id: supabase.auth.generate-link
    label: Générer un magic-link / recovery / invite
    reason: >-
      L'URL retournée permet de se connecter en tant que cet utilisateur.
      Si elle leak (logs, audit, mauvais destinataire), account takeover.
    matches: supabase.project[**].user[**].link[**].W
    vector:
      reversibility: reversible
      blast: single
      data: secret
      cost: free
      visibility: internal
      persistence: session
    default_gate: confirm

  - id: supabase.sso-provider.W
    label: Configurer un IdP SAML / OIDC
    reason: >-
      Posture identité fédérée. Une mauvaise config = toute personne avec
      un compte sur cet IdP peut se logger.
    matches: supabase.project[**].sso-provider[**].W
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    default_gate: deny

  - id: supabase.third-party-auth.W
    label: Configurer un provider tiers (Firebase, Auth0, …)
    reason: >-
      Idem SSO : posture identité, accepte de fédérer un IdP externe pour
      l'auth.
    matches: supabase.project[**].third-party-auth[**].W
    vector:
      reversibility: reversible
      blast: account
      data: metadata
      cost: free
      visibility: internal
      persistence: posture
    default_gate: deny

  - id: supabase.auth-config.W
    label: Modifier la config auth globale
    reason: >-
      JWT secret, expirations, allowed redirect URLs, signup policy. La
      moindre erreur ouvre/casse l'auth pour tous.
    matches: supabase.project[**].auth-config.W
    vector:
      reversibility: costly
      blast: account
      data: secret
      cost: free
      visibility: internal
      persistence: posture
    default_gate: deny

  # ───────────────────────────────────────────────────────────────────────
  # Plane `functions`
  # ───────────────────────────────────────────────────────────────────────

  - id: supabase.functions.read
    label: Lister / lire les Edge Functions (metadata + body)
    reason: >-
      Le body peut contenir des secrets inline si l'auteur a commit une
      clé en dur (anti-pattern fréquent).
    matches: supabase.project[**].edge-function[**].R
    vector:
      reversibility: reversible
      blast: single
      data: secret
      cost: free
      visibility: internal
      persistence: stateless
    default_gate: allow

  - id: supabase.functions.body.W
    label: Créer/modifier/supprimer le code d'une Edge Function
    reason: >-
      Modifier le code = injecter un comportement custom à chaque
      invocation. Reversible si la source est en git. Pattern bornée au
      niveau `edge-function[*]` strict pour ne pas capturer les writes
      enfants comme `function-deployment[*]`.
    matches: supabase.project[**].edge-function[*].W
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: free
      visibility: internal
      persistence: posture
    default_gate: confirm

  - id: supabase.functions.deploy
    label: Déployer une nouvelle version d'Edge Function
    reason: >-
      Bascule le runtime sur la nouvelle version. En prod = mutation
      immédiate du comportement public.
    matches: supabase.project[**].edge-function[**].function-deployment[**].W
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: moderate
      visibility: public
      persistence: posture
    default_gate: confirm
    acceptable_in_envs: [preview, staging, prod]

  - id: supabase.function-secret.W
    label: Créer/modifier/supprimer un function-secret
    reason: >-
      Secret prod consommé par les Edge Functions à runtime. Delete = peut
      casser la fct immédiatement, create/update = peut empoisonner.
    matches: supabase.project[**].function-secret[**].W
    vector:
      reversibility: costly
      blast: env
      data: secret
      cost: free
      visibility: internal
      persistence: posture
    default_gate: deny

  # ───────────────────────────────────────────────────────────────────────
  # Fallback — catch-all pour les writes non catégorisés.
  # ───────────────────────────────────────────────────────────────────────

  - id: supabase.uncategorized-write
    label: Écriture Supabase non catégorisée
    reason: >-
      Catch-all pour les writes qui n'ont pas été explicitement
      catégorisés. Signale qu'il manque une entrée au catalogue. Le lint
      CI doit empêcher qu'un tool tombe uniquement sur ce risk en prod.
    matches: supabase.**.W
    vector:
      reversibility: costly
      blast: env
      data: data
      cost: free
      visibility: internal
      persistence: session
    default_gate: confirm
